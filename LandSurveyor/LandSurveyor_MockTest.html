t_answer": 3, "rationale": "Bar diagram analysis: Statement (ii) (lowest profit margin in 2025) and (iv) are correct while (i) and (iii) are incorrect ((i) & (iii) incorrect, (ii) & (iv) correct)."}, {"id": "P1-Q049", "number": 49, "text": "In a survey, it was found that 20 people like product X, 25 liked product Y, 23 liked product Z. If 14 people liked products X and Y, 10 people liked products Y and Z, 8 people liked products X and Z and 6 liked all the three products. Find how many liked only one product?", "options": ["4", "7", "22", "11"], "correct_answer": 3, "rationale": "Venn diagram calculation: Only X = 20 - (8+2+0) = 4, Only Y = 25 - (8+4+6) = 7, Only Z = 23 - (2+4+6) = 11; sum of people liking only one product = 4 + 7 + 11 = 22."}, {"id": "P1-Q050", "number": 50, "text": "A man is facing towards east, he turns towards his left at 180° and again turns to his left 45°. In which direction is he facing now?", "options": ["North-east", "South-west", "West", "South"], "correct_answer": 2, "rationale": "Starting facing East (0°): turn left 180° points West (180°); then turn left 45° points South-West (225°)."}, {"id": "P1-Q051", "number": 51, "text": "Who among the following did NOT hold any responsibility in the opening or closing ceremony of the Glasgow 2026 Commonwealth Games?", "options": ["Weightlifter Mirabai Chanu", "Boxer Lovlina Borgohain", "Boxer Jaismine Lamboria", "Shooter Manu Bhaker"], "correct_answer": 4, "rationale": "Manu Bhaker is an Olympic double-medalist shooter; shooting was excluded from the sports programme for the Glasgow 2026 Commonwealth Games."}, {"id": "P1-Q052", "number": 52, "text": "What is the title of the upcoming autobiography of Sonia Gandhi?", "options": ["My Life, Memoir: My Journey", "The Red Sari: An Autobiography", "Courting Destiny: My Memoir", "Belonging: A Journey of Love"], "correct_answer": 4, "rationale": "Sonia Gandhi's upcoming memoir published by HarperCollins / Knopf is titled 'Belonging: A Journey of Love'."}, {"id": "P1-Q053", "number": 53, "text": "Under which Article of the Constitution of India has the Kerala (Alteration of Name) Bill, 2026 passed to rename the state of Kerala to \"Keralam\"?", "options": ["Article 1", "Article 3", "Article 5", "Article 7"], "correct_answer": 2, "rationale": "Alteration of state names and boundaries by Parliament is enacted under Article 3 of the Constitution of India."}, {"id": "P1-Q054", "number": 54, "text": "Consider the following pairs related to Grand Slam Tennis and winners in 2026:<br><br><table class=\"content-table\"><thead><tr><th>Tournament</th><th>Winner</th></tr></thead><tbody><tr><td>(a) Australian open</td><td>Alexander Zverev</td></tr><tr><td>(b) French open</td><td>Carlos Alcaraz</td></tr><tr><td>(c) Wimbledon</td><td>Jannik Sinner</td></tr></tbody></table><br><br>Which of the above pair/s is/are incorrectly matched?", "options": ["Only (a)", "(b) and (c)", "(a) and (b)", "Only (c)"], "correct_answer": 1, "rationale": "Jannik Sinner won the Australian Open; Alexander Zverev has never won the Australian Open, making pair (a) incorrectly matched (Only (a))."}, {"id": "P1-Q055", "number": 55, "text": "Which of the following districts are covered under the proposed Ecological Sensitive Area of Kasturirangan Report?<br><br>(a) Udupi, Uttara Kannada, Dakshina Kannada<br><br>(b) Hassan, Kodagu, Chikkamagaluru<br><br>(c) Dharwad, Bangalore Rural<br><br>(d) Belagavi, Mysuru, Chamarajanagar, Shivamogga", "options": ["(a) and (b)", "(a), (b) and (d)", "(b), (c) and (d)", "(a), (b), (c) and (d)"], "correct_answer": 2, "rationale": "The Kasturirangan report delineated Ecologically Sensitive Areas across 10 Western Ghats districts of Karnataka: UK, DK, Udupi, Hassan, Kodagu, Chikkamagaluru, Belagavi, Mysuru, Chamarajanagar, and Shivamogga ((a), (b) and (d))."}, {"id": "P1-Q056", "number": 56, "text": "In which of the following places has 'Buddha Rashmi Mani' former Director General of the National Museum of New Delhi has undertaken excavation work?<br><br>(a) Sarnath<br><br>(b) Ayodhya<br><br>(c) Dholavira<br><br>(d) Rakhigarhi<br><br>Select the correct answer using the codes given below:", "options": ["(a), (b) and (c)", "(b) and (d)", "(a), (b) and (d)", "(a) and (b)"], "correct_answer": 4, "rationale": "Dr. Buddha Rashmi Mani (former DG of National Museum) directed key archaeological excavations at Ayodhya and Sarnath ((a) and (b))."}, {"id": "P1-Q057", "number": 57, "text": "Expand MIST:", "options": ["Museum of Information, Science and Technology", "Museum of Innovation, Startup and Technology", "Ministry of Innovation, Startup and Technology", "Museum of Information, Science and Tourism"], "correct_answer": 2, "rationale": "The Karnataka Government initiative at NGEF Bengaluru is the Museum of Innovation, Startup and Technology (MIST)."}, {"id": "P1-Q058", "number": 58, "text": "Consider the following statements:<br><br>Statement I: The Sabka Bima, Sabki Raksha Act 2025 amended the Insurance Act, 1938 to strengthen policyholder protection.<br><br>Statement II: It aims to reduce foreign direct investment in the insurance sector.<br><br>Select the correct answer using the codes given below:", "options": ["Both statement I and II are correct and statement II is the correct explanation of Statement I", "Both statements I and II are correct, but statement II is not the correct explanation of Statement I", "Statement I is correct, but Statement II is incorrect", "Statement I is incorrect, but Statement II is correct"], "correct_answer": 3, "rationale": "Statement I is correct (insurance regulatory updates focus on policyholder security), but Statement II is incorrect (government policy has expanded and liberalized FDI, not reduced it)."}, {"id": "P1-Q059", "number": 59, "text": "Which former World Chess Champion was handed a two-year worldwide ban in 2026?", "options": ["Magnus Carlsen", "Garry Kasparov", "Vladimir Kramnik", "Veselin Topalov"], "correct_answer": 3, "rationale": "Former World Chess Champion Vladimir Kramnik was issued a disciplinary suspension/ban by FIDE in 2026."}, {"id": "P1-Q060", "number": 60, "text": "Consider the following statements regarding the UN Climate Change Conference:<br><br>(a) India recently withdrew its bid to host the COP-33 Summit scheduled for 2028.<br><br>(b) The COP-31 Summit is scheduled to be jointly organised by South Africa and Namibia.<br><br>(c) COP-30 Summit was hosted by Brazil.<br><br>Which of the above statements are correct?", "options": ["(a), (b) and (c)", "(a) and (b) only", "(a) and (c) only", "(b) and (c) only"], "correct_answer": 3, "rationale": "COP-30 was hosted by Brazil in Belém, and India submitted an official offer to host COP-33 in 2028 ((a) and (c) only)."}, {"id": "P1-Q061", "number": 61, "text": "Which of the following pairs are correct regarding Bhakti Movement?<br><br><table class=\"content-table\"><thead><tr><th>Saint</th><th>Place</th></tr></thead><tbody><tr><td>(a) Ramananda</td><td>Varanasi</td></tr><tr><td>(b) Vallabhacharya</td><td>Allahabad</td></tr><tr><td>(c) Chaitanya</td><td>Nadiya</td></tr><tr><td>(d) Ekanath</td><td>Paithan</td></tr></tbody></table>", "options": ["(a), (b) and (c)", "(a), (c) and (d)", "(a), (b) and (d)", "(c) and (d)"], "correct_answer": 2, "rationale": "Matching Bhakti saints with birthplaces/centres: Ramananda (Varanasi), Chaitanya (Nadiya), Ekanath (Paithan) ((a), (c) and (d))."}, {"id": "P1-Q062", "number": 62, "text": "Who was honored by Devaraya II with the title 'Dakshin Samudradipati'?", "options": ["Kumaravyasa", "Chamarasa", "Lakkanna Dandesh", "Vijaya Raya"], "correct_answer": 3, "rationale": "Lakkanna Dandesh, the Vijayanagara naval commander and prime minister under Devaraya II, was bestowed the title Dakshin Samudradipati."}, {"id": "P1-Q063", "number": 63, "text": "Consider the following statements with reference to 'Doctrine of Lapse' policy:<br><br>Statement-I: This policy was introduced by Lord Dalhousie.<br><br>Statement-II: Hyderabad was the first victim state to this policy.<br><br>Which of the following is correct with respect to the above statements?", "options": ["Both Statement-I and Statement-II are correct", "Both Statement-I and Statement-II are incorrect", "Statement-I is correct but Statement-II is incorrect", "Statement-I is incorrect but Statement-II is correct"], "correct_answer": 3, "rationale": "Statement I is correct (Doctrine of Lapse was applied by Dalhousie), but Statement II is incorrect (Satara was annexed first in 1848, not Hyderabad which was under Subsidiary Alliance)."}, {"id": "P1-Q064", "number": 64, "text": "Identify the correctly matched pairs:<br><br><table class=\"content-table\"><thead><tr><th>Poet / Author</th><th>Work</th></tr></thead><tbody><tr><td>(a) Allasani Peddanna</td><td>Manucharitamu</td></tr><tr><td>(b) Thimmana</td><td>Parijatapaharanamu</td></tr><tr><td>(c) Durjati</td><td>Kalahasti Shatakam</td></tr><tr><td>(d) Tenali Ramakrishna</td><td>Panduranga Mahathme</td></tr></tbody></table>", "options": ["(a), (b), (c) and (d)", "(a) and (b)", "(a) and (d)", "(b) and (c)"], "correct_answer": 1, "rationale": "All four literary works by the Ashtadiggajas (Allasani Peddanna, Nandi Thimmana, Dhurjati, Tenali Ramakrishna) in Krishnadevaraya's court are correctly matched ((a), (b), (c) and (d))."}, {"id": "P1-Q065", "number": 65, "text": "Match List-I with List-II and choose the correct answer:<br><br><table class=\"content-table\"><thead><tr><th>List - I (Rock Edict)</th><th>List - II (State)</th></tr></thead><tbody><tr><td>(a) Rupnath Rock Edict</td><td>(i) Karnataka</td></tr><tr><td>(b) Sahasram Rock Edict</td><td>(ii) Rajasthan</td></tr><tr><td>(c) Bairat Rock Edict</td><td>(iii) Bihar</td></tr><tr><td>(d) Maski Rock Edict</td><td>(iv) Madhya Pradesh</td></tr></tbody></table><br><br>Codes:", "options": ["a - i, b - ii, c - iii, d - iv", "a - iii, b - iv, c - i, d - ii", "a - ii, b - iii, c - iv, d - i", "a - iv, b - iii, c - ii, d - i"], "correct_answer": 4, "rationale": "Matching Ashokan minor rock edicts: Rupnath (Madhya Pradesh - iv), Sahasram (Bihar - iii), Bairat (Rajasthan - ii), Maski (Karnataka - i) (a-iv, b-iii, c-ii, d-i)."}, {"id": "P1-Q066", "number": 66, "text": "Arrange the following Diwans of Mysore in chronological order:<br><br>(a) Kantharaj Urs<br><br>(b) P.N Krishnamurti<br><br>(c) Mirza Ismail<br><br>(d) C. Rangacharlu", "options": ["(a), (b), (c), (d)", "(c), (d), (a), (b)", "(d), (b), (a), (c)", "(c), (a), (b), (d)"], "correct_answer": 3, "rationale": "Chronology of Mysuru Diwans: C. Rangacharlu (1881) -> P.N. Krishnamurti (1901) -> Kantharaj Urs (1918) -> Sir Mirza Ismail (1926) ((d), (b), (a), (c))."}, {"id": "P1-Q067", "number": 67, "text": "Consider the following statements with reference to the Swadeshi Movement:<br><br>(a) Importance to self-reliance.<br>(b) Development of national dignity, honour and self-confidence.<br>(c) In the economic field, fostering indigenous industries and other enterprises.<br>(d) Co-operation to the British rule.<br><br>Which of the above statements are correct?", "options": ["(a), (b) and (c)", "(b), (c) and (d)", "(a), (b) and (d)", "Only (c) and (d)"], "correct_answer": 1, "rationale": "The Swadeshi and Non-Cooperation movements emphasized self-reliance, national dignity, and indigenous industries while rejecting co-operation with British rule ((a), (b) and (c))."}, {"id": "P1-Q068", "number": 68, "text": "Consider the following statements regarding Ashoka:<br><br>Statement-I: After the Kalinga war, Ashoka abandoned the policy of aggression.<br><br>Statement-II: Ashoka renounced war, yet he continued his imperialist policy by consolidating the territories he had previously conquered.<br><br>Which of the following is correct with respect to the above statements?", "options": ["Both Statement-I and Statement-II are correct and Statement-II explains Statement-I", "Both Statement-I and Statement-II are correct but Statement-II does not explain Statement-I", "Statement-I is correct but Statement-II is incorrect", "Statement-I is incorrect but Statement-II is correct"], "correct_answer": 2, "rationale": "Both statements are correct: Ashoka renounced aggressive warfare after Kalinga while retaining and consolidating imperial control over existing territories."}, {"id": "P1-Q069", "number": 69, "text": "Identify the correctly matched pairs:<br><br><table class=\"content-table\"><thead><tr><th>Important sites of Indus Civilization</th><th>Name of the Archaeologists</th></tr></thead><tbody><tr><td>(a) Kot Diji</td><td>F.A. Khan</td></tr><tr><td>(b) Lothal</td><td>Dr. S.R. Rao</td></tr><tr><td>(c) Harappa</td><td>Daya Ram Sahani</td></tr><tr><td>(d) Mohenjo Daro</td><td>R.D. Banerji</td></tr></tbody></table>", "options": ["Only (a), (c) and (d)", "Only (b), (c) and (d)", "(a), (b), (c) and (d)", "Only (a), (b) and (d)"], "correct_answer": 3, "rationale": "All four Indus Valley Civilization archaeologists and their excavated sites (Kot Diji - F.A. Khan, Lothal - S.R. Rao, Harappa - Daya Ram Sahani, Mohenjo Daro - R.D. Banerji) are correctly matched ((a), (b), (c) and (d))."}, {"id": "P1-Q070", "number": 70, "text": "Arrange the following in chronological order:<br><br>(a) Jallianwala Bagh Massacre<br>(b) Kheda Satyagraha<br>(c) Champaran Satyagraha<br>(d) Non-Cooperation Movement", "options": ["(c), (a), (b), (d)", "(c), (a), (d), (b)", "(a), (b), (d), (c)", "(c), (b), (a), (d)"], "correct_answer": 4, "rationale": "Chronological sequence: Champaran Satyagraha (1917) -> Kheda Satyagraha (1918) -> Jallianwala Bagh (1919) -> Non-Cooperation Movement (1920) ((c), (b), (a), (d))."}, {"id": "P1-Q071", "number": 71, "text": "Match the Indian National Congress Presidents (List-I) with the respective Sessions (List-II):<br><br><table class=\"content-table\"><thead><tr><th>List – I (Presidents)</th><th>List – II (Sessions)</th></tr></thead><tbody><tr><td>(a) Vallabhbhai Patel</td><td>(i) Surat</td></tr><tr><td>(b) A.C. Mazumdar</td><td>(ii) Karachi</td></tr><tr><td>(c) Rash Behari Ghosh</td><td>(iii) Lucknow</td></tr><tr><td>(d) Badruddin Tyabji</td><td>(iv) Madras</td></tr></tbody></table><br><br>Codes:", "options": ["a – i, b – iii, c – iv, d – ii", "a – ii, b – iii, c – i, d – iv", "a – iii, b – ii, c – iv, d – i", "a – ii, b – i, c – iii, d – iv"], "correct_answer": 2, "rationale": "Matching INC Presidents with historic sessions: Sardar Patel (Karachi 1931 - ii), A.C. Mazumdar (Lucknow 1916 - iii), Rash Behari Ghosh (Surat 1907 - i), Badruddin Tyabji (Madras 1887 - iv) (a-ii, b-iii, c-i, d-iv)."}, {"id": "P1-Q072", "number": 72, "text": "Consider the following statements with reference to Queen Didda.<br><br>(a) Ruled Kashmir.<br>(b) Belonged to Lohara dynasty.<br>(c) She fought against Mahmud Ghazni.<br>(d) She acted as regent for her minor grandsons.<br><br>How many of the above statement/s is/are correct?", "options": ["One only", "Two only", "Three only", "All the four"], "correct_answer": 3, "rationale": "Three statements are correct: Queen Didda ruled Kashmir in the 10th century; Mahmud of Ghazni's invasion attempts occurred after her death in 1003 CE (Three only)."}, {"id": "P1-Q073", "number": 73, "text": "Consider the following statements related to Sir. M. Visvesvaraya.<br><br>Statement I: After resigning from the post of Diwan, he served as the Chairman of the executive committee of the Bhadravati Iron Factory for 6 years and received an honorarium of 2 lakh rupees.<br><br>Statement II: He donated his honorarium for the functioning of Bowring hospital, Bengaluru.<br><br>Which of the above statement/s is/are correct?", "options": ["Statement I only", "Statement II only", "Both Statement I and Statement II are correct", "Neither Statement I nor Statement II"], "correct_answer": 1, "rationale": "Sir M. Visvesvaraya chaired the Bhadravati Iron Works board for 6 years and donated his ₹2 lakh honorarium to establish the Occupational Institute (SJ Polytechnic) in Bangalore, not Bowring Hospital (Statement I only)."}, {"id": "P1-Q074", "number": 74, "text": "\"The Congress is tottering to its fall and one of my great ambitions, while in India, is to assist it to a peaceful demise\". The statement was declared by", "options": ["Lord Lytton", "Lord Dufferin", "Lord Hardinge", "Lord Curzon"], "correct_answer": 4, "rationale": "Lord Curzon famously wrote in 1900: 'The Congress is tottering to its fall and one of my great ambitions... is to assist it to a peaceful demise.'"}, {"id": "P1-Q075", "number": 75, "text": "Consider the following conquests of Krishnadevaraya:<br><br>(a) Battle of Dhoni<br>(b) The Odisha Campaign<br>(c) Siege of Gulbarga<br>(d) Siege of Vijayawada<br><br>Which of the following is the correct chronological order?", "options": ["(c), (b), (d), (a)", "(b), (c), (a), (d)", "(a), (c), (b), (d)", "(c), (b), (a), (d)"], "correct_answer": 3, "rationale": "Krishnadevaraya's military campaigns chronology: Battle of Dhoni (1510) -> Siege of Gulbarga -> Gajapati Odisha Campaign -> Siege of Vijayawada ((a), (c), (b), (d))."}, {"id": "P1-Q076", "number": 76, "text": "Whom did Mahmud Gawan support in the war of succession?", "options": ["Kapilendra Gajapati", "Hammiradeva", "Purushottam Gajapati", "Shailendra Gajapati"], "correct_answer": 2, "rationale": "During the Gajapati war of succession following Kapilendra Deva's death, Mahmud Gawan and the Bahmani Sultanate supported the elder son Hammiradeva (Hamviradeva)."}, {"id": "P1-Q077", "number": 77, "text": "Consider the following statements with reference to 'Praja Mitra Mandali':<br><br>(a) The organization was founded in 1919 in the Mysore state<br>(b) It was inspired by the Justice Party of Madras<br>(c) It supported the demand for responsible government<br>(d) It demanded greater representation for non-Brahmins in government services and the expansion of educational facilities.<br><br>How many of the above statement/s is/are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All the four statements are correct"], "correct_answer": 2, "rationale": "Praja Mitra Mandali was founded in 1917 (not 1919) and opposed immediate responsible government to avoid upper-caste hegemony, so only statements (b) and (d) are correct (Only two statements are correct)."}, {"id": "P1-Q078", "number": 78, "text": "Identify the correct chronology of Kadamba Kings:<br><br>(a) Kakusthavarma<br>(b) Mrigeshavarma<br>(c) Kangavarma<br>(d) Mayuravarma", "options": ["(d), (c), (b), (a)", "(d), (c), (a), (b)", "(d), (a), (b), (c)", "(d), (b), (c), (a)"], "correct_answer": 2, "rationale": "Chronology of Banavasi Kadamba Kings: Mayuravarma -> Kangavarma -> Kakusthavarma -> Mrigeshavarma ((d), (c), (a), (b))."}, {"id": "P1-Q079", "number": 79, "text": "To support the implementation of Deendayal Antyodaya National Rural Livelihood Mission objectives, Community Resource Persons [CRPs] are trained. Who among the following is not a trained CRPs from SHGs?", "options": ["Krishi Sakhi", "Grameen Sakhi", "Pashu Sakhi", "Bima Sakhi"], "correct_answer": 2, "rationale": "Under DAY-NRLM, community cadres from SHGs include Krishi Sakhi, Pashu Sakhi, Bank Sakhi, and Bima Sakhi; 'Grameen Sakhi' is not a designated cadre."}, {"id": "P1-Q080", "number": 80, "text": "Correctly match the committees in List-I with their recommendations in List-II:<br><br><table class=\"content-table\"><thead><tr><th>List – I (Committees)</th><th>List – II (Recommendations)</th></tr></thead><tbody><tr><td>(a) Govinda Rao Committee</td><td>(i) Recommended for the establishment of Farmers Welfare Fund and Raita Sanjeevini Health Insurance</td></tr><tr><td>(b) Nijalingappa Committee</td><td>(ii) Recommended abolition of Malnad and Bayaluseeme Area Development Boards</td></tr><tr><td>(c) G.K. Veeresh Committee</td><td>(iii) Recommended compulsory water cess on farmers of common area even if they are not using water for the maintenance of canals</td></tr><tr><td>(d) Nanjundappa Committee</td><td>(iv) Recommended establishment of Regional Development Boards</td></tr></tbody></table><br><br>Codes:", "options": ["a – ii, b – iii, c – i, d – iv", "a – i, b – ii, c – iii, d – iv", "a – iv, b – ii, c – i, d – iii", "a – iv, b – iii, c – ii, d – i"], "correct_answer": 1, "rationale": "Matching Karnataka committees with recommendations: Govinda Rao (abolish Malnad/Bayaluseeme boards - ii), Nijalingappa (water cess - iii), Veeresh (farmer welfare fund - i), Nanjundappa (regional boards - iv) (a-ii, b-iii, c-i, d-iv)."}, {"id": "P1-Q081", "number": 81, "text": "Expand KITS.", "options": ["Kempegowda Industrial and Technical Society", "Karnataka Innovation and Technology Society", "Karnataka Institute for Transforming Society", "Karnataka Industrial and Technical Society"], "correct_answer": 2, "rationale": "KITS in Karnataka state governance stands for Karnataka Innovation and Technology Society."}, {"id": "P1-Q082", "number": 82, "text": "The process of improving the nutritional value of food crops is called", "options": ["Bioengineering", "Biofortification", "Biogenetics", "Bioinformatics"], "correct_answer": 2, "rationale": "Biofortification is the agronomic and genetic process of breeding agricultural crops to enhance their nutritional quality."}, {"id": "P1-Q083", "number": 83, "text": "In which year, the major amendment for Karnataka Land Reforms Act, 1961 was introduced?", "options": ["1974", "1999", "2026", "2006"], "correct_answer": 1, "rationale": "The landmark amendment to the Karnataka Land Reforms Act conferring full ownership on tillers was enacted in 1974 under Chief Minister D. Devaraj Urs."}, {"id": "P1-Q084", "number": 84, "text": "Consider the following statements related to Karnataka Land Reforms Act, 1961:<br><br>Statement-I: Section 48(i)(ii) of Land Reforms Act, 1961 allows the Government of Karnataka to constitute land tribunals at Taluk level.<br><br>Statement-II: Land tribunals constituted at Taluk level consists four non-official members. One of them shall be a person belonging to a Scheduled Caste/Scheduled Tribe.<br><br>Which of the above statement/s is/are correct?", "options": ["Statement-I is correct but Statement-II is incorrect", "Statement-I is incorrect but Statement-II is correct", "Both Statements I and II are correct", "Both Statements I and II are incorrect"], "correct_answer": 3, "rationale": "Both statements are correct: Section 48 of Karnataka Land Reforms Act 1961 authorizes taluk Land Tribunals, which comprise four non-official members including at least one SC/ST member."}, {"id": "P1-Q085", "number": 85, "text": "Consider the following statements regarding the 2011 census:<br><br>(a) As per the 2011 census, Karnataka's sex ratio is 973<br>(b) As per the 2011 census, the district with the highest child sex ratio is Udupi<br>(c) As per the 2011 census, the district with the lowest child sex ratio is Vijayapura<br>(d) As per the 2011 census, the district with the lowest sex ratio is Bengaluru urban<br><br>Choose the correct statement/statements", "options": ["(a) and (b) only", "(b) and (c) only", "(a), (b) and (c) only", "(a), (c) and (d) only"], "correct_answer": 4, "rationale": "According to the 2011 Census, Karnataka's sex ratio is 973, Bengaluru Urban is lowest (916), and Kodagu has highest child sex ratio (Udupi is highest overall, making (b) false; (a), (c) and (d) are correct)."}, {"id": "P1-Q086", "number": 86, "text": "The main objectives of land reforms is/are<br><br>(a) Transfer of land ownership from tenant to tiller<br>(b) Transfer of land ownership from tiller to tenant<br>(c) Transfer of land ownership from tenant to tenant<br>(d) Transfer of land ownership from tiller to tiller", "options": ["(a) only", "(b) only", "(a), (b) and (c) only", "(a), (b) and (d) only"], "correct_answer": 1, "rationale": "The core objective of land reforms is 'Land to the Tiller'—transferring ownership from non-cultivating landlords/tenancy to cultivating tillers ((a) only)."}, {"id": "P1-Q087", "number": 87, "text": "Consider the following statements:<br><br>Statement-I: Gender Inequality Index [GII] across districts in Karnataka indicates lesser variations.<br><br>Statement-II: It is accounted for social participation at local level.<br><br>Which one of the following is correct in respect of the above statements?", "options": ["Both Statement-I and Statement-II are correct and Statement-II explains Statement-I.", "Both Statement-I and Statement-II are correct, but Statement-II does not explain Statement-I.", "Statement-I is correct, but Statement-II is incorrect", "Statement-I is incorrect, but Statement-II is correct"], "correct_answer": 4, "rationale": "Statement I is incorrect because the Human Development Report shows substantial inter-district variations in Gender Inequality Index (GII); Statement II is correct."}, {"id": "P1-Q088", "number": 88, "text": "Squared Poverty Gap Index determines<br><br>(a) Degree of poverty for each individual<br>(b) Degree of poverty for a given area<br>(c) Degree of poverty for each household<br>(d) Degree of poverty and unemployment<br><br>Which of the above statement/s is/are correct?", "options": ["(a), (b) and (c)", "(a), (c) and (d)", "(b), (c) and (d)", "(a), (b) and (d)"], "correct_answer": 1, "rationale": "The Foster-Greer-Thorbecke Squared Poverty Gap Index ($P_2$) measures the severity of poverty across individuals, households, and areas, but does not measure unemployment ((a), (b) and (c))."}, {"id": "P1-Q089", "number": 89, "text": "Match List-I with List-II:<br><br><table class=\"content-table\"><thead><tr><th>List – I (Boards)</th><th>List – II (Places)</th></tr></thead><tbody><tr><td>(a) Coconut Development Board</td><td>(i) Gurgaon, Haryana</td></tr><tr><td>(b) National Horticulture Board</td><td>(ii) Kochi, Kerala</td></tr><tr><td>(c) National Turmeric Board</td><td>(iii) Guntur, Andhra Pradesh</td></tr><tr><td>(d) Tobacco Board</td><td>(iv) Nizamabad, Telangana</td></tr></tbody></table><br><br>Codes:", "options": ["a – i, b – ii, c – iii, d – iv", "a – ii, b – iii, c – i, d – iv", "a – iv, b – iii, c – ii, d – i", "a – ii, b – i, c – iv, d – iii"], "correct_answer": 4, "rationale": "Matching statutory commodity boards with headquarters: Coconut Board (Kochi - ii), Horticulture Board (Gurgaon - i), Turmeric Board (Nizamabad - iv), Tobacco Board (Guntur - iii) (a-ii, b-i, c-iv, d-iii)."}, {"id": "P1-Q090", "number": 90, "text": "Choose the correct statements given below regarding Pradhan Mantri Annadata Aay Sanrakshan Abhiyan (PM-AASHA) Scheme:<br><br>(a) The Scheme was launched in 2018<br>(b) Is a Price Support Scheme<br>(c) Is a Price Deficit Payment Scheme<br>(d) Is a Market Intervention Scheme<br><br>Which of the above statements are correct?", "options": ["(b), (c) and (d)", "(a), (b) and (c)", "(a), (b), (c) and (d)", "(b) and (d)"], "correct_answer": 3, "rationale": "PM-AASHA was launched in September 2018 and integrates Price Support Scheme (PSS), Price Deficiency Payment Scheme (PDPS), and Market Intervention Scheme (MIS) ((a), (b), (c) and (d))."}, {"id": "P1-Q091", "number": 91, "text": "The Global Methane Pledge (GMP) aims to cut down Methane emissions from 2020 levels by 2030 is", "options": ["80 percent", "40 percent", "50 percent", "30 percent"], "correct_answer": 4, "rationale": "The Global Methane Pledge (launched at COP26) commits participants to collectively reduce anthropogenic methane emissions by at least 30 percent from 2020 levels by 2030."}, {"id": "P1-Q092", "number": 92, "text": "In 2025-26, which long-term program was announced to increase pulse production in India?", "options": ["Nine-years Pulse Mission", "Six-years Pulse Mission", "Ten-years Pulse Mission", "Seven-years Pulse Mission"], "correct_answer": 2, "rationale": "The Government of India launched the Mission for Aatmanirbharta in Pulses as a Six-years Pulse Mission spanning from 2025-26 to 2030-31."}, {"id": "P1-Q093", "number": 93, "text": "Consider the following statements:<br><br>Statement-I : Loan waivers alone can ensure sustainable agricultural development.<br><br>Statement-II : Sustainable agricultural development depends on productivity, infrastructure, technology and market access.<br><br>Which of the following is correct with respect to the above statements?", "options": ["Both Statement-I and Statement-II are correct", "Statement-I is correct but Statement-II is incorrect", "Statement-II is correct, but Statement-I is incorrect", "Both Statement-I and Statement-II are incorrect"], "correct_answer": 3, "rationale": "Statement II is correct (sustainable development requires systemic investments in infrastructure, technology, and markets), but Statement I is incorrect (loan waivers alone do not ensure sustainability)."}, {"id": "P1-Q094", "number": 94, "text": "Select the correct statement from the following.", "options": ["Thimmappanagudi Iron Ore Mining Centre is in Tumkur district", "Janikunta Iron Ore Mining Centre is located at Ballari district", "Donimalai Iron Ore Mining Centre is situated at Kalburgi", "Kallur Limestone Mine is in Ballari"], "correct_answer": 2, "rationale": "Janikunta Iron Ore Mining Centre is located in Ballari district (Thimmappanagudi is also in Ballari, not Tumkur; Donimalai is in Ballari, not Kalaburagi)."}, {"id": "P1-Q095", "number": 95, "text": "Consider the following pairs:<br><br><table class=\"content-table\"><thead><tr><th>Thermal Plant</th><th>Located District</th></tr></thead><tbody><tr><td>(a) Annechakanahalli</td><td>Hassan</td></tr><tr><td>(b) Kalkunike</td><td>Ballari</td></tr><tr><td>(c) Hanakona</td><td>Uttara Kannada</td></tr></tbody></table><br><br>Which of the above pairs is/are correctly matched?", "options": ["(a) only", "(a) and (c) only", "(c) only", "(a), (b) and (c)"], "correct_answer": 2, "rationale": "Annechakanahalli thermal project is in Hassan district and Hanakona thermal plant was proposed in Uttara Kannada district; Kalkunike is in Mysuru ((a) and (c) only)."}, {"id": "P1-Q096", "number": 96, "text": "Consider the following statements with reference to Karnataka's coasts:<br><br>Statement-I: Karnataka coast is also called Mackerel coast<br><br>Statement-II : Mackerel fishes are more in the Karnataka coast<br><br>Which of the above statement/s is correct?", "options": ["Only Statement-I is correct", "Both Statement-I and Statement-II are correct", "Statement-I is correct but Statement-II is incorrect", "Statement-II is correct but Statement-I is incorrect"], "correct_answer": 2, "rationale": "Both statements are correct: Karnataka coast is known as the 'Mackerel Coast' due to the abundance of mackerel (Rastrelliger kanagurta) landings along the Canara shoreline."}, {"id": "P1-Q097", "number": 97, "text": "IIHR Institution is located in which of the following cities?", "options": ["Bengaluru", "Hubballi", "Bagalkot", "Mysuru"], "correct_answer": 1, "rationale": "The ICAR-Indian Institute of Horticultural Research (IIHR) is headquartered at Hessaraghatta in Bengaluru."}, {"id": "P1-Q098", "number": 98, "text": "Consider the following agricultural interventions:<br><br>(a) Crop diversification<br>(b) Minimum tillage<br>(c) Residue retention<br>(d) Weather-based insurance<br>(e) Community agriculture<br><br>Which of the above interventions are included in the ‘Climate-Smart Village approach’ in India?", "options": ["(a), (c), (d) and (e)", "(b), (c), (d) and (e)", "(a), (b), (c) and (d)", "(a), (b), (d) and (e)"], "correct_answer": 3, "rationale": "Interventions in the Climate-Smart Village approach include crop diversification, minimum tillage, residue retention, and weather-based insurance ((a), (b), (c) and (d))."}, {"id": "P1-Q099", "number": 99, "text": "In South India, the summer rainfall is known as coffee blossoms. This summer rainfall is called _________.", "options": ["Orographic rainfall", "Convectional rainfall", "Cyclonic rainfall", "Monsoon rainfall"], "correct_answer": 2, "rationale": "Pre-monsoon summer showers in Karnataka (coffee blossoms / mango showers) are local convectional rainfalls triggered by intensive diurnal thermal heating."}, {"id": "P1-Q100", "number": 100, "text": "Arrange the below mentioned types of iron ore according to the iron content in lowest to highest order:<br><br>(a) Hematite<br>(b) Siderite<br>(c) Magnetite<br>(d) Limonite", "options": ["(a), (b), (c), (d)", "(b), (d), (a), (c)", "(d), (b), (c), (a)", "Option 4"], "correct_answer": 2, "rationale": "Iron content in ores from lowest to highest: Siderite (~48% Fe) -> Limonite (~60% Fe) -> Hematite (~70% Fe) -> Magnetite (~72.4% Fe) ((b), (d), (a), (c))."}]}, {"paper": "Paper 2", "title": "Specific Paper (Surveying, Mathematics & Engineering)", "duration_minutes": 120, "total_questions": 100, "marking": {"correct": 1.0, "wrong": -0.25, "unattempted": 0.0}, "questions": [{"id": "P2-Q001", "number": 1, "text": "The physical significance of the Gauss's law for magnetism (∇· B⃗ = 0) is", "options": ["The magnetic field is conservative", "Magnetic monopoles do not exist", "Magnetic fields are produced only by static electric charges.", "The magnetic field is directly proportional to the enclosed electric current."], "correct_answer": 2, "rationale": "Gauss's law for magnetism (div B = 0) physically signifies that magnetic monopoles do not exist; magnetic flux lines are continuous closed loops."}, {"id": "P2-Q002", "number": 2, "text": "Arrange the following steps in a communication process in sequential order:<br><br>(a) Modulation<br><br>(b) Message signal<br><br>(c) Reception<br><br>(d) Demodulation<br><br>(e) Transmission", "options": ["(a) → (b) → (c) → (d) → (e)", "(b) → (a) → (e) → (c) → (d)", "(a) → (c) → (b) → (e) → (d)", "(c) → (b) → (a) → (d) → (e)"], "correct_answer": 2, "rationale": "Standard sequence in a communication system: Message signal -> Modulation -> Transmission -> Reception -> Demodulation ((b) -> (a) -> (e) -> (c) -> (d))."}, {"id": "P2-Q003", "number": 3, "text": "Match the following:<br><br><table class=\"content-table\"><thead><tr><th>List-I (Physical Quantity)</th><th>List-II (SI Unit)</th></tr></thead><tbody><tr><td>(a) Electric charge</td><td>(i) Ohm-meter (Ω-m)</td></tr><tr><td>(b) Electric current</td><td>(ii) Watt (W)</td></tr><tr><td>(c) Resistivity</td><td>(iii) Coulomb (C)</td></tr><tr><td>(d) Power</td><td>(iv) Ampere (A)</td></tr></tbody></table><br><br>Codes:", "options": ["a - ii, b - i, c - iii, d - iv", "a - iii, b - iv, c - i, d - ii", "a - iii, b - ii, c - iv, d - i", "a - i, b - iv, c - ii, d - iii"], "correct_answer": 2, "rationale": "Matching SI units: Electric charge (Coulomb - iii), Electric current (Ampere - iv), Resistivity (Ohm-meter - i), Power (Watt - ii) (a-iii, b-iv, c-i, d-ii)."}, {"id": "P2-Q004", "number": 4, "text": "An alpha particle enters into a uniform magnetic field in perpendicular direction. Then it moves", "options": ["Perpendicular to magnetic field in a straight line", "Parallel to magnetic field", "In a circular orbit", "Comes to rest"], "correct_answer": 3, "rationale": "Lorentz magnetic force F = q(v x B) acts perpendicular to both velocity and magnetic field, providing centripetal force that produces circular motion."}, {"id": "P2-Q005", "number": 5, "text": "Match the following:<br><br><table class=\"content-table\"><thead><tr><th>List-I (Radiation)</th><th>List-II (Wavelength Range (in Å))</th></tr></thead><tbody><tr><td>(a) Ultraviolet radiation</td><td>(i) 0.01 Å to 1 Å</td></tr><tr><td>(b) X-rays</td><td>(ii) 7000 Å to 20000 Å</td></tr><tr><td>(c) Infrared radiation</td><td>(iii) 1000 Å to 4000 Å</td></tr><tr><td>(d) Gamma radiation</td><td>(iv) 1 Å to 100 Å</td></tr></tbody></table><br><br>Codes:", "options": ["a - iii, b - iv, c - i, d - ii", "a - ii, b - i, c - iv, d - iii", "a - iv, b - iii, c - i, d - ii", "a - iii, b - iv, c - ii, d - i"], "correct_answer": 4, "rationale": "Matching electromagnetic spectrum wavelength ranges: Ultraviolet (1000-4000 Å - iii), X-rays (1-100 Å - iv), Infrared (7000-20000 Å - ii), Gamma rays (0.01-1 Å - i) (a-iii, b-iv, c-ii, d-i)."}, {"id": "P2-Q006", "number": 6, "text": "For a composite molecule to be Raman active,", "options": ["It should possess a permanent dipole moment.", "It should possess a temporary dipole moment.", "It should exhibit changes in polarizability.", "It should be a linear molecule"], "correct_answer": 3, "rationale": "The quantum mechanical selection rule for Raman activity requires that the molecular vibration or rotation produces a change in the polarizability of the molecule."}, {"id": "P2-Q007", "number": 7, "text": "Gravitational potential energy<br><br>(a) Increases with increase in height from the surface of the earth<br><br>(b) Decreases with increase in height from the surface of the earth<br><br>(c) Is maximum at infinite distance from the surface of the earth<br><br>(d) Is zero at infinite distance from the surface of the earth.<br><br>Which of the above statements is/are correct?", "options": ["(a), (b) and (c)", "(b) only", "(a), (b), (c) and (d)", "(a), (c) and (d)"], "correct_answer": 4, "rationale": "Gravitational potential energy U = -GMm/r: it increases with height, approaches zero at infinite distance, and achieves its maximum value of zero at infinity ((a), (c) and (d))."}, {"id": "P2-Q008", "number": 8, "text": "Which of the following are the methods regarding measuring of the velocity of ultrasonic waves in a solid?<br><br>(a) Pulse-echo method<br><br>(b) Young's modulus method<br><br>(c) Piezoelectric method<br><br>(d) Ferroelectric method<br><br>Choose the correct option.", "options": ["(a), (b), (c) and (d)", "(c) and (d)", "(a) and (c)", "(d) only"], "correct_answer": 3, "rationale": "In solid-state physics, the velocity of ultrasonic waves in solids is experimentally determined using pulse-echo techniques and piezoelectric transducers ((a) and (c))."}, {"id": "P2-Q009", "number": 9, "text": "Statement I: The speed of a transverse wave in a stretched string varies directly with the square root of the mass per unit length of the wave.<br><br>Statement II: All the particles oscillate with same amplitude in a stationary wave<br><br>Pick the correct answer regarding the above statements", "options": ["Statement I is incorrect but Statement II is correct", "Both Statement I and Statement II are correct", "Statement I is correct but Statement II is incorrect", "Both Statement I and Statement II are incorrect"], "correct_answer": 4, "rationale": "Both statements are incorrect: wave speed v = sqrt(T/mu) varies inversely with the square root of linear mass density, and in stationary waves particles vibrate with varying amplitudes (zero at nodes, max at antinodes)."}, {"id": "P2-Q010", "number": 10, "text": "Our body gives heat to the surroundings and receives heat from the surroundings by the process of", "options": ["Conduction", "Convection", "Radiation", "Both Convection and Radiation"], "correct_answer": 4, "rationale": "The human body exchanges heat with the ambient environment primarily through combined thermal convection and infrared radiation."}, {"id": "P2-Q011", "number": 11, "text": "Consider the following statements and choose the correct option:<br><br>Statement I: Photogrammetry is used in stereoscopic measurements of human body using X-rays<br><br>Statement II: Accuracy of contours and cross-sections depends on the accuracy of 3D models generation from stereophotographs", "options": ["Both Statements I and II are correct, but Statement II is not related to Statement I", "Both Statements I and II are correct, and Statement II is related to Statement I", "Statement I is correct, but Statement II is incorrect", "Statement I is incorrect, but Statement II is correct"], "correct_answer": 1, "rationale": "Both statements are correct facts (X-ray photogrammetry is used in medical biostereometrics; DEM/cross-section accuracy depends on 3D stereo model quality), but Statement II is not directly related to Statement I."}, {"id": "P2-Q012", "number": 12, "text": "Match the concepts in List - I with their explanations in List - II and choose the correct answer:<br><br><table class=\"content-table\"><thead><tr><th>List - I (Concepts)</th><th>List - II (Explanations)</th></tr></thead><tbody><tr><td>(a) Exposure station</td><td>(i) The flying path an aircraft takes while taking the photographs</td></tr><tr><td>(b) Flightline</td><td>(ii) It is a vertical line from exposure station indicating the direction of gravity</td></tr><tr><td>(c) Perspective centre</td><td>(iii) Location of aircraft in the air at the time of taking photograph</td></tr><tr><td>(d) Plumbline</td><td>(iv) The point of origin or termination of bundles of perspective light rays</td></tr></tbody></table><br><br>Codes:", "options": ["a - i, b - ii, c - iii, d - iv", "a - iv, b - i, c - iii, d - ii", "a - ii, b - iii, c - iv, d - i", "a - iii, b - i, c - iv, d - ii"], "correct_answer": 4, "rationale": "Matching photogrammetric concepts: Exposure station (aircraft position - iii), Flightline (flight path - i), Perspective centre (origin/termination of light rays - iv), Plumbline (vertical gravity line - ii) (a-iii, b-i, c-iv, d-ii)."}, {"id": "P2-Q013", "number": 13, "text": "Assume a vertical photograph was taken at a flying height of 5000 m above sea level using a camera with a 152 mm focal length lens, determine the photo scale points A and B, while they lie at elevations of 1200 m and 1960 m.", "options": ["1 : 25,000 - SA<br>    1 : 20,000 - SB", "1 : 20,000 - SA<br>    1 : 25,000 - SB", "1 : 25,000 - SA<br>    1 : 30,000 - SB", "1 : 30,000 - SA<br>    1 : 25,000 - SB"], "correct_answer": 1, "rationale": "Photo scale formula S = f / (H - h): S_A = 0.152 / (5000 - 1200) = 1/25000; S_B = 0.152 / (5000 - 1960) = 1/20000 (1:25,000 for A, 1:20,000 for B)."}, {"id": "P2-Q014", "number": 14, "text": "A line AB appears measuring 12.70 cm on an aerial photograph and the corresponding line measures 2.54 cm on a map at a scale 1/50,000. The terrain has an average elevation of 200 m above MSL. Calculate the flying height of aircraft, above MSL, if the photograph was taken with camera of 16 cm focal length.", "options": ["1600 m", "2000 m", "1800 m", "1400 m"], "correct_answer": 3, "rationale": "Ground distance = 2.54 cm * 50000 = 1270 m. Photo scale = 0.127 / 1270 = 1/10000 = f / (H - h) = 0.16 / (H - 200) => H = 1600 + 200 = 1800 m."}, {"id": "P2-Q015", "number": 15, "text": "The reference points, precisely located on both the ground and the photo whose three dimensional co-ordinates, are known as", "options": ["Scale", "Control points", "Principle points", "Photograph centre"], "correct_answer": 2, "rationale": "Ground Control Points (GCPs) or control points are physical features accurately identifiable on photographs with known three-dimensional ground coordinates."}, {"id": "P2-Q016", "number": 16, "text": "Which of the following data sources can be used to generate a Digital Elevation Model (DEM)?", "options": ["Topographic maps, stereo-air photos and stereo-satellite images", "Only land survey data and GPS coordinates", "Weather radar data and satellite thermal images", "Multispectral satellite images and Sonar data"], "correct_answer": 1, "rationale": "Digital Elevation Models (DEMs) are conventionally generated from contour topographic maps, stereo-aerial photographs, and stereo-satellite optical imagery."}, {"id": "P2-Q017", "number": 17, "text": "Remote sensing is best described as", "options": ["Acquiring information about any object without physical contact", "The measurement of celestial bodies", "Study of atmospheric pressure", "The measurement of soil characteristics"], "correct_answer": 1, "rationale": "Remote sensing is defined as the science and art of gathering information about an object, area, or phenomenon without making physical contact with it."}, {"id": "P2-Q018", "number": 18, "text": "Consider the following statements and choose the correct option:<br><br>Statement I: Electromagnetic radiation is a form of energy, that travels with a speed of light (3 × 10⁸ m/sec) in a harmonic pattern<br><br>Statement II: It has two fields: (i) Electric field and (ii) Magnetic field", "options": ["Both Statements I and II are correct but Statement II is not related to Statement I", "Both Statements I and II are correct and Statement II is related to Statement I", "Statement I is incorrect, but Statement II is correct", "Statement I is correct, but Statement II is incorrect"], "correct_answer": 2, "rationale": "Both statements are correct: Electromagnetic radiation propagates at the speed of light in a harmonic transverse wave composed of orthogonal electric and magnetic fields."}, {"id": "P2-Q019", "number": 19, "text": "The different stages of digital image processing in remote sensing are listed below<br><br>(a) Image enhancement<br><br>(b) Image preprocessing<br><br>(c) Image classification<br><br>(d) Image transformation<br><br>Identify the correct sequence.", "options": ["(a), (b), (c), (d)", "(b), (a), (d), (c)", "(d), (b), (a), (c)", "(c), (a), (b), (d)"], "correct_answer": 2, "rationale": "Sequential workflow of digital image processing in remote sensing: Preprocessing -> Enhancement -> Transformation -> Classification ((b), (a), (d), (c))."}, {"id": "P2-Q020", "number": 20, "text": "Which of the following is true regarding the Indian Regional Navigation Satellite System (IRNSS)?", "options": ["It consists of three satellites", "It is a global positioning system", "It was developed by the Department of Defence, USA", "It is also known as NavIC and provides navigation signals over India and surrounding regions"], "correct_answer": 4, "rationale": "The Indian Regional Navigation Satellite System (IRNSS), commercially designated NavIC, is an autonomous regional constellation providing positioning over India and adjoining areas."}, {"id": "P2-Q021", "number": 21, "text": "Which of the following problems is resolved by adding a 4ᵗʰ satellite observation to the minimum 3-range measurements needed for location tracking in GPS?", "options": ["To calculate the exact velocity of the moving observer", "To measure the undulating shape of the earth", "To solve for the clock synchronisation error between the receiver and the satellite", "To boost the weak satellite signals so that they can work indoors"], "correct_answer": 3, "rationale": "A 4th satellite observation provides the 4th independent pseudo-range equation necessary to solve for receiver clock bias/synchronization error (delta-t)."}, {"id": "P2-Q022", "number": 22, "text": "What does synchronisation do in a GIS database?", "options": ["It speeds up computer internet connection", "It refers to conversion of vector data models to raster grid automatically", "It refers to forms of protection against inconsistencies that can result from multiple simultaneous users", "To build public web application without needing custom code"], "correct_answer": 3, "rationale": "In multi-user enterprise GIS geodatabases, synchronization manages conflict resolution and preserves transaction consistency during concurrent edits by multiple users."}, {"id": "P2-Q023", "number": 23, "text": "What is the correct sequence of the 4 M's in a standard GIS framework?<br><br>(a) Mapping<br><br>(b) Monitoring<br><br>(c) Modelling<br><br>(d) Measurement", "options": ["(a), (b), (c), (d)", "(d), (a), (b), (c)", "(c), (a), (d), (b)", "(a), (c), (b), (d)"], "correct_answer": 2, "rationale": "The standardized 4 M's framework of GIS operations follows the logical workflow: Measurement -> Mapping -> Monitoring -> Modelling ((d), (a), (b), (c))."}, {"id": "P2-Q024", "number": 24, "text": "Consider the following statements:<br><br>Statement - I : GNSS can be easily integrated with total station data and GIS<br><br>Statement - II : GNSS gives precise results in areas like forest, under a bridge, tunnel etc.<br><br>Which one of the following is correct in respect of the above statements?", "options": ["Both Statement-I and Statement-II are correct and Statement-II is related to Statement-I", "Both Statement-I and Statement-II are correct but Statement-II is not related to Statement-I", "Statement-I is incorrect but Statement-II is correct", "Statement-I is correct but Statement-II is incorrect"], "correct_answer": 4, "rationale": "Statement I is correct (modern survey systems seamlessly integrate GNSS, Total Station, and GIS), but Statement II is incorrect (GNSS signals suffer severe loss of lock/multipath under dense forest canopy, bridges, and inside tunnels)."}, {"id": "P2-Q025", "number": 25, "text": "Which of the following statements about the Continuously Operating Reference Stations (CORS) Network is incorrect?", "options": ["CORS continuously receives signals from GNSS stations", "Karnataka CORS network provides correction data for accurate positioning and surveying", "CORS operate 24/7 and serve as reference points for correcting GNSS measurements", "CORS data does not support GNSS surveying."], "correct_answer": 4, "rationale": "Statement (4) is incorrect because CORS networks are fundamentally engineered to provide continuous carrier-phase corrections specifically to support high-precision GNSS surveying."}, {"id": "P2-Q026", "number": 26, "text": "Match the following Dilution of Precision (DoP) in List-I with the Satellite Geometry in List-II:<br><br><table class=\"content-table\"><thead><tr><th>List - I (Dilution of Precision)</th><th>List - II (Satellite Geometry)</th></tr></thead><tbody><tr><td>(a) HDoP</td><td>(i) Better satellite geometry</td></tr><tr><td>(b) PDoP</td><td>(ii) Poor satellite geometry</td></tr><tr><td>(c) Low DoP</td><td>(iii) Accuracy of horizontal position</td></tr><tr><td>(d) High DoP</td><td>(iv) Position accuracy in 3-dimension</td></tr></tbody></table><br><br>Codes:", "options": ["a - iii, b - iv, c - i, d - ii", "a - iii, b - i, c - iv, d - ii", "a - i, b - ii, c - iii, d - iv", "a - i, b - iii, c - ii, d - iv"], "correct_answer": 1, "rationale": "Matching Dilution of Precision (DoP) parameters: HDoP (horizontal accuracy - iii), PDoP (3D position accuracy - iv), Low DoP (favorable geometry - i), High DoP (poor geometry - ii) (a-iii, b-iv, c-i, d-ii)."}, {"id": "P2-Q027", "number": 27, "text": "Selective Availability in GPS signal is a", "options": ["Natural error", "Intentional error", "Systematic error", "Bias error"], "correct_answer": 2, "rationale": "Selective Availability (SA) was an intentional degradation of GPS satellite signals introduced by the US Department of Defense to limit public positioning accuracy."}, {"id": "P2-Q028", "number": 28, "text": "Arrange the following steps in the correct sequence for obtaining position using DGPS:<br><br>(a) Correction data is transmitted to the rover.<br><br>(b) Rover determines its position using satellite signals.<br><br>(c) Base station is established at a known point<br><br>(d) Base station calculates the GPS errors<br><br>(e) Correct co-ordinates of the rovers are obtained", "options": ["(c), (b), (d), (a), (e)", "(c), (d), (a), (b), (e)", "(d), (c), (b), (a), (e)", "(b), (c), (a), (d), (e)"], "correct_answer": 2, "rationale": "DGPS positioning sequence: Base station established at known point (c) -> Base calculates pseudo-range errors (d) -> Corrections transmitted to rover (a) -> Rover computes position (b) -> Correct coordinates obtained (e) ((c), (d), (a), (b), (e))."}, {"id": "P2-Q029", "number": 29, "text": "Match List-I with List-II with respect to Real Time Kinematic (RTK) surveying and select the correct answer using the codes given below:<br><br><table class=\"content-table\"><thead><tr><th>List - I (RTK Surveying Component)</th><th>List - II (Description)</th></tr></thead><tbody><tr><td>(a) Base station</td><td>(i) Receives correction data and determines the rover position</td></tr><tr><td>(b) Rover receiver</td><td>(ii) Transmits corrections from the base station to the rover</td></tr><tr><td>(c) Data link</td><td>(iii) A signal distortion that happens when satellite waves bounce off nearby surfaces</td></tr><tr><td>(d) Multipath error</td><td>(iv) GNSS receiver established over a known coordinate point.</td></tr></tbody></table><br><br>Codes:", "options": ["a - i, b - iv, c - iii, d - ii", "a - i, b - ii, c - iv, d - iii", "a - iv, b - i, c - ii, d - iii", "a - iv, b - ii, c - i, d - iii"], "correct_answer": 3, "rationale": "Matching Real Time Kinematic (RTK) components: Base station (known coordinate receiver - iv), Rover (computes position - i), Data link (transmits corrections - ii), Multipath (reflected signal distortion - iii) (a-iv, b-i, c-ii, d-iii)."}, {"id": "P2-Q030", "number": 30, "text": "Which of the following best describes a satellite constellation?", "options": ["A single satellite placed in a fixed orbit", "A group of satellites working together to provide continuous or improved coverage", "A ground-based network of GNSS receivers", "A satellite tracking and monitoring station"], "correct_answer": 2, "rationale": "A satellite constellation is a coordinated group of artificial satellites operating in synchronized orbital planes to deliver continuous ground coverage."}, {"id": "P2-Q031", "number": 31, "text": "Sukri is the tributary of which river?", "options": ["Mahanadi", "Luni", "Rushi Kulya", "Ponnaiyar"], "correct_answer": 2, "rationale": "The Sukri river originates in the western Aravalli Range in Pali district and is a prominent left-bank tributary of the Luni river in Rajasthan."}, {"id": "P2-Q032", "number": 32, "text": "Identify the mountains of Tamil Nadu in the map.<br><br><div class=\"figure-container\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAaQAAAHWCAIAAAC3xGqoAAAACXBIWXMAAA7EAAAOxAGVKw4bAACmZklEQVR4nOy9B1hUWbqofe/z3/Cfc9N/z3/nzJmZM9PJDrZtmzBnRJCcc85Bcs45CgoIKCoqGQFBEVEwYAJRUHIOklNBUVSuHbm7qghF0DYUktbb66ERitprV+391rfSt/7DFAAAAGwA/sNKVwAAAAC+BkB2AABgQwBkBwAANgRAdgAAYEMAZAcAADYEQHYAAGBDAGQ definitive map showing individual real property boundaries, parcel identifiers, and land ownership rights."}, {"id": "P2-Q035", "number": 35, "text": "Match the types of map in List-I with their uses mentioned in List-II:<br><br><table class=\"content-table\"><thead><tr><th>List - I (Types of map)</th><th>List - II (Uses)</th></tr></thead><tbody><tr><td>(a) Physical map</td><td>(i) Shows political boundaries</td></tr><tr><td>(b) Political map</td><td>(ii) Focuses on specific theme</td></tr><tr><td>(c) Topographic map</td><td>(iii) Depicts physical features</td></tr><tr><td>(d) Thematic map</td><td>(iv) Uses contour lines to illustrate the elevation and shape of the land.</td></tr></tbody></table><br><br>Codes:", "options": ["a - iii, b - i, c - iv, d - ii", "a - iv, b - iii, c - ii, d - i", "a - i, b - ii, c - iii, d - iv", "a - ii, b - i, c - iv, d - iii"], "correct_answer": 1, "rationale": "Matching map categories with cartographic uses: Physical map (relief/landforms - iii), Political map (boundaries - i), Topographic map (contour elevations - iv), Thematic map (specific themes - ii) (a-iii, b-i, c-iv, d-ii)."}, {"id": "P2-Q036", "number": 36, "text": "Match List-I with List-II and choose the correct answer:<br><br><table class=\"content-table\"><thead><tr><th>List - I (Discontinuity)</th><th>List - II (Separate layers)</th></tr></thead><tbody><tr><td>(a) Conrad</td><td>(i) Sial and Sima</td></tr><tr><td>(b) Mohorovicic</td><td>(ii) Outer core and inner core</td></tr><tr><td>(c) Gutenberg</td><td>(iii) Crust and mantle Zone</td></tr><tr><td>(d) Lehman</td><td>(iv) Mantle zone and core</td></tr></tbody></table><br><br>Codes:", "options": ["a - ii, b - iv, c - i, d - iii", "a - i, b - iii, c - iv, d - ii", "a - iii, b - i, c - iv, d - ii", "a - iv, b - ii, c - iii, d - i"], "correct_answer": 2, "rationale": "Matching seismic discontinuities: Conrad (Sial and Sima - i), Mohorovicic (Crust and Mantle - iii), Gutenberg (Mantle and Core - iv), Lehmann (Outer and Inner Core - ii) (a-i, b-iii, c-iv, d-ii)."}, {"id": "P2-Q037", "number": 37, "text": "Consider the following statements and select the correct answer using the codes given below:<br><br>Statement I: In India, the drainage basin of Brahmaputra is bigger than that of the Indus basin<br><br>Statement II: The Mahanadi drainage basin is bigger than that of the Krishna river basin", "options": ["Only Statement I is correct", "Only Statement II is correct", "Both Statements I and II are correct", "Both Statement I and Statement II are incorrect"], "correct_answer": 4, "rationale": "Both statements are incorrect: Indus drainage basin in India (~3.21 lakh sq km) is larger than Brahmaputra basin in India (~1.94 lakh sq km), and Krishna basin (~2.59 lakh sq km) is larger than Mahanadi basin (~1.42 lakh sq km)."}, {"id": "P2-Q038", "number": 38, "text": "Choose the correct option.", "options": ["ITCZ is found between 20° - 25° latitude", "ITCZ is found between 10° - 15° latitude", "ITCZ is found between 25° - 30° latitude", "ITCZ is found between 30° - 35° latitude"], "correct_answer": 1, "rationale": "In the Indian summer monsoon (July), the Inter-Tropical Convergence Zone (ITCZ) shifts northward and is positioned over the Indo-Gangetic plain between 20°N and 25°N latitudes."}, {"id": "P2-Q039", "number": 39, "text": "Which of the following pairs is correctly matched?", "options": ["Abu - Malwa Plateau", "Tura Range - Shillong Plateau", "Pachmarhi - Aravalli Range", "Mukurti - Telangana Plateau"], "correct_answer": 2, "rationale": "Tura Range is situated in the Garo Hills within the Shillong Plateau of Meghalaya (Mount Abu is in Aravallis; Pachmarhi in Satpuras; Mukurthi in Nilgiris)."}, {"id": "P2-Q040", "number": 40, "text": "The average depth of oceans and average height of the lithosphere, respectively, is", "options": ["3800 m and 840 m", "11000 m and 8848 m", "5000 m and 2500 m", "4000 m and 3000 m"], "correct_answer": 1, "rationale": "In global geomorphology, the average depth of the world ocean is approximately 3,800 metres, and the mean elevation of the continental lithosphere is approximately 840 metres."}, {"id": "P2-Q041", "number": 41, "text": "What is the primary function of GIS software environment's integration, with a Rational Database Management System (RDBMS)?", "options": ["Compiling custom python scripts for tool automation", "Managing and linking spatial geometry with non-spatial attribute tables efficiently", "Rendering high definition 3D cartographic map layouts", "Directly capturing live GPS satellite telemetry signals"], "correct_answer": 2, "rationale": "Integrating GIS with a Relational Database Management System (RDBMS) allows efficient storage, indexing, and bidirectional querying of spatial geometries and non-spatial attribute tables."}, {"id": "P2-Q042", "number": 42, "text": "What are the fundamental limitations and characteristics of Raster v/s Vector data models in representing geographic phenomena?", "options": ["Vector models struggle with topological verification, while raster models automatically enforce neighbour relations through pixel positions", "Vector models treat space as continuous field whereas raster models use discrete, entity based co-ordinates.", "Raster grids lack explicit topology, whereas topological vector models explicitly store these connection using nodes arcs and polygons", "Raster models require less storage than vector models for high complex, rapidly changing continuous surfaces"], "correct_answer": 3, "rationale": "Raster models represent continuous space without explicit topological relationships, whereas topological vector models explicitly store adjacency and connectivity using nodes, arcs, and polygons."}, {"id": "P2-Q043", "number": 43, "text": "Match the Raster and Vector plugins in List - I with their corresponding cartographic application in List - II:<br><br><table class=\"content-table\"><thead><tr><th>List - I (Plugins)</th><th>List - II (Cartographic Application)</th></tr></thead><tbody><tr><td>(a) Vector line operations (eg: buffering)</td><td>(i) Best suited for continuous surface backgrounds</td></tr><tr><td>(b) Raster grid/pixel processing</td><td>(ii) Ideal for rendering precise land boundaries and transit networks with clean text labels</td></tr><tr><td>(c) Vector to raster conversion</td><td>(iii) Combines multiple administrative and land cover layers to calculate cartographic overlap</td></tr><tr><td>(d) Overlay analysis (composite mapping)</td><td>(iv) Converting crisp outline geometries into pixel grids often causing jagged edges or loss in line resolution</td></tr></tbody></table><br><br>Codes:", "options": ["a - ii, b - i, c - iv, d - iii", "a - ii, b - i, c - iii, d - iv", "a - iv, b - iii, c - ii, d - i", "a - iii, b - ii, c - i, d - iv"], "correct_answer": 1, "rationale": "Matching GIS spatial operations: Vector buffering (precise boundary delineation - ii), Raster processing (continuous surfaces - i), Vector-to-raster (pixel grid conversion - iv), Overlay analysis (composite layer overlap - iii) (a-ii, b-i, c-iv, d-iii)."}, {"id": "P2-Q044", "number": 44, "text": "Match the following OGC web services:<br><br><table class=\"content-table\"><thead><tr><th>List - I (OGC Web Services)</th><th>List - II (Descriptions)</th></tr></thead><tbody><tr><td>(a) WMS</td><td>(i) Returns a raw multidimensional raster data suitable for analysis</td></tr><tr><td>(b) WFS</td><td>(ii) Core operation used to fetch the actual spatial features with geometric attributes</td></tr><tr><td>(c) WCS</td><td>(iii) Returns styled map images (PNG, JPEG)</td></tr><tr><td>(d) Get capabilities</td><td>(iv) Standard operation across all services</td></tr><tr><td>(e) Get Feature</td><td>(v) Returns raw vector features</td></tr></tbody></table><br><br>Codes:", "options": ["a - iii, b - v, c - i, d - iv, e - ii", "a - ii, b - iv, c - v, d - i, e - iii", "a - i, b - ii, c - iii, d - iv, e - v", "a - v, b - iii, c - iv, d - ii, e - i"], "correct_answer": 1, "rationale": "Matching Open Geospatial Consortium (OGC) web specifications: WMS (styled map images - iii), WFS (vector features - v), WCS (multidimensional raster data - i), GetCapabilities (metadata - iv), GetFeature (fetch features - ii) (a-iii, b-v, c-i, d-iv, e-ii)."}, {"id": "P2-Q045", "number": 45, "text": "What is the primary purpose of cadastral map within GIS framework?", "options": ["To analyse global weather and real time precipitation patterns", "To define, record and legalise property boundaries", "To map out sub-surface geological rock formations", "To illustrate national political boundaries"], "correct_answer": 2, "rationale": "The defining function of a cadastral map in a land information system is to accurately establish, record, and legalize property boundaries."}, {"id": "P2-Q046", "number": 46, "text": "Given below are two statements related to AutoCAD software:<br><br>Statement I: Orthographic drawing refers to a 2D [2-Dimensional] representation of an object in a view that shows only one side at a time<br><br>Statement II: The file extension that cannot be accessed by AutoCAD is doc file<br><br>With respect to the above statements, choose the correct answer from the options given below:", "options": ["Both Statements I and II are false", "Both Statements I and II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true"], "correct_answer": 2, "rationale": "Both statements are true: Orthographic projection displays a 2D view showing one face at a time, and AutoCAD cannot natively open or process Microsoft Word (.doc) document files as CAD drawings."}, {"id": "P2-Q047", "number": 47, "text": "Which of the following statements is/are not correct with respect to mirror command in AutoCAD?<br><br>(a) Applies a mirror like reflection to an object<br><br>(b) Creates a duplicate copy of an object<br><br>(c) Flips an object over a specified axis<br><br>(d) Rotates an object around its center point", "options": ["(a) and (c)", "(c) only", "(a), (b) and (d)", "(a), (b), (c) and (d)"], "correct_answer": 3, "rationale": "The MIRROR command reflects/flips objects across an axis; rotating around a center point is the ROTATE command (statements (a), (b), and (d) or question anomaly note)."}, {"id": "P2-Q048", "number": 48, "text": "Match the following function keys in List-I with their functions in List-II regarding to AutoCAD software:<br><br><table class=\"content-table\"><thead><tr><th>List - I (Function Keys)</th><th>List - II (Functions in AutoCAD)</th></tr></thead><tbody><tr><td>(a) F6</td><td>(i) Toggles the SNAP on and off</td></tr><tr><td>(b) F7</td><td>(ii) Toggles ORTHO on and off</td></tr><tr><td>(c) F8</td><td>(iii) Toggles GRID on and off</td></tr><tr><td>(d) F9</td><td>(iv) Toggles the co-ordinate readout from absolute to incremental to off and back</td></tr></tbody></table><br><br>Choose the correct option using the codes given below:<br><br>Codes:", "options": ["a - iv, b - iii, c - ii, d - i", "a - ii, b - i, c - iv, d - iii", "a - iii, b - iv, c - i, d - ii", "a - iv, b - iii, c - i, d - ii"], "correct_answer": 1, "rationale": "AutoCAD function key toggles: F6 (coordinate display / Dynamic UCS - iv), F7 (grid display - iii), F8 (ortho mode - ii), F9 (snap mode - i) (a-iv, b-iii, c-ii, d-i)."}, {"id": "P2-Q049", "number": 49, "text": "Identify the correct file extension which is an open vector format primarily used for sharing CAD design across platforms, developed by Autodesk.", "options": [".doc", ".dwg", ".dwt", ".dxf"], "correct_answer": 4, "rationale": "Drawing Exchange Format (.dxf) is the open vector specification developed by Autodesk to enable interoperability and design sharing across CAD platforms."}, {"id": "P2-Q050", "number": 50, "text": "The command for opening 'drawing units' window in AutoCAD is", "options": ["U", "UN", "UNI", "UIT"], "correct_answer": 2, "rationale": "In AutoCAD, typing the command shortcut 'UN' opens the Drawing Units configuration dialog box ('U' is Undo)."}, {"id": "P2-Q051", "number": 51, "text": "What will be the output of the following Java code?<br><br>```java<br>class incre {<br>    public static void main(String args[ ])<br>    {<br>        int g = 3;<br>        system.out.print(+ + g * 8);<br>    }<br>}<br>```", "options": ["33", "34", "24", "32"], "correct_answer": 4, "rationale": "In Java, pre-increment ++g increments g from 3 to 4 before evaluation, yielding 4 * 8 = 32."}, {"id": "P2-Q052", "number": 52, "text": "Which line of the following HTML file contains an error?<br><br>1. < applet<br>2.    Width = 200, Height = 200<br>3.    Code = Hello.class<br>4. < param<br>5.    Name = \"string\"<br>6.    Value = \"Hello java\" ><br>7. < /applet >", "options": ["Line 4", "Line 6", "Line 3", "Line 2"], "correct_answer": 4, "rationale": "In HTML, attributes within a tag must be separated by whitespace; Line 2 uses a comma (Width = 200, Height = 200), which violates HTML tag syntax."}, {"id": "P2-Q053", "number": 53, "text": "How do you correctly declare a variable in PHP?", "options": ["variable x = 5;", "int x = 5;", "$x = 5;", "var x = 5;"], "correct_answer": 3, "rationale": "In PHP, variable identifiers must be prefixed with a dollar sign $, such as $x = 5;."}, {"id": "P2-Q054", "number": 54, "text": "In a capacity based region quadtree used for point data, what primary condition triggers a leaf node to recursively split into four quadrants?", "options": ["The number of data points inside the node exceeds a predefined capacity threshold", "The depth of the entire tree decreases below zero", "The bounding box of the node intersects with another branch of the tree", "The node becomes completely empty of any spatial data"], "correct_answer": 1, "rationale": "In a point/region quadtree, an existing leaf node is recursively subdivided into four child quadrants when its count of stored spatial points exceeds the preset capacity bucket threshold."}, {"id": "P2-Q055", "number": 55, "text": "What is the defining characteristic of an \"offline-first\" mobile application architecture compared to an \"online-first\" cloud dependent application?", "options": ["No local database on the device", "Cannot function without an internet connection", "No optimistic UI", "It treats local device storage as the primary source of truth, rather than relying on a remote cloud server"], "correct_answer": 4, "rationale": "Offline-first application architecture designates the client device's local database as the primary source of truth, synchronizing opportunistically with the cloud."}, {"id": "P2-Q056", "number": 56, "text": "What is the major limitation of the tradition waterfall model in Software Engineering?", "options": ["It promotes iterative delivery, every two weeks", "It eliminates the need of formal testing phase", "Requirements are freezed", "Requires continuous collaboration"], "correct_answer": 3, "rationale": "The classical Waterfall SDLC model freezes requirements at the end of the analysis phase, making late-stage modifications costly and difficult to accommodate."}, {"id": "P2-Q057", "number": 57, "text": "Consider the following two statements related to REST API.<br><br>Statement I: Stateless constraint of REST requires that each request from a client to server must contain all information necessary to understand and complete request<br><br>Statement II: Because API server stores user session data in its local memory to track state across successive requests, the server is forced to remember previous interactions, which directly violates this constraint<br><br>With respect to the above statements, choose an appropriate answer from the options given below:", "options": ["Statement I is correct but Statement II is incorrect", "Statement I is incorrect but Statement II is correct", "Both Statement I and Statement II are correct", "Both Statement I and Statement II are incorrect"], "correct_answer": 3, "rationale": "Both statements are correct: REST statelessness requires every client request to contain all execution context; persisting session state on the server across calls violates this principle."}, {"id": "P2-Q058", "number": 58, "text": "What is the correct sequence of software testing levels from lowest component level to complete system level?<br><br>(a) System Testing<br>(b) Integration Testing<br>(c) Unit Testing<br>(d) Acceptance Testing<br><br>Choose the correct sequence from the below mentioned options.", "options": ["(d), (a), (b), (c)", "(c), (b), (a), (d)", "(c), (a), (b), (d)", "(d), (c), (a), (b)"], "correct_answer": 2, "rationale": "The hierarchical software testing pyramid progresses from component to system: Unit Testing -> Integration Testing -> System Testing -> Acceptance Testing ((c), (b), (a), (d))."}, {"id": "P2-Q059", "number": 59, "text": "Choose the correct sequential order of Jesse James Garrett's 'Five Planes Framework' in UX design:<br><br>(a) Strategy<br>(b) Scope<br>(c) Structure<br>(d) Surface<br>(e) Skeleton", "options": ["(a), (b), (d), (e), (c)", "(a), (b), (c), (e), (d)", "(b), (d), (a), (e), (c)", "(e), (d), (b), (a), (c)"], "correct_answer": 2, "rationale": "Jesse James Garrett's Five Planes of UX design from bottom to top: Strategy -> Scope -> Structure -> Skeleton -> Surface ((a), (b), (c), (e), (d))."}, {"id": "P2-Q060", "number": 60, "text": "Which type of cryptographic mechanism serves as technological foundation for standard secure digital signatures to ensure non-repudiation?", "options": ["Shared secret key exchange", "Hash based message authentication codes", "Asymmetric key cryptography (public key infrastructure)", "Symmetric key cryptography"], "correct_answer": 3, "rationale": "Digital signatures utilize asymmetric public-key cryptography (PKI) where private keys generate verifiable signatures that ensure non-repudiation."}, {"id": "P2-Q061", "number": 61, "text": "Arrange the following steps in a proper sequence to construct an equilateral triangle of side 6 cm:<br><br>(a) Join A and C<br>(b) Take a radius of 6 cm in a compass, draw an arc from A above the segment and cut this arc from B using the same radius. Mark the intersection of these arcs as C.<br>(c) Draw a segment AB of length 6 cm.<br>(d) Join B and C.", "options": ["(a), (b), (c), (d)", "(c), (b), (a), (d)", "(a), (c), (b), (d)", "(b), (d), (c), (a)"], "correct_answer": 2, "rationale": "Geometric construction sequence: Draw base segment AB = 6 cm (c) -> Draw intersecting arcs of radius 6 cm from A and B to locate C (b) -> Join AC (a) -> Join BC (d) ((c), (b), (a), (d))."}, {"id": "P2-Q062", "number": 62, "text": "Statement I: Perpendicular bisectors of a triangle passes through the vertices of the triangle.<br><br>Statement II: Perpendicular bisectors of a triangle passes through the midpoints of sides of the triangle.<br><br>Which of the following conclusions can be drawn from the above statements?", "options": ["Both the Statements I and II are true", "Both the Statements I and II are false", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true"], "correct_answer": 4, "rationale": "Perpendicular bisectors of a triangle pass through the midpoints of the sides by definition, but do not pass through opposite vertices in general (Statement I is false, Statement II is true)."}, {"id": "P2-Q063", "number": 63, "text": "In $\\Delta\\text{ABC}$, $\\text{AB} = \\text{AC} = x$, $\\text{BC} = 10\\text{ cm}$ and area of $\\Delta\\text{ABC} = 60\\text{ cm}^2$. Then the value of $x$ is", "options": ["12 cm", "5 cm", "10 cm", "13 cm"], "correct_answer": 4, "rationale": "In isosceles triangle ABC, altitude h = 2 * Area / base = 120 / 10 = 12 cm. Half-base = 5 cm. By Pythagoras: x = sqrt(12^2 + 5^2) = sqrt(169) = 13 cm."}, {"id": "P2-Q064", "number": 64, "text": "If $\\text{AE} = 10\\text{ cm}$, $\\text{BD} = 8\\text{ cm}$ and $\\text{BC} = 10\\text{ cm}$, then $\\text{AB}$ is equal to<br><br><div class=\"figure-containe ons": ["a – iv, b – iii, c – i, d – ii", "a – iv, b – ii, c – i, d – iii", "a – iii, b – i, c – ii, d – iv", "a – iii, b – iv, c – ii, d – i"], "correct_answer": 1, "rationale": "Matching set representations: Divisors of 18 (iv), Divisors of 6 (iii), Roots of x^2-16=0 (i), Odd numbers < 10 (ii) (a-iv, b-iii, c-i, d-ii)."}, {"id": "P2-Q071", "number": 71, "text": "If $x + y + z = 8$ and $xy + yz + zx = 12$, then the value of $x^2 + y^2 + z^2$ is", "options": ["40", "- 40", "38", "- 38"], "correct_answer": 1, "rationale": "Algebraic identity: (x+y+z)^2 = x^2+y^2+z^2 + 2(xy+yz+zx) => 8^2 = x^2+y^2+z^2 + 2(12) => x^2+y^2+z^2 = 64 - 24 = 40."}, {"id": "P2-Q072", "number": 72, "text": "Factorize: $a^4 + a^2b^2 + b^4$", "options": ["$(a^2 - b^2 + ab) (a^2 - b^2 - ab)$", "$(a^2 - b^2 + ab) (a^2 + b^2 - ab)$", "$(a^2 + b^2 + ab) (a^2 - b^2 - ab)$", "$(a^2 + b^2 + ab) (a^2 + b^2 - ab)$"], "correct_answer": 4, "rationale": "Completing square factorization: a^4 + a^2*b^2 + b^4 = (a^2+b^2)^2 - (ab)^2 = (a^2+b^2+ab)(a^2+b^2-ab)."}, {"id": "P2-Q073", "number": 73, "text": "Statement I: If \"$^n\\text{C}_8 = {^n\\text{C}_2}$\", then \"$^n\\text{C}_2 = 45$\"<br><br>Statement II: If \"$^n\\text{C}_x = {^n\\text{C}_y}$\", then $n = x + y$", "options": ["Statement I is true but Statement II is false", "Statement II is true but statement I is false", "Both Statements I and II are true", "Both Statements I and II are false"], "correct_answer": 3, "rationale": "Both statements are true: If nCx = nCy, then n = x + y; hence nC8 = nC2 => n = 10, and 10C2 = 45."}, {"id": "P2-Q074", "number": 74, "text": "The difference between two numbers is 2 and the product of their LCM and HCF is 48.<br><br>The numbers are", "options": ["8 and 6", "11 and 9", "10 and 12", "6 and 4"], "correct_answer": 1, "rationale": "Product of numbers equals product of LCM and HCF = 48, with difference = 2; factors are 8 and 6 (8 * 6 = 48, 8 - 6 = 2)."}, {"id": "P2-Q075", "number": 75, "text": "Mode is equal to", "options": ["3 median + 3 mean", "3 median + 2 mean", "2 median - 3 mean", "3 median - 2 mean"], "correct_answer": 4, "rationale": "Karl Pearson's empirical relationship between measures of central tendency is: Mode = 3 Median - 2 Mean."}, {"id": "P2-Q076", "number": 76, "text": "If $A = \\begin{bmatrix} 1 & -2 & 3 \\\\ -1 & 0 & 1 \\\\ 5 & 2 & 6 \\end{bmatrix}, B = \\begin{bmatrix} 2 & -1 & 3 \\\\ 0 & 1 & 4 \\\\ 2 & 6 & 1 \\end{bmatrix}$ and $2A + 3X = 5B$, then what is $X$?", "options": ["$\\frac{1}{3} \\begin{bmatrix} 8 & 1 & 9 \\\\ 2 & 0 & 18 \\\\ 0 & 20 & -7 \\end{bmatrix}$", "$\\frac{1}{3} \\begin{bmatrix} 8 & -1 & 9 \\\\ 2 & 5 & 18 \\\\ 0 & 20 & -7 \\end{bmatrix}$", "$\\frac{1}{3} \\begin{bmatrix} 8 & -1 & 9 \\\\ 2 & 5 & 18 \\\\ 0 & 20 & 7 \\end{bmatrix}$", "$\\frac{1}{3} \\begin{bmatrix} 8 & -1 & -9 \\\\ 2 & 5 & 18 \\\\ 0 & 20 & -7 \\end{bmatrix}$"], "correct_answer": 2, "rationale": "Matrix equation 2A + 3X = 5B => X = 1/3(5B - 2A); row 1 is (8, -1, 9), row 2 is (2, 5, 18), row 3 is (0, 20, -7)."}, {"id": "P2-Q077", "number": 77, "text": "The distance between two parallel tangents of a circle of radius 6 cm is ________", "options": ["10 cm", "12 cm", "8 cm", "6 cm"], "correct_answer": 2, "rationale": "Parallel tangents of a circle lie at opposite extremities of a diameter; distance between them = 2r = 2 * 6 cm = 12 cm."}, {"id": "P2-Q078", "number": 78, "text": "The largest four-digit number which is divisible by 12, 15, 21 and 30 is", "options": ["9340", "9831", "9960", "9660"], "correct_answer": 4, "rationale": "LCM(12, 15, 21, 30) = 420. The largest four-digit multiple of 420 is 9999 - (9999 mod 420) = 9999 - 339 = 9660."}, {"id": "P2-Q079", "number": 79, "text": "The abscissa of a point is $\\frac{3}{2}$ units, and if the difference between the ordinate and $\\frac{5}{2}$ is double of the abscissa, then the value of the ordinate is", "options": ["$\\frac{3}{2}$", "$\\frac{5}{2}$", "$\\frac{7}{2}$", "$\\frac{11}{2}$"], "correct_answer": 4, "rationale": "Given abscissa x = 3/2: y - 5/2 = 2(3/2) = 3 => y = 3 + 5/2 = 11/2."}, {"id": "P2-Q080", "number": 80, "text": "In a parallelogram, the consecutive angles are", "options": ["Equal angles", "Complementary angles", "Right angles", "Supplementary angles"], "correct_answer": 4, "rationale": "In any Euclidean parallelogram, consecutive interior angles are supplementary (add up to 180°)."}, {"id": "P2-Q081", "number": 81, "text": "Match the following List-I the name of the matrix with List-II examples of matrices.<br><br><table class=\"content-table\"><thead><tr><th>List - I (Matrix Name)</th><th>List - II (Example)</th></tr></thead><tbody><tr><td>(a) Identity matrix</td><td>(i) [a 0 a]</td></tr><tr><td>(b) Diagonal matrix</td><td>(ii) $\\begin{bmatrix} 1 & 0 \\\\ 0 & 1 \\end{bmatrix}$</td></tr><tr><td>(c) Column matrix</td><td>(iii) $\\begin{bmatrix} a & 0 \\\\ 0 & b \\end{bmatrix}$</td></tr><tr><td>(d) Row matrix</td><td>(iv) $\\begin{bmatrix} a \\\\ b \\end{bmatrix}$</td></tr></tbody></table><br><br>Codes:", "options": ["a – ii, b – iii, c – iv, d – i", "a – iii, b – ii, c – i, d – iv", "a – iv, b – ii, c – iii, d – i", "a – i, b – iv, c – ii, d – iii"], "correct_answer": 1, "rationale": "Matching matrix classifications: Identity matrix (ii), Diagonal matrix (iii), Column matrix (iv), Row matrix (i) (a-ii, b-iii, c-iv, d-i)."}, {"id": "P2-Q082", "number": 82, "text": "In the following figure, PQRS and ABCR are the rectangles and B is the midpoint of PR. The ratio of lengths AC : PR is ________<br><br><div class=\"figure-container\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAYYAAAFFCAIAAABnnt2oAAAACXBIWXMAAA7EAAAOxAGVKw4bAAB/RElEQVR4nOydB1gTSxeG/yuoqNde8d5rwd577733gqDSO4jSLICKBRXsqKAIigj2gg1EEQUEpffeOwFCet2SfzYJIRRRaSG43zPGJdlsZjc7b845c2bmfzxcuHDhajX6n6QrgAsXLlxVwpGECxeuViQcSbhw4WpFwpGECxeuViQcSbhw4WpFwpGECxeuViQcSbhw4WpFwpGECxeuViQcSbhw4WpFwpGECxeuViQcSbhw4WpFwpGECxeuViQcSbhw4WpFwpGECxeuViQcSbhw4WpFwpGECxeuViQcSbhw4WpFwpGEq20JRYWFV2cR/ofwCyp8i2gLl+SFIwlX2xKKVAKn
