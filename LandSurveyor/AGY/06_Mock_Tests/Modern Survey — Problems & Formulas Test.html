.mut{color:var(--mut)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 14px}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}

.grid{display:grid;grid-template-columns:1fr 230px;gap:12px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.tag{display:inline-block;font-size:.78rem;padding:2px 8px;border-radius:99px;background:var(--accbg);color:var(--acc);margin-right:6px}

.pal .ans{background:var(--accbg);border-color:var(--acc)}.pal .mk{outline:2px solid var(--warn)}.pal .cur{box-shadow:0 0 0 2px var(--ink)}
.pal .ok{background:var(--okbg);border-color:var(--ok)}.pal .bad{background:var(--badbg);border-color:var(--bad)}
.exp{margin-top:8px;padding:8px 12px;border-radius:9px;background:var(--warnbg);color:var(--ink);font-size:.95rem}

xels."}, {"t": "Pixels & Resolution", "n": 31, "q": "A sensor records 10-bit data. How many brightness (DN) levels are possible?", "o": ["256", "512", "1024", "2048"], "a": 2, "e": "2¹⁰ = 1024 levels (8-bit = 256, 12-bit = 4096)."}, {"t": "NDVI", "n": 32, "q": "Which two spectral bands are used to calculate NDVI? (UPSC/Remote Sensing)", "o": ["Red and Green", "Near Infrared and Red", "Blue and Green", "SWIR and Thermal"], "a": 1, "e": "NDVI = (NIR − RED) / (NIR + RED)."}, {"t": "NDVI", "n": 33, "q": "If NIR reflectance is 0.8 and Red reflectance is 0.2, calculate NDVI. (GATE Geomatics)", "o": ["0.2", "0.6", "0.75", "1.0"], "a": 1, "e": "NDVI = (0.8 − 0.2) / (0.8 + 0.2) = 0.6."}, {"t": "NDVI", "n": 34, "q": "NIR reflectance = 0.5 and Red reflectance = 0.3. Find NDVI.", "o": ["0.2", "0.25", "0.4", "0.6"], "a": 1, "e": "NDVI = 0.2 / 0.8 = 0.25."}, {"t": "NDVI", "n": 35, "q": "What is the possible range of NDVI values?", "o": ["0 to 1", "−1 to +1", "0 to 255", "−10 to +10"], "a": 1, "e": "NDVI ranges from −1 to +1; higher positive values generally mean healthier, denser vegetation."}, {"t": "NDVI", "n": 36, "q": "If NIR = Red = 0.4, what is NDVI?", "o": ["0", "0.5", "1", "−1"], "a": 0, "e": "NDVI = (0.4 − 0.4)/(0.4 + 0.4) = 0."}, {"t": "EM Waves", "n": 37, "q": "An electromagnetic wave has a frequency of 3 × 10⁸ Hz. Find its wavelength. (GATE)", "o": ["0.1 m", "1 m", "10 m", "100 m"], "a": 1, "e": "λ = c / f = (3 × 10⁸) / (3 × 10⁸) = 1 m."}, {"t": "EM Waves", "n": 38, "q": "If the wavelength of electromagnetic radiation increases, what happens to its frequency? (ISRO)", "o": ["It increases", "It decreases", "It is unchanged", "It becomes zero"], "a": 1, "e": "c = fλ with c constant, so frequency and wavelength are inversely related."}, {"t": "EM Waves", "n": 39, "q": "Which relationship between wavelength and frequency is correct for EM radiation? (UPSC)", "o": ["c = f / λ", "c = fλ", "c = λ / f", "c = f + λ"], "a": 1, "e": "c = fλ, so f = c/λ and λ = c/f."}, {"t": "EM <script>
const CFG={"key": "rp-ps-prob", "title": "Modern Survey — Problems & Formulas Test", "sub": "Formula-based PYQs and variants: scale, coordinates, slope, photogrammetry, pixels, NDVI, EM waves, EDM/GNSS", "times": [60, 90, 120], "defTime": 90, "counts": [25, 10], "shuffle": true};
const DATA=JSON.parse(document.getElementById('data').textContent).map((q,i)=>(q.id=i,q));
const TOPICS=[...new Set(DATA.map(q=>q.t))];
const app=document.getElementById('app');
let S=null,tick=null;
function h(t,a,...c){const e=document.createElement(t);for(const k in a||{}){const v=a[k];if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}for(const x of c.flat()){if(x==null||x===false)continue;e.append(x.nodeType?x:document.createTextNode(x))}return e}
const pad=n=>String(n).padStart(2,'0');
function fmt(s){s=Math.max(0,Math.round(s));const hh=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return hh?`${hh}:${pad(m)}:${pad(r)}`:`${m}:${pad(r)}`}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hist(){try{return JSON.parse(localStorage.getItem(CFG.key)||'[]')}catch(e){return[]}}
function saveHist(r){try{const a=hist();a.unshift(r);localStorage.setItem(CFG.key,JSON.stringify(a.slice(0,6)))}catch(e){}}
const L='ABCD';

function setup(){
  clearInterval(tick);S=null;
  let sel=new Set(TOPICS),cnt='all',per=CFG.defTime,sh=CFG.shuffle;
  const sum=h('div',{class:'mut'}),box=h('div');
  const avail=()=>DATA.filter(q=>sel.has(q.t));
  const nOf=()=>{const a=avail().length;return cnt==='all'?a:Math.min(cnt,a)};
  function draw(){
    const n=nOf();sum.textContent=n?`${n} questions · ${per}s each · total ${fmt(n*per)}`:'Select at least one topic';
    box.replaceChildren(
      h('h2',{},'Topics'),
      h('div',{class:'row'},TOPICS.map(t=>h('label',{class:'chk'},h('input',{type:'checkbox',...(sel.has(t)?{checked:''}:{}),onchange:e=>{e.target.checked?sel.add(t):sel.delete(t);draw()}}),`${t} (${DATA.filter(q=>q.t===t).length})`))),
      h('div',{class:'row',style:'margin-top:8px'},h('button',{class:'btn',onclick:()=>{sel=new Set(TOPICS);draw()}},'Select all'),h('button',{class:'btn',onclick:()=>{sel=new Set();draw()}},'Clear')),
      h('h2',{style:'margin-top:16px'},'Number of questions'),
      h('div',{class:'row'},['all',...CFG.counts].filter(c=>c==='all'||c<avail().length).map(c=>h('button',{class:'btn'+(cnt===c?' on':''),onclick:()=>{cnt=c;draw()}},c==='all'?'All':'Random '+c))),
      h('h2',{style:'margin-top:16px'},'Time per question'),
      h('div',{class:'row'},CFG.times.map(t=>h('button',{class:'btn'+(per===t?' on':''),onclick:()=>{per=t;draw()}},t+' s'))),
      h('label',{class:'chk',style:'margin-top:14px;width:fit-content'},h('input',{type:'checkbox',...(sh?{checked:''}:{}),onchange:e=>{sh=e.target.checked}}),'Shuffle option order'),
      h('div',{style:'margin-top:16px'},sum,h('button',{class:'btn pri',style:'margin-top:8px',onclick:()=>{if(nOf())start(shuf(avail()).slice(0,nOf()).sort((a,b)=>a.id-b.id),per,sh)}},'Start test'))
    );
  }
  draw();
  const H=hist();
  app.replaceChildren(h('h1',{},CFG.title),h('div',{class:'mut'},CFG.sub),
    h('div',{class:'card'},h('b',{},'Marking: '),'+1 correct · −0.25 wrong · 0 skipped. The test auto-submits when time runs out.'),
    h('div',{class:'card'},box),
    H.length?h('div',{class:'card'},h('h2',{},'Recent attempts'),h('div',{class:'tblw'},h('table',{},h('tr',{},['Date','Score','Accuracy'].map(x=>h('th',{},x))),H.map(r=>h('tr',{},h('td',{},r.d),h('td',{},`${r.s} / ${r.n}`),h('td',{},r.acc+'%')))))):null);
}

function start(list,per,sh){
  S={per,sh,i:0,done:false,confirm:false,qs:list.map(q=>{let o=q.o.map((t,k)=>({t,ok:k===q.a}));if(sh)o=shuf(o);return{id:q.id,t:q.t,n:q.n,q:q.q,e:q.e,o,pick:-1,mark:false}}),total:list.length*per};
  S.end=Date.now()+S.total*1000;
  clearInterval(tick);tick=setInterval(()=>{const r=(S.end-Date.now())/1000,el=document.getElementById('timer');if(el){el.textContent=fmt(r);el.className=r<=Math.max(60,S.total*.1)?'low':''}if(r<=0)submit()},500);
  view();
}
function go(i){S.i=Math.max(0,Math.min(S.qs.length-1,i));S.confirm=false;view()}
function pick(k){const q=S.qs[S.i];q.pick=q.pick===k?-1:k;view()}
function view(){
  const q=S.qs[S.i],n=S.qs.length,ans=S.qs.filter(x=>x.pick>=0).length;
  const pal=h('div',{class:'pal'},S.qs.map((x,i)=>h('button',{class:(x.pick>=0?'ans ':'')+(x.mark?'mk ':'')+(i===S.i?'cur':''),onclick:()=>go(i)},i+1)));
  app.replaceChildren(
    h('div',{class:'top'},h('div',{},h('b',{},`Q ${S.i+1} / ${n}`),h('span',{class:'mut'},`  · answered ${ans}`)),h('div',{class:'row'},h('span',{id:'timer'},fmt((S.end-Date.now())/1000)),h('button',{class:'btn pri',onclick:()=>{S.confirm=true;view()}},'Submit'))),
    S.confirm?h('div',{class:'banner'},`${n-ans} unanswered, ${S.qs.filter(x=>x.mark).length} marked for review. Submit now?  `,h('button',{class:'btn pri',onclick:submit},'Yes, submit'),' ',h('button',{class:'btn',onclick:()=>{S.confirm=false;view()}},'Keep going')):null,
    h('div',{class:'grid'},
      h('div',{class:'card'},h('span',{class:'tag'},q.t),q.mark?h('span',{class:'tag'},'⚑ marked'):null,
        h('div',{class:'stem'},q.q),
        q.o.map((o,k)=>h('button',{class:'opt'+(q.pick===k?' sel':''),onclick:()=>pick(k)},h('b',{},L[k]),h('span',{},o.t))),
        h('div',{class:'row',style:'margin-top:12px'},h('button',{class:'btn',onclick:()=>go(S.i-1)},'← Prev'),h('button',{class:'btn',onclick:()=>go(S.i+1)},'Next →'),
          h('button',{class:'btn'+(q.mark?' on':''),onclick:()=>{q.mark=!q.mark;view()}},'Mark (M)'),h('button',{class:'btn',onclick:()=>{q.pick=-1;view()}},'Clear')),
        h('div',{class:'mut',style:'margin-top:8px;font-size:.85rem'},'Keys: 1–4 or A–D answer · ←/→ move · M mark · Backspace clear')),
      h('div',{class:'card'},h('h2',{},'Palette'),pal,h('div',{class:'mut',style:'font-size:.8rem;margin-top:8px'},'Blue = answered · amber outline = marked'))));
}
document.addEventListener('keydown',e=>{
  if(!S||S.done||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();
  if('1234'.includes(k)&&k.length===1)pick(+k-1);else if('abcd'.includes(k)&&k.length===1)pick('abcd'.indexOf(k));
  else if(k==='arrowright')go(S.i+1);else if(k==='arrowleft')go(S.i-1);else if(k==='m'){S.qs[S.i].mark=!S.qs[S.i].mark;view()}else if(k==='backspace'||k==='delete'){S.qs[S.i].pick=-1;view()}
});

function submit(){
  if(!S||S.done)return;clearInterval(tick);S.done=true;S.used=Math.min(S.total,S.total-(S.end-Date.now())/1000);
  let c=0,w=0;S.qs.forEach(q=>{if(q.pick<0)return;q.o[q.pick].ok?c++:w++});
  S.c=c;S.w=w;S.sk=S.qs.length-c-w;S.score=c-w*.25;
  saveHist({d:new Date().toLocaleString(),s:S.score,n:S.qs.length,acc:S.qs.length?Math.round(c/S.qs.length*100):0});
  S.filter='all';results();
}
function results(){
  const n=S.qs.length,att=S.c+S.w;
  const rows=[...new Set(S.qs.map(q=>q.t))].map(t=>{const a=S.qs.filter(q=>q.t===t),c=a.filter(q=>q.pick>=0&&q.o[q.pick].ok).length,w=a.filter(q=>q.pick>=0&&!q.o[q.pick].ok).length;return{t,n:a.length,c,w,sk:a.length-c-w,s:c-w*.25,p:Math.round(c/a.length*100)}});
  const st=q=>q.pick<0?'sk':q.o[q.pick].ok?'ok':'bad';
  const shown=S.qs.map((q,i)=>({q,i})).filter(({q})=>S.filter==='all'||(S.filter==='wrong'&&st(q)==='bad')||(S.filter==='skip'&&st(q)==='sk')||(S.filter==='right'&&st(q)==='ok'));
  const redo=S.qs.filter(q=>st(q)!=='ok');
  app.replaceChildren(
    h('h1',{},'Result'),
    h('div',{class:'stat'},h('div',{},'Net score',h('b',{},`${S.score} / ${n}`)),h('div',{},'Correct',h('b',{},S.c)),h('div',{},'Wrong (−0.25 each)',h('b',{},S.w)),h('div',{},'Skipped',h('b',{},S.sk)),h('div',{},'Accuracy (of attempted)',h('b',{},att?Math.round(S.c/att*100)+'%':'–')),h('div',{},'Time used',h('b',{},fmt(S.used)))),
    h('div',{class:'card'},h('h2',{},'Topic-wise'),h('div',{class:'tblw'},h('table',{},h('tr',{},['Topic','Qs','✓','✗','Skip','Net','% correct'].map(x=>h('th',{},x))),rows.map(r=>h('tr',{},h('td',{},r.t),h('td',{},r.n),h('td',{},r.c),h('td',{},r.w),h('td',{},r.sk),h('td',{},r.s),h('td',{class:r.p<50?'weak':''},r.p+'%'+(r.p<50?' ⚠':'')))))),h('div',{class:'mut',style:'font-size:.85rem;margin-top:6px'},'Topics under 50% are flagged.')),
    h('div',{class:'row'},redo.length?h('button',{class:'btn pri',onclick:()=>start(redo.map(q=>DATA[q.id]),S.per,S.sh)},`Retry wrong & skipped (${redo.length})`):null,h('button',{class:'btn',onclick:setup},'New test')),
    h('h2',{style:'margin-top:18px'},'Review'),
    h('div',{class:'row'},[['all','All'],['wrong','Wrong'],['skip','Skipped'],['right','Correct']].map(([k,l])=>h('button',{class:'btn'+(S.filter===k?' on':''),onclick:()=>{S.filter=k;results()}},l))),
    shown.map(({q,i})=>h('div',{class:'card'},h('span',{class:'tag'},`Q${i+1}`),h('span',{class:'tag'},q.t),h('b',{class:st(q)==='ok'?'':'weak'},st(q)==='ok'?'✓ Correct':st(q)==='bad'?'✗ Wrong':'— Skipped'),
      h('div',{class:'stem'},q.q),
      q.o.map((o,k)=>h('div',{class:'opt'+(o.ok?' ok':q.pick===k?' bad':'')},h('b',{},L[k]),h('span',{},o.t+(q.pick===k?'   (your answer)':'')+(o.ok?'   ✓':'')))),
      q.e?h('div',{class:'exp'},q.e):null)));
  window.scrollTo(0,0);
}
setup();
</script></body></html>
