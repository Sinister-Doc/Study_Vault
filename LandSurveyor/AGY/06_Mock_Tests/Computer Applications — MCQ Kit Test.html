et software, and\nPowerPoint is presentation software.\nMS Word ಮುಖ್ಯವಾಗಿ word processing, Excel spreadsheet ಮತ್ತು PowerPoint presentationಗಾಗಿ\nಬಳಸಲಾಗುತ್ತದೆ."}, {"t": "MS Office & Web Basics", "n": 2, "q": "A document created in a modern version of MS Word is being saved, while an older Excel\nworkbook is also present in the same folder. Which pair of extensions correctly distinguishes them?\n/ ಆಧುನಿಕ MS Word document ಮತ್ತು ಹಳೆಯ Excel workbook ಒಂದೇ folderನಲ್ಲಿ ಇದ್ದರೆ, ಅವುಗಳ\nextensions ಅನ್ನು ಸರಿಯಾಗಿ ಗುರುತಿಸುವ ಜೋಡಿ ಯಾವುದು?", "o": ["Word–.xls, Excel–.docx", "Word–.pptx, Excel–.xls", "Word–.docx, Excel–.xls", "Word–.doc, Excel–.pptx"], "a": 2, "e": "Modern Word commonly uses .docx, while older Excel versions use\n.xls.\nಆಧುನಿಕ Word ಸಾಮಾನ್ಯವಾಗಿ .docx ಮತ್ತು ಹಳೆಯ Excel ಆವೃತ್ತಿಗಳು .xls ಬಳಸುತ್ತವೆ."}, {"t": "MS Office & Web Basics", "n": 3, "q": "A Word user wants to move from the current location directly to the end of the document,\nrather than merely moving to the end of the current paragraph. Which shortcut is most appropriate?\n/ Word ಬಳಕೆದಾರರು ಪ್ರಸ್ತುತ ಸ್ಥಳದಿಂದ ಕೇವಲ paragraphನ ಅಂತ್ಯಕ್ಕೆ ಅಲ್ಲದೆ ನೇರವಾಗಿ documentನ\nಅಂತ್ಯಕ್ಕೆ ಹೋಗಲು ಬಯಸುತ್ತಾರೆ. ಯಾವ shortcut ಸೂಕ್ತ?", "o": ["Ctrl + ↓", "Ctrl + End", "Ctrl + →", "Ctrl + ↓ + End"], "a": 1, "e": "Ctrl + End moves to the end of the entire document; Ctrl + ↓ moves\ntoward the end of a paragraph.\nCtrl + End ಸಂಪೂರ್ಣ documentನ ಅಂತ್ಯಕ್ಕೆ ಕರೆದೊಯ್ಯುತ್ತದೆ; Ctrl + ↓ paragraphನ ಅಂತ್ಯದ ಕಡೆಗೆ\nಕರೆದೊಯ್ಯುತ್ತದೆ."}, {"t": "MS Office & Web Basics", "n": 4, "q": "Consider the following Word shortcut statements: / ಕೆಳಗಿನ Word shortcut ಹೇಳಿಕೆಗಳನ್ನು\nಪರಿಗಣಿಸಿ:\n\n1. Ctrl + T creates a hanging indent.\n2. Ctrl + M indents a paragraph.\n3. Ctrl + K inserts a hyperlink.\n4. Ctrl + D opens font settings.\n\nWhich statements are correct? / ಸರಿಯಾದ ಹೇಳಿಕೆಗಳು ಯಾವುವು?", "o": ["1 and 2 only", "1, 2 and 3 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "a": 3, "e": "All four shortcut-function associations are given correctly in the supplied material.\nನಾಲ್ಕೂ shortcut ಮತ್ತು ಕಾರ್ಯಗಳ ಜೋಡಣೆಗಳು ನೀಡಿರುವ ಮಾಹಿತಿಯ ಪ್ರಕಾರ ಸರಿಯಾಗಿವೆ."}, {"t": "MS Office & Web Basics", "n": 5, "q": "A paragraph currently uses double-line spacing. The user wants to convert it directly to\nsingle-line spacing using the keyboard. Which action should be selected? / ಒಂದು paragraph\nಪ್ರಸ್ತುತ double-line spacing ಹೊಂದಿದೆ. ಅದನ್ನು keyboard ಮೂಲಕ ನೇರವಾಗಿ single-line spacingಗೆ\nಬದಲಾಯಿಸಲು ಯಾವ action ಬಳಸಬೇಕು?", "o": ["Ctrl + 0", "Ctrl + 1", "Ctrl + 2", "Ctrl + 5"], "a": 1, "e": "Ctrl + 1 applies single-line spacing; Ctrl + 2 applies double-line spacing and Ctrl + 5\napplies 1.5 spacing.\nCtrl + 1 single, Ctrl + 2 double ಮತ್ತು Ctrl + 5 1.5-line spacing ನೀಡುತ್ತದೆ."}, {"t": "MS Office & Web Basics", "n": 6, "q": "A user needs to apply a heading style and then check spelling without opening separate menus\nmanually. Which pair of shortcuts is correctly matched? / ಬಳಕೆದಾರರು heading style ಅನ್ವಯಿಸಿ\nನಂತರ spelling ಪರಿಶೀಲಿಸಲು ಬಯಸುತ್ತಾರೆ. ಸರಿಯಾದ shortcut ಜೋಡಿ ಯಾವುದು?", "o": ["Ctrl + Alt + 1 → Heading 1; F7 → Spell and Grammar Check", "Ctrl + Shift + 1 → Heading 1; F5 → Spell Check", "Ctrl + Alt + 1 → Heading 1; Shift + F7 → Spell Check", "Ctrl + D → Heading 1; F4 → Spell Check"], "a": 0, "e": "Ctrl + Alt + 1 applies Heading 1, while F7 opens spelling and grammar checking.\nCtrl + Alt + 1 Heading 1 ಅನ್ವಯಿಸುತ್ತದೆ; F7 spelling ಮತ್ತು grammar check ಮಾಡುತ್ತದೆ."}, {"t": "MS Office & Web Basics", "n": 7, "q": "Which Word operation is most appropriate when a user wants to examine alternative words with\nsimilar meanings without changing the original word automatically? / ಮೂಲ ಪದವನ್ನು\nಸ್ವಯಂಚಾಲಿತವಾಗಿ ಬದಲಾಯಿಸದೆ, ಅದರ ಸಮಾನಾರ್ಥಕ ಅಥವಾ ಸಮಾನ ಅರ್ಥದ ಪದಗಳನ್ನು\nನೋಡಲು ಯಾವ Word ಕಾರ್ಯ ಸೂಕ್ತ?", "o": ["AutoCorrect", "Find and Replace", "Thesaurus", "Spell Check"], "a": 2, "e": "Thesaurus provides synonyms or similar-meaning words for a selected word.\nThesaurus ಆಯ್ಕೆ ಮಾಡಿದ ಪದಕ್ಕೆ ಸಮಾನಾರ್ಥಕ ಅಥವಾ ಸಮಾನ ಅರ್ಥದ ಪದಗಳನ್ನು ನೀಡುತ್ತದೆ."}, {"t": "MS Office & Web Basics", "n": 8, "q": "A report contains a long bibliography in which the first line of every paragraph should remain at\nthe margin while subsequent lines move inward. Which indentation should be applied? / ಒಂದು\nreportನ bibliographyಯಲ್ಲಿ ಪ್ರತಿ paragraphನ ಮೊದಲ ಸಾಲು marginನಲ್ಲಿ ಉಳಿದು, ನಂತರದ\nಸಾಲುಗಳು ಒಳಕ್ಕೆ ಸರಿಯಬೇಕು. ಯಾವ indentation ಬಳಸಬೇಕು?", "o": ["First Line Indent", "Hanging Indent", "Negative Indent", "Centre Indent"], "a": 1, "e": "Hanging Indent keeps the first line at the margin and indents subsequent lines.\nHanging Indent ಮೊದಲ ಸಾಲನ್ನು marginನಲ್ಲಿ ಇರಿಸಿ ಉಳಿದ ಸಾಲುಗಳನ್ನು ಒಳಕ್ಕೆ ಸರಿಸುತ್ತದೆ."}, {"t": "MS Office & Web Basics", "n": 9, "q": "A Word user wants to insert the current date and current time using the keyboard. Which\ncombination is correct? / Word ಬಳಕೆದಾರರು keyboard ಮೂಲಕ ಪ್ರಸ್ತುತ ದಿನಾಂಕ ಮತ್ತು\nಸಮಯವನ್ನು ಸೇರಿಸಲು ಬಯಸುತ್ತಾರೆ. ಸರಿಯಾದ ಜೋಡಿ ಯಾವುದು?", "o": ["Shift + Alt + D → Date; Shift + Alt + T → Time", "Ctrl + D → Date; Ctrl + T → Time", "F12 → Date; F4 → Time", "Shift + F12 → Date; F7 → Time"], "a": 0, "e": "Shift + Alt + D inserts the current date, while Shift + Alt + T inserts the current time.\nShift + Alt + D ಪ್ರಸ್ತುತ ದಿನಾಂಕ ಮತ್ತು Shift + Alt + T ಪ್ರಸ್ತುತ ಸಮಯವನ್ನು ಸೇರಿಸುತ್ತದೆ."}, {"t": "MS Office & Web Basics", "n": 10, "q": "Which sequence correctly represents the relationship among Ribbon, Tabs and commands in\nMS Word? / MS Wordನಲ್ಲಿ Ribbon, Tabs ಮತ್ತು commands ನಡುವಿನ ಸಂಬಂಧವನ್ನು ಸರಿಯಾಗಿ\nತೋರಿಸುವ ಕ್ರಮ ಯಾವುದು?", "o": ["Commands → Ribbon → Tabs", "Tabs → Ribbon → Commands", "Ribbon → Tabs → Commands", "Tabs → Commands → Ribbon"], "a": 2, "e": "The Ribbon is the command collection at the top; commands are organised into\ndifferent tabs.\nRibbon ಮೇಲ್ಭಾಗದಲ್ಲಿರುವ commandsನ ಸಮೂಹವಾಗಿದ್ದು, commandsಗಳನ್ನು ವಿವಿಧ Tabsಗಳಲ್ಲಿ\nವ್ಯವಸ್ಥೆಗೊಳಿಸಲಾಗುತ್ತದೆ."}, {"t": "MS Office & Web Basics", "n": 11, "q": "A user wants to see the width of the page and adjust left/right margins, while another\nrequirement is to adjust top/bottom margins. Which ruler combination is correct? / ಬಳಕೆದಾರರು\npageನ width ಮತ್ತು left/right margins ಅನ್ನು ಹೊಂದಿಸಲು ಹಾಗೂ top/bottom margins ಅನ್ನು\nಹೊಂದಿಸಲು ಬಯಸುತ್ತಾರೆ. ಸರಿಯಾದ ruler ಜೋಡಿ ಯಾವುದು?", "o": ["Vertical → left/right; Horizontal → top/bottom", "Horizontal → left/right; Vertical → top/bottom", "Horizontal → top/bottom; Vertical → left/right", "Both are used only for page height"], "a": 1, "e": "Horizontal ruler deals with page width and left/right margins; vertical ruler helps with\nheight and top/bottom margins.\nHorizontal ruler page width ಮತ್ತು ಎಡ/ಬಲ marginsಗೆ, Vertical ruler page height ಮತ್ತು ಮೇಲಿನ/ಕೆಳಗಿನ\nmarginsಗೆ ಸಹಾಯ ಮಾಡುತ್ತದೆ."}, {"t": "MS Office & Web Basics", "n": 12, "q": "Consider the following Excel statements: / ಕೆಳಗಿನ Excel ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ:\n\n1. A cell is the intersection of a row and column.\n2. Rows are identified by numbers.\n3. Columns are identified by letters.\n4. A formula generally begins with =.\n\nWhich option is correct? / ಸರಿಯಾದ ಆಯ್ಕೆ ಯಾವುದು?", "o": ["1 and 2 only", "2 and 3 only", "1, 2 and 3 only", "1, 2, 3 and 4"], "a": 3, "e": "All four are fundamental Excel concepts.\nನಾಲ್ಕೂ Excelನ ಮೂಲಭೂತ ಪರಿಕಲ್ಪನೆಗಳಾಗಿವೆ."}, {"t": "MS Office & Web Basics", "n": 13, "q": "An Excel workbook contains several worksheets. A user wants to move from the current\nworksheet to the next/previous worksheet without using the mouse. Which shortcut is most\nappropriate? / ಹಲವಾರು worksheets ಹೊಂದಿರುವ Excel workbookನಲ್ಲಿ mouse ಬಳಸದೆ current\nworksheetನಿಂದ ಮುಂದಿನ/ಹಿಂದಿನ worksheetಗೆ ಬದಲಾಯಿಸಲು ಯಾವ shortcut ಸೂಕ್ತ?", "o": ["Ctrl + Page Up/Down", "Ctrl + Arrow", "Alt + Tab", "Shift + Arrow"], "a": 0, "e": "Ctrl + Page Up/Down switches between worksheets.\nCtrl + Page Up/Down worksheetsಗಳ ನಡುವೆ ಬದಲಾಯಿಸುತ್ತದೆ."}, {"t": "MS Office & Web Basics", "n": 14, "q": "A formula needs to use a cell reference that should remain fixed when the formula is copied.\nWhich combination from the supplied material is most relevant? / Formula copy ಮಾಡಿದಾಗ cell\nreference ಬದಲಾಗದೆ fixed ಆಗಿರಬೇಕು. ನೀಡಿರುವ material ಪ್ರಕಾರ ಯಾವ ಸಂಯೋಜನೆ ಹೆಚ್ಚು\nಸಂಬಂಧಿಸಿದೆ?", "o": ["# and F7", "$ and F4", "% and F2", "@ and F12"], "a": 1, "e": "The dollar sign fixes a cell reference, and F4 is used to anchor/fix a cell reference.\nDollar sign cell reference ಅನ್ನು fix ಮಾಡುತ್ತದೆ; F4 reference ಅನ್ನು anchor/fix ಮಾಡಲು ಬಳಸುತ್ತದೆ."}, {"t": "MS Office & Web Basics", "n": 15, "q": "A worksheet contains numerical marks in A1:A5: 10, 20, blank, \"30\" as\ntext, and 40. If the formula =COUNT(A1:A5) is used, what conceptual rule determines\nthe result? / A1:A5ನಲ್ಲಿ 10, 20, blank, text ರೂಪದಲ್ಲಿರುವ \"30\", ಮತ್ತು 40 ಇವೆ.\n=COUNT(A1:A5) ಬಳಸಿದಾಗ ಫಲಿತಾಂಶವನ್ನು ನಿರ್ಧರಿಸುವ ಮೂಲ ನಿಯಮ ಯಾವುದು?", "o": ["COUNT counts all non-empty cells", "COUNT counts only cells containing numbers", "COUNT counts only text values", "COUNT always counts five cells in the range"], "a": 1, "e": "COUNT counts cells containing numerical values, not blanks or text entries.\nCOUNT ಸಂಖ್ಯಾತ್ಮಕ ಮೌಲ್ಯ ಹೊಂದಿರುವ cells ಅನ್ನು ಮಾತ್ರ ಎಣಿಸುತ್ತದೆ; blank ಅಥವಾ text ಅನ್ನು ಅಲ್ಲ."}, {"t": "MS Office & Web Basics", "n": 16, "q": "A manager wants to identify both the highest and lowest land valuation from a selected\nnumerical range. Which pair of functions should be used? / ಮ್ಯಾನೇಜರ್ ಆಯ್ಕೆ ಮಾಡಿದ numerical\nrangeನಲ್ಲಿ ಗರಿಷ್ಠ ಮತ್ತು ಕನಿಷ್ಠ land valuation ಕಂಡುಹಿಡಿಯಲು ಬಯಸುತ್ತಾರೆ. ಯಾವ function ಜೋಡಿ\nಬಳಸಬೇಕು?", "o": ["SUM and AVERAGE", "COUNT and SUM", "MAX and MIN", "AVERAGE and COUNT"], "a": 2, "e": "MAX returns the highest value and MIN returns the lowest value.\nMAX ಗರಿಷ್ಠ ಮತ್ತು MIN ಕನಿಷ್ಠ ಮೌಲ್ಯವನ್ನು ನೀಡುತ್ತದೆ."}, {"t": "MS Office & Web Basics", "n": 17, "q": "Which chart choice is the least appropriate if the primary objective is to show the proportion of\nindividual categories within a single whole? / ಒಂದು ಒಟ್ಟಾರೆ ಮೊತ್ತದೊಳಗಿನ ವಿವಿಧ categoriesಗ | ಳ\nಪ್ರಮಾಣವನ್ನು ತೋರಿಸುವುದು ಮುಖ್ಯ ಉದ್ದೇಶವಾಗಿದ್ದರೆ, ಯಾವ chart ಕಡಿಮೆ ಸೂಕ್ತ?", "o": ["Pie Chart", "Stacked Column Chart", "Bar Chart", "Both A and B are designed to show such composition"], "a": 2, "e": "Pie charts directly show proportions of a whole, while stacked charts can show parts of\na whole; a basic Bar Chart is primarily for comparison.\nPie Chart ಒಟ್ಟಾರೆ ಮೊತ್ತದ ಭಾಗಗಳ ಪ್ರಮಾಣವನ್ನು ನೇರವಾಗಿ ತೋರಿಸುತ್ತದೆ; Stacked Chart ಕೂಡ\nಭಾಗ-ಒಟ್ಟಾರೆ ಸಂಬಂಧ ತೋರಿಸಬಹುದು. Bar Chart ಮುಖ್ಯವಾಗಿ ಹೋಲಿಕೆಗೆ ಬಳಸಲಾಗುತ್ತದೆ."}, {"t": "MS Office & Web Basics", "n": 18, "q": "A chart's entire surrounding region is selected, rather than only the region where data marks\nare plotted. Which component has most likely been selected? / Data marks plot ಆಗುವ\nಪ್ರದೇಶವಷ್ಟೇ ಅಲ್ಲದೆ chartನ ಸಂಪೂರ್ಣ surrounding region select ಆಗಿದ್ದರೆ, ಯಾವ component select\nಆಗಿರುವ ಸಾಧ್ಯತೆ ಹೆಚ್ಚು?", "o": ["Plot Area", "Data Series", "Chart Area", "Data Label"], "a": 2, "e": "Chart Area refers to the entire chart region, while Plot Area is the region where data is\ndisplayed.\nChart Area ಸಂಪೂರ್ಣ chart ಪ್ರದೇಶ; Plot Area data ಪ್ರದರ್ಶಿಸುವ ಪ್ರದೇಶ."}, {"t": "MS Office & Web Basics", "n": 19, "q": "Which Excel shortcut combination correctly represents three different operations rather than\nthree variations of the same operation? / ಕೆಳಗಿನ ಯಾವ Excel shortcut ಸಂಯೋಜನೆಯು ಒಂದೇ\nಮೂರು ರೂಪಗಳಲ್ಲದೆ ಮೂರು ವಿಭಿನ್ನ ಕಾರ್ಯಗಳನ್ನು ಸರಿಯಾಗಿ ತೋರಿಸುತ್ತದೆ?\noperationನ", "o": ["Ctrl + D → Fill Down; Ctrl + R → Fill Right; Alt + = → AutoSum", "Ctrl + D → Delete; Ctrl + R → Rename; Alt + = → Average", "Ctrl + D → Date; Ctrl + R → Row; Alt + = → Save", "Ctrl + D → Duplicate; Ctrl + R → Review; Alt + = → Formula Bar"], "a": 0, "e": "Ctrl + D fills down, Ctrl + R fills right, and Alt + = activates AutoSum.\nCtrl + D Fill Down, Ctrl + R Fill Right ಮತ್ತು Alt + = AutoSum ಮಾಡುತ್ತದೆ."}, {"t": "MS Office & Web Basics", "n": 20, "q": "A user wants to insert a new line inside the same Excel cell without moving to another cell.\nWhich shortcut should be used? / Excelನ ಅದೇ cell ಒಳಗೆ ಹೊಸ line ಸೇರಿಸಬೇಕು, ಆದರೆ ಬೇರೆ\ncellಗೆ ಹೋಗಬಾರದು. ಯಾವ shortcut ಬಳಸಬೇಕು?", "o": ["Shift + Enter", "Ctrl + Enter", "Alt + Enter", "Ctrl + Page Down"], "a": 2, "e": "Alt + Enter inserts a new line within the same cell.\nAlt + Enter ಅದೇ cell ಒಳಗೆ ಹೊಸ line ಸೇರಿಸುತ್ತದೆ."}, {"t": "MS Office & Web Basics", "n": 21, "q": "A PowerPoint designer wants to create slides normally, then rearrange their order, and finally\npresent them to an audience. Which sequence of views is logically appropriate? / PowerPoint\n\ndesigner slides ರಚಿಸಿ, ನಂತರ ಅವುಗಳ ಕ್ರಮ ಬದಲಾಯಿಸಿ, ಕೊನೆಯಲ್ಲಿ audienceಗೆ ಪ್ರದರ್ಶಿಸಲು\nಬಯಸುತ್ತಾರೆ. ತಾರ್ಕಿಕವಾದ view ಕ್ರಮ ಯಾವುದು?", "o": ["Slide Sorter → Normal → Slide Show", "Normal → Slide Sorter → Slide Show", "Outline → Notes → Master", "Master → Slide Show → Normal"], "a": 1, "e": "Normal View is used for creating/designing, Slide Sorter for arranging, and Slide Show\nfor presenting.\nNormal View ರಚನೆಗೆ, Slide Sorter ಕ್ರಮ ಬದಲಿಸಲು ಮತ್ತು Slide Show presentationಗೆ ಬಳಸಲಾಗುತ್ತದೆ."}, {"t": "MS Office & Web Basics", "n": 22, "q": "A presentation requires a common font, background and placeholder position to be controlled\nconsistently. Which view is most appropriate, and why? / Presentationನಲ್ಲಿ font, background ಮತ್ತು\nಳಲ್ಲಿ consistent ಆಗಿ ನಿಯಂತ್ರಿಸಬೇಕಾಗಿದೆ. ಯಾವ view ಸೂಕ್ತ\nplaceholder position ಅನ್ನು ಎಲ್ಲಾ slidesಗ\nಮತ್ತು ಏಕೆ?", "o": ["Outline View, because it controls slide text only", "Slide Sorter View, because it changes common formatting", "Master View, because it controls common design elements", "Slide Show View, because it applies presentation-wide effects"], "a": 2, "e": "Master View controls common elements such as background, fonts and placeholder\nsize/position.\nMaster View background, fonts ಮತ್ತು placeholdersನ ಸಾಮಾನ್ಯ ವಿನ್ಯಾಸವನ್ನು ನಿಯಂತ್ರಿಸುತ್ತದೆ."}, {"t": "MS Office & Web Basics", "n": 23, "q": "During a slide show, the presenter wants a temporary white screen while keeping the\npresentation active. Which key should be pressed? / Slide Show ನಡೆಯುತ್ತಿರುವಾಗ presentation\nಮುಚ್ಚದೆ ತಾತ್ಕಾಲಿಕವಾಗಿ white screen ತೋರಿಸಬೇಕಾದರೆ ಯಾವ key ಒತ್ತಬೇಕು?", "o": ["B", "W", "Esc", "Ctrl + F5"], "a": 1, "e": "B displays a black screen; W displays a white screen; Esc exits the Slide Show.\nB black screen, W white screen ಮತ್ತು Esc Slide Showನಿಂದ ಹೊರಬರುತ್ತದೆ."}, {"t": "MS Office & Web Basics", "n": 24, "q": "Which PowerPoint shortcut pairing is incorrectly matched? / ಕೆಳಗಿನ PowerPoint shortcut\nಜೋಡಣೆಗಳಲ್ಲಿ ತಪ್ಪಾಗಿ ಹೊಂದಿಕೆಯಾಗಿರುವುದು ಯಾವುದು?", "o": ["Ctrl + M → New Slide", "Ctrl + Shift + G → Ungroup Objects", "Ctrl + Shift + O → Group Objects", "Ctrl + Shift + D → Insert Hyperlink"], "a": 3, "e": "Ctrl + Shift + D duplicates the selected slide; Ctrl + K inserts a hyperlink.\nCtrl + Shift + D selected slide ಅನ್ನು duplicate ಮಾಡುತ್ತದೆ; Ctrl + K hyperlink ಸೇರಿಸುತ್ತದೆ."}, {"t": "MS Office & Web Basics", "n": 25, "q": "A presenter is currently on slide 7 and wants to begin the Slide Show from that slide rather\nthan from slide 1. Which shortcut is appropriate? / Presenter ಪ್ರಸ್ತುತ slide 7ರಲ್ಲಿ ಇದ್ದು, slide\n1ರಿಂದಲ್ಲದೆ slide 7ರಿಂದಲೇ Slide Show ಪ್ರಾರಂಭಿಸಬೇಕು. ಯಾವ shortcut ಸೂಕ್ತ?", "o": ["Ctrl + F5", "Shift + F5", "Ctrl + Shift + F5", "F5"], "a": 1, "e": "Shift + F5 starts the Slide Show from the current slide; Ctrl + F5 starts from the\nbeginning.\nShift + F5 current slideನಿಂದ ಮತ್ತು Ctrl + F5 beginningನಿಂದ Slide Show ಪ್ರಾರಂಭಿಸುತ್ತದೆ."}, {"t": "MS Office & Web Basics", "n": 26, "q": "Consider the following PowerPoint statements: / ಕೆಳಗಿನ PowerPoint ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ:\n\n1. A Trigger is an object that can perform an action when clicked.\n2. PowerPoint supports images, audio and video.\n3. PowerPoint zoom can reach up to 400% according to the material.\n4. Esc is used to exit Slide Show.\n\nWhich are correct? / ಸರಿಯಾದವು ಯಾವುವು?", "o": ["1 and 2 only", "2 and 3 only", "1, 2 and 4 only", "1, 2, 3 and 4"], "a": 3, "e": "All four statements are consistent with the supplied PowerPoint material.\nನಾಲ್ಕೂ ಹೇಳಿಕೆಗಳು ನೀಡಿರುವ PowerPoint ಮಾಹಿತಿಗೆ ಅನುಗುಣವಾಗಿವೆ."}, {"t": "MS Office & Web Basics", "n": 27, "q": "A user wants to distinguish between selecting all objects, selecting the next object, and\nselecting the previous object in PowerPoint. Which sequence is correct? / PowerPointನಲ್ಲಿ ಎಲ್ಲಾ\nobjects select ಮಾಡುವುದು, next object select ಮಾಡುವುದು ಮತ್ತು previous object select ಮಾಡುವ\nಸರಿಯಾದ ಕ್ರಮ ಯಾವುದು?\nshortcutsನ", "o": ["Ctrl + A; Tab; Shift + Tab", "Ctrl + A; Shift + Tab; Tab", "Tab; Ctrl + A; Shift + Tab", "Ctrl + Shift + A; Tab; Ctrl + Tab"], "a": 0, "e": "Ctrl + A selects all objects; Tab selects the next object; Shift + Tab selects the\nprevious object.\nCtrl + A ಎಲ್ಲಾ objects, Tab next object ಮತ್ತು Shift + Tab previous object select ಮಾಡುತ್ತದೆ."}, {"t": "MS Office & Web Basics", "n": 28, "q": "Which option correctly separates the roles of HTML, CSS, JavaScript and Java in the\nsupplied material? / ನೀಡಿರುವ ಮಾಹಿತಿಯ ಪ್ರಕಾರ HTML, CSS, JavaScript ಮತ್ತು Javaಗಳ\nಪಾತ್ರಗಳನ್ನು ಸರಿಯಾಗಿ ಬೇರ್ಪಡಿಸುವ ಆಯ್ಕೆ ಯಾವುದು?", "o": ["HTML–Behaviour; CSS–Structure; JavaScript–Appearance; Java–Spreadsheet", "HTML–Structure; CSS–Appearance; JavaScript–Interaction; Java–Application/Business Logic", "HTML–Database; CSS–Business Logic; JavaScript–Presentation; Java–Hyperlink", "HTML–Presentation; CSS–Database; JavaScript–Security Protocol; Java–Charting"], "a": 1, "e": "HTML structures a webpage, CSS controls appearance, JavaScript provides\ninteraction, and Java is used for application/business logic.\nHTML webpage structure, CSS appearance, JavaScript interaction ಮತ್ತು Java application/business logicಗೆ\nಸಂಬಂಧಿಸಿದೆ."}, {"t": "MS Office & Web Basics", "n": 29, "q": "A user needs a secure connection between a browser and a web server. Which statement\nbest captures the relationship among HTTPS, TLS and SSL? / Browser ಮತ್ತು web server ನಡುವೆ\nsecure connection ಬೇಕಾಗಿದೆ. HTTPS, TLS ಮತ್ತು SSL ನಡುವಿನ ಸಂಬಂಧವನ್ನು ಸರಿಯಾಗಿ\nವಿವರಿಸುವ ಹೇಳಿಕೆ ಯಾವುದು?", "o": ["HTTPS is the older protocol replaced by HTTP, while SSL is the current security mechanism.", "TLS is an older version of HTTPS and SSL is required by all modern browsers.", "HTTPS is secure HTTP, TLS provides the modern security mechanism, and SSL is its older predecessor.", "HTTPS, TLS and SSL are three different spreadsheet formats."], "a": 2, "e": "HTTPS is HTTP secured using TLS; SSL is the older predecessor to TLS and is not\nthe modern mechanism.\nHTTPS ಎಂದರೆ TLS ಬಳಸಿ ಸುರಕ್ಷಿತಗೊಳಿಸಿದ HTTP; SSL, TLSನ ಹಳೆಯ predecessor ಆಗಿದೆ."}, {"t": "MS Office & Web Basics", "n": 30, "q": "A user is working with Word, Excel and PowerPoint and needs to identify the most\nappropriate shortcut for each task: save a Word document, save an Excel workbook, and create a\nnew PowerPoint slide. Which combination is correct? / ಬಳಕೆದಾರರು Word, Excel ಮತ್ತು\nPowerPointನಲ್ಲಿ ಕೆಲಸ ಮಾಡುತ್ತಿದ್ದಾರೆ. Word document save ಮಾಡುವುದು, Excel workbook save\nಮಾಡುವುದು ಮತ್ತು ಹೊಸ PowerPoint slide ರಚಿಸುವುದಕ್ಕೆ ಸರಿಯಾದ shortcut ಸಂಯೋಜನೆ\nಯಾವುದು?", "o": ["Word–Ctrl + P; Excel–Ctrl + D; PowerPoint–Ctrl + S", "Word–Ctrl + S; Excel–Ctrl + S; PowerPoint–Ctrl + M", "Word–Shift + F7; Excel–F2; PowerPoint–Ctrl + K", "Word–F12; Excel–Ctrl + N; PowerPoint–Ctrl + D"], "a": 1, "e": "Ctrl + S saves Word and Excel files, while Ctrl + M creates a new PowerPoint slide.\nCtrl + S Word ಮತ್ತು Excel files save ಮಾಡುತ್ತದೆ; Ctrl + M ಹೊಸ PowerPoint slide ರಚಿಸುತ್ತದೆ."}, {"t": "ADLR Feb 2025 Questions", "n": 1, "q": "In AutoCAD, a Polyline can be broken into individual lines and arcs using\nwhich command?", "o": ["BREAK", "TRIM", "EXPLODE", "OVERKILL"], "a": 2, "e": "EXPLODE breaks a compound object such as a Polyline into its individual\ncomponents."}, {"t": "ADLR Feb 2025 Questions", "n": 2, "q": "In AutoCAD, which tool cannot be used to make 2D views from a 3D\ndrawing?", "o": ["Flatten", "Flatshot", "Layout Views", "Section Plane"], "a": 2, "e": "FLATTEN and FLATSHOT create 2D representations from 3D geometry,\nwhile SECTIONPLANE creates sectional representations. Layout is mainly used for\narranging views and plotting."}, {"t": "ADLR Feb 2025 Questions", "n": 3, "q": "The Chamfer command is used to cut the corners of a rectangle at ____\ndegree.", "o": ["30°", "45°", "60°", "None"], "a": 1, "e": "In the standard/basic case represented in the question, a rectangular corner\nis chamfered at 45°."}, {"t": "ADLR Feb 2025 Questions", "n": 4, "q": "Which of the following statement is correct in AutoCAD?", "o": ["PURGE can only be used when inserting blocks.", "PURGE can only delete exploded blocks.", "PURGE can be used to delete unwanted unused details from a drawing.", "PURGE can only be called from the command line."], "a": 2, "e": "PURGE removes unused or unreferenced named objects and definitions\nfrom a drawing."}, {"t": "ADLR Feb 2025 Questions", "n": 5, "q": "Which of the following statement is false in MS Word?\n\n1. Different header/footer can be set for even and odd pages.\n2. Different page-number formats can be set for different sections.\n3. Different header/footer can be set for the first page of a section.\n4. Different header/footer can be set for the last page of a section.", "o": ["1 only", "2 only", "3 only", "4 only"], "a": 3, "e": "Word supports Different First Page, Different Odd & Even Pages and\nsection-specific page-number formats, but there is no standard direct Different Last\nPage option."}, {"t": "ADLR Feb 2025 Questions", "n": 6, "q": "What is the use of \"Hide Slide\" option in MS PowerPoint?", "o": ["To hide the selected slide during Editing", "To hide the selected slide during Presentation", "To hide the selected slide during Printing", "To hide the selected slide during Deleting"], "a": 1, "e": "A hidden slide remains in the presentation but is skipped during the normal\nSlide Show."}, {"t": "ADLR Feb 2025 Questions", "n": 7, "q": "Which is the shortcut key to add a new slide in MS PowerPoint?", "o": ["Ctrl + M", "Ctrl + N", "Ctrl + S", "Alt + N"], "a": 0, "e": "Ctrl + M adds a new slide."}, {"t": "ADLR Feb 2025 Questions", "n": 8, "q": "In AutoCAD, to create a Square to Round, which command should you\nuse?", "o": ["Loft", "Extrude", "Rib", "Sweep"], "a": 0, "e": "LOFT creates a 3D solid or surface by blending between two or more\ncross-sectional profiles, such as a square and a circle."}, {"t": "ADLR Feb 2025 Questions", "n": 9, "q": "In Page Layout, Indent and Spacing is available in ______ group in MS\nWord 2010.", "o": ["Page Setup", "Page Background", "Arrange", "Paragraph"], "a": 3, "e": "In Word 2010, Indent and Spacing controls are available in the Paragraph\ngroup under Page Layout."}, {"t": "ADLR Feb 2025 Questions", "n": 10, "q": "What is the maximum column width in a worksheet in MS Excel 2010?", "o": ["26 characters", "128 characters", "255 characters", "256 characters"], "a": 2, "e": "The maximum column width in Excel 2010 is 255 characters."}, {"t": "ADLR Feb 2025 Questions", "n": 11, "q": "Presentation programs can either supplement or replace older\nvisual-aid technology, such as:", "o": ["Pamphlets", "Overhead transparencies", "Flip charts", "All of the above"], "a": 3, "e": "Presentation software can supplement or replace traditional visual aids such\nas pamphlets, overhead transparencies and flip charts."}, {"t": "ADLR Feb 2025 Questions", "n": 12, "q": "The ______ is the most important accuracy tool to be used in AutoCAD\nfor 2D and 3D drawing.", "o": ["Object Snap or OSNAP", "Object Draw or ODRAW", "Object Sketch or OSKETCH", "None of these"], "a": 0, "e": "Object Snap provides precise selection of important geometric points such\nas endpoints, midpoints, centers and intersections."}]</script>
<script>
const CFG={"key": "rp-ca-kit", "title": "Computer Applications — MCQ Kit Test", "sub": "AutoCAD · GIS software · SDLC & Land Records IT · MS Office · ADLR Feb 2025", "times": [30, 45, 60], "defTime": 45, "counts": [100, 50, 25], "shuffle": false};
const DATA=JSON.parse(document.getElementById('data').textContent).map((q,i)=>(q.id=i,q));
const TOPICS=[...new Set(DATA.map(q=>q.t))];
const app=document.getElementById('app');
let S=null,tick=null;
function h(t,a,...c){const e=document.createElement(t);for(const k in a||{}){const v=a[k];if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}for(const x of c.flat()){if(x==null||x===false)continue;e.append(x.nodeType?x:document.createTextNode(x))}return e}
const pad=n=>String(n).padStart(2,'0');
function fmt(s){s=Math.max(0,Math.round(s));const hh=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return hh?`${hh}:${pad(m)}:${pad(r)}`:`${m}:${pad(r)}`}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hist(){try{return JSON.parse(localStorage.getItem(CFG.key)||'[]')}catch(e){return[]}}
function saveHist(r){try{const a=hist();a.unshift(r);localStorage.setItem(CFG.key,JSON.stringify(a.slice(0,6)))}catch(e){}}
const L='ABCD';

function setup(){
  clearInterval(tick);S=null;
  let sel=new Set(TOPICS),cnt='all',per=CFG.defTime,sh=CFG.shuffle;
  const sum=h('div',{class:'mut'}),box=h('div');
  const avail=()=>DATA.filter(q=>sel.has(q.t));
  const nOf=()=>{const a=avail().length;return cnt==='all'?a:Math.min(cnt,a)};
  function draw(){
    const n=nOf();sum.textContent=n?`${n} questions · ${per}s each · total ${fmt(n*per)}`:'Select at least one topic';
    box.replaceChildren(
      h('h2',{},'Topics'),
      h('div',{class:'row'},TOPICS.map(t=>h('label',{class:'chk'},h('input',{type:'checkbox',...(sel.has(t)?{checked:''}:{}),onchange:e=>{e.target.checked?sel.add(t):sel.delete(t);draw()}}),`${t} (${DATA.filter(q=>q.t===t).length})`))),
      h('div',{class:'row',style:'margin-top:8px'},h('button',{class:'btn',onclick:()=>{sel=new Set(TOPICS);draw()}},'Select all'),h('button',{class:'btn',onclick:()=>{sel=new Set();draw()}},'Clear')),
      h('h2',{style:'margin-top:16px'},'Number of questions'),
      h('div',{class:'row'},['all',...CFG.counts].filter(c=>c==='all'||c<avail().length).map(c=>h('button',{class:'btn'+(cnt===c?' on':''),onclick:()=>{cnt=c;draw()}},c==='all'?'All':'Random '+c))),
      h('h2',{style:'margin-top:16px'},'Time per question'),
      h('div',{class:'row'},CFG.times.map(t=>h('button',{class:'btn'+(per===t?' on':''),onclick:()=>{per=t;draw()}},t+' s'))),
      h('label',{class:'chk',style:'margin-top:14px;width:fit-content'},h('input',{type:'checkbox',...(sh?{checked:''}:{}),onchange:e=>{sh=e.target.checked}}),'Shuffle option order'),
      h('div',{style:'margin-top:16px'},sum,h('button',{class:'btn pri',style:'margin-top:8px',onclick:()=>{if(nOf())start(shuf(avail()).slice(0,nOf()).sort((a,b)=>a.id-b.id),per,sh)}},'Start test'))
    );
  }
  draw();
  const H=hist();
  app.replaceChildren(h('h1',{},CFG.title),h('div',{class:'mut'},CFG.sub),
    h('div',{class:'card'},h('b',{},'Marking: '),'+1 correct · −0.25 wrong · 0 skipped. The test auto-submits when time runs out.'),
    h('div',{class:'card'},box),
    H.length?h('div',{class:'card'},h('h2',{},'Recent attempts'),h('div',{class:'tblw'},h('table',{},h('tr',{},['Date','Score','Accuracy'].map(x=>h('th',{},x))),H.map(r=>h('tr',{},h('td',{},r.d),h('td',{},`${r.s} / ${r.n}`),h('td',{},r.acc+'%')))))):null);
}

function start(list,per,sh){
  S={per,sh,i:0,done:false,confirm:false,qs:list.map(q=>{let o=q.o.map((t,k)=>({t,ok:k===q.a}));if(sh)o=shuf(o);return{id:q.id,t:q.t,n:q.n,q:q.q,e:q.e,o,pick:-1,mark:false}}),total:list.length*per};
  S.end=Date.now()+S.total*1000;
  clearInterval(tick);tick=setInterval(()=>{const r=(S.end-Date.now())/1000,el=document.getElementById('timer');if(el){el.textContent=fmt(r);el.className=r<=Math.max(60,S.total*.1)?'low':''}if(r<=0)submit()},500);
  view();
}
function go(i){S.i=Math.max(0,Math.min(S.qs.length-1,i));S.confirm=false;view()}
function pick(k){const q=S.qs[S.i];q.pick=q.pick===k?-1:k;view()}
function view(){
  const q=S.qs[S.i],n=S.qs.length,ans=S.qs.filter(x=>x.pick>=0).length;
  const pal=h('div',{class:'pal'},S.qs.map((x,i)=>h('button',{class:(x.pick>=0?'ans ':'')+(x.mark?'mk ':'')+(i===S.i?'cur':''),onclick:()=>go(i)},i+1)));
  app.replaceChildren(
    h('div',{class:'top'},h('div',{},h('b',{},`Q ${S.i+1} / ${n}`),h('span',{class:'mut'},`  · answered ${ans}`)),h('div',{class:'row'},h('span',{id:'timer'},fmt((S.end-Date.now())/1000)),h('button',{class:'btn pri',onclick:()=>{S.confirm=true;view()}},'Submit'))),
    S.confirm?h('div',{class:'banner'},`${n-ans} unanswered, ${S.qs.filter(x=>x.mark).length} marked for review. Submit now?  `,h('button',{class:'btn pri',onclick:submit},'Yes, submit'),' ',h('button',{class:'btn',onclick:()=>{S.confirm=false;view()}},'Keep going')):null,
    h('div',{class:'grid'},
      h('div',{class:'card'},h('span',{class:'tag'},q.t),q.mark?h('span',{class:'tag'},'⚑ marked'):null,
        h('div',{class:'stem'},q.q),
        q.o.map((o,k)=>h('button',{class:'opt'+(q.pick===k?' sel':''),onclick:()=>pick(k)},h('b',{},L[k]),h('span',{},o.t))),
        h('div',{class:'row',style:'margin-top:12px'},h('button',{class:'btn',onclick:()=>go(S.i-1)},'← Prev'),h('button',{class:'btn',onclick:()=>go(S.i+1)},'Next →'),
          h('button',{class:'btn'+(q.mark?' on':''),onclick:()=>{q.mark=!q.mark;view()}},'Mark (M)'),h('button',{class:'btn',onclick:()=>{q.pick=-1;view()}},'Clear')),
        h('div',{class:'mut',style:'margin-top:8px;font-size:.85rem'},'Keys: 1–4 or A–D answer · ←/→ move · M mark · Backspace clear')),
      h('div',{class:'card'},h('h2',{},'Palette'),pal,h('div',{class:'mut',style:'font-size:.8rem;margin-top:8px'},'Blue = answered · amber outline = marked'))));
}
document.addEventListener('keydown',e=>{
  if(!S||S.done||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();
  if('1234'.includes(k)&&k.length===1)pick(+k-1);else if('abcd'.includes(k)&&k.length===1)pick('abcd'.indexOf(k));
  else if(k==='arrowright')go(S.i+1);else if(k==='arrowleft')go(S.i-1);else if(k==='m'){S.qs[S.i].mark=!S.qs[S.i].mark;view()}else if(k==='backspace'||k==='delete'){S.qs[S.i].pick=-1;view()}
});

function submit(){
  if(!S||S.done)return;clearInterval(tick);S.done=true;S.used=Math.min(S.total,S.total-(S.end-Date.now())/1000);
  let c=0,w=0;S.qs.forEach(q=>{if(q.pick<0)return;q.o[q.pick].ok?c++:w++});
  S.c=c;S.w=w;S.sk=S.qs.length-c-w;S.score=c-w*.25;
  saveHist({d:new Date().toLocaleString(),s:S.score,n:S.qs.length,acc:S.qs.length?Math.round(c/S.qs.length*100):0});
  S.filter='all';results();
}
function results(){
  const n=S.qs.length,att=S.c+S.w;
  const rows=[...new Set(S.qs.map(q=>q.t))].map(t=>{const a=S.qs.filter(q=>q.t===t),c=a.filter(q=>q.pick>=0&&q.o[q.pick].ok).length,w=a.filter(q=>q.pick>=0&&!q.o[q.pick].ok).length;return{t,n:a.length,c,w,sk:a.length-c-w,s:c-w*.25,p:Math.round(c/a.length*100)}});
  const st=q=>q.pick<0?'sk':q.o[q.pick].ok?'ok':'bad';
  const shown=S.qs.map((q,i)=>({q,i})).filter(({q})=>S.filter==='all'||(S.filter==='wrong'&&st(q)==='bad')||(S.filter==='skip'&&st(q)==='sk')||(S.filter==='right'&&st(q)==='ok'));
  const redo=S.qs.filter(q=>st(q)!=='ok');
  app.replaceChildren(
    h('h1',{},'Result'),
    h('div',{class:'stat'},h('div',{},'Net score',h('b',{},`${S.score} / ${n}`)),h('div',{},'Correct',h('b',{},S.c)),h('div',{},'Wrong (−0.25 each)',h('b',{},S.w)),h('div',{},'Skipped',h('b',{},S.sk)),h('div',{},'Accuracy (of attempted)',h('b',{},att?Math.round(S.c/att*100)+'%':'–')),h('div',{},'Time used',h('b',{},fmt(S.used)))),
    h('div',{class:'card'},h('h2',{},'Topic-wise'),h('div',{class:'tblw'},h('table',{},h('tr',{},['Topic','Qs','✓','✗','Skip','Net','% correct'].map(x=>h('th',{},x))),rows.map(r=>h('tr',{},h('td',{},r.t),h('td',{},r.n),h('td',{},r.c),h('td',{},r.w),h('td',{},r.sk),h('td',{},r.s),h('td',{class:r.p<50?'weak':''},r.p+'%'+(r.p<50?' ⚠':'')))))),h('div',{class:'mut',style:'font-size:.85rem;margin-top:6px'},'Topics under 50% are flagged.')),
    h('div',{class:'row'},redo.length?h('button',{class:'btn pri',onclick:()=>start(redo.map(q=>DATA[q.id]),S.per,S.sh)},`Retry wrong & skipped (${redo.length})`):null,h('button',{class:'btn',onclick:setup},'New test')),
    h('h2',{style:'margin-top:18px'},'Review'),
    h('div',{class:'row'},[['all','All'],['wrong','Wrong'],['skip','Skipped'],['right','Correct']].map(([k,l])=>h('button',{class:'btn'+(S.filter===k?' on':''),onclick:()=>{S.filter=k;results()}},l))),
    shown.map(({q,i})=>h('div',{class:'card'},h('span',{class:'tag'},`Q${i+1}`),h('span',{class:'tag'},q.t),h('b',{class:st(q)==='ok'?'':'weak'},st(q)==='ok'?'✓ Correct':st(q)==='bad'?'✗ Wrong':'— Skipped'),
      h('div',{class:'stem'},q.q),
      q.o.map((o,k)=>h('div',{class:'opt'+(o.ok?' ok':q.pick===k?' bad':'')},h('b',{},L[k]),h('span',{},o.t+(q.pick===k?'   (your answer)':'')+(o.ok?'   ✓':'')))),
      q.e?h('div',{class:'exp'},q.e):null)));
  window.scrollTo(0,0);
}
setup();
</script></body></html>
