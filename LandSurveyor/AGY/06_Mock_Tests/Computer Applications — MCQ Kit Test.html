<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f4ef;--card:#fff;--ink:#1c2230;--mut:#667085;--line:#dedbd1;--acc:#1f5fbf;--accbg:#e7effb;--ok:#14733f;--okbg:#e2f4e9;--bad:#b3261e;--badbg:#fbe8e6;--warn:#8a5a00;--warnbg:#fff1cc}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161b;--card:#1c2027;--ink:#e8eaee;--mut:#9aa3b2;--line:#323843;--acc:#6ea3f5;--accbg:#1d2a40;--ok:#58c98a;--okbg:#17301f;--bad:#f2837b;--badbg:#3a1d1b;--warn:#f0c15a;--warnbg:#3a2f12}}
:root[data-theme="dark"]{--bg:#13161b;--card:#1c2027;--ink:#e8eaee;--mut:#9aa3b2;--line:#323843;--acc:#6ea3f5;--accbg:#1d2a40;--ok:#58c98a;--okbg:#17301f;--bad:#f2837b;--badbg:#3a1d1b;--warn:#f0c15a;--warnbg:#3a2f12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:14px}
h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.1rem;margin:.2em 0 .6em}
.mut{color:var(--mut)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 14px}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chk{display:flex;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
#timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.15rem;padding:4px 12px;border-radius:9px;background:var(--accbg);color:var(--acc)}
#timer.low{background:var(--badbg);color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 230px;gap:12px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.tag{display:inline-block;font-size:.78rem;padding:2px 8px;border-radius:99px;background:var(--accbg);color:var(--acc);margin-right:6px}
.stem{white-space:pre-line;font-size:1.05rem;margin:.6em 0 1em;overflow-wrap:anywhere}
.opt{display:flex;gap:10px;width:100%;text-align:left;padding:10px 12px;margin:7px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow-wrap:anywhere}
.opt b{min-width:1.4em;color:var(--mut)}
.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.pal button{padding:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:.85rem}
.pal .ans{background:var(--accbg);border-color:var(--acc)}.pal .mk{outline:2px solid var(--warn)}.pal .cur{box-shadow:0 0 0 2px var(--ink)}
.pal .ok{background:var(--okbg);border-color:var(--ok)}.pal .bad{background:var(--badbg);border-color:var(--bad)}
.exp{margin-top:8px;padding:8px 12px;border-radius:9px;background:var(--warnbg);color:var(--ink);font-size:.95rem}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat div{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card)}.stat b{display:block;font-size:1.4rem}
.tblw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.92rem}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.weak{color:var(--bad);font-weight:600}.banner{background:var(--warnbg);border:1px solid var(--warn);border-radius:10px;padding:10px;margin:8px 0}
</style></head><body><div class="wrap" id="app"></div>
<script type="application/json" id="data">[{"t": "AutoCAD", "n": 1, "q": "Consider the following statements regarding AutoCAD Coordinate Systems.\n\nAutoCAD Coordinate Systems ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. Absolute Coordinates locate a point with reference to the Origin (0,0).\nAbsolute Coordinates ಒಂದು ಬಿಂದುವಿನ ಸ್ಥಾನವನ್ನು Origin (0,0) ಗೆ ಸಂಬಂಧಿಸಿ ಸೂಚಿಸುತ್ತವೆ.\n2. Relative Coordinates locate the next point with reference to the previous point.\nRelative Coordinates ಮುಂದಿನ ಬಿಂದುವಿನ ಸ್ಥಾನವನ್ನು ಹಿಂದಿನ ಬಿಂದುಕ್ಕೆ ಸಂಬಂಧಿಸಿ ಸೂಚಿಸುತ್ತವೆ.\n3. Polar Coordinates specify a point using Distance and Angle.\nPolar Coordinates Distance ಮತ್ತು Angle ಬಳಸಿ ಬಿಂದುವಿನ ಸ್ಥಾನವನ್ನು ಸೂಚಿಸುತ್ತವೆ.\n4. In @100<45, the @ symbol indicates that the point is measured from the Origin.\n@100<45 ನಲ್ಲಿ @ ಚಿಹ್ನೆಯು ಬಿಂದುವನ್ನು Origin ನಿಂದ ಅಳೆಯುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ.\n\nWhich of the above statements are correct?\nಮೇಲಿನ ಹೇಳಿಕೆಗಳಲ್ಲಿ ಯಾವುವು ಸರಿಯಾಗಿವೆ?", "o": ["1 and 2 only / 1 ಮತ್ತು 2 ಮಾತ್ರ", "1, 2 and 3 only / 1, 2 ಮತ್ತು 3 ಮಾತ್ರ", "2, 3 and 4 only / 2, 3 ಮತ್ತು 4 ಮಾತ್ರ", "1, 2, 3 and 4 / 1, 2, 3 ಮತ್ತು 4"], "a": 1, "e": "Absolute → Origin; Relative → Previous Point; Polar → Distance + Angle.\n@ ಚಿಹ್ನೆಯು Previous Point ಅನ್ನು reference ಆಗಿ ಬಳಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಆದ್ದರಿಂದ Statement 4\nತಪ್ಪಾಗಿದೆ."}, {"t": "AutoCAD", "n": 2, "q": "A surveyor wants to draw a boundary line of 125 units at 60° from the current\npoint. Which input is correct?\n\nಒಬ್ಬ Surveyor ಪ್ರಸ್ತುತ ಬಿಂದುವಿನಿಂದ 60° ಕೋನದಲ್ಲಿ 125 Units ಉದ್ದದ Boundary Line ಬಿಡಿಸಲು\nಬಯಸುತ್ತಾರೆ. ಸರಿಯಾದ Input ಯಾವುದು?", "o": ["125,60", "@125,60", "@125<60", "60<125"], "a": 2, "e": "Polar Coordinate format:\n@Distance<Angle\nಆದ್ದರಿಂದ @125<60 ಎಂದರೆ ಪ್ರಸ್ತುತ ಬಿಂದುವಿನಿಂದ 125 Units Distance ಮತ್ತು 60° Angle."}, {"t": "AutoCAD", "n": 3, "q": "Match List-I with List-II.\n\nಪಟ್ಟಿ-I ಅನ್ನು ಪಟ್ಟಿ-II ಜೊತೆಗೆ ಹೊಂದಿಸಿ.\n\nList-I | List-II\n\nA. F3 | 1. Grid\n\nB. F7 | 2. OSNAP\n\nC. F8 | 3. Ortho\n\nD. F10 | 4. Polar Tracking\n\nE. F12 | 5. Dynamic Input", "o": ["A-2, B-1, C-3, D-4, E-5", "A-1, B-2, C-3, D-4, E-5", "A-2, B-3, C-1, D-5, E-4", "A-3, B-1, C-2, D-4, E-5"], "a": 0, "e": "F3 → OSNAP\nF7 → Grid\nF8 → Ortho\nF10 → Polar Tracking\nF12 → Dynamic Input."}, {"t": "AutoCAD", "n": 4, "q": "A surveyor wants to start a line exactly from the Midpoint of an existing line\nand draw it only horizontally or vertically. Which combination is most\nappropriate?\n\nಒಬ್ಬ Surveyor ಈಗಿರುವ Line ನ Midpoint ನಿಂದ ನಿಖರವಾಗಿ ಹೊಸ Line ಪ್ರಾರಂಭಿಸಿ, ಅದನ್ನು Horizontal\nಅಥವಾ Vertical ಆಗಿ ಮಾತ್ರ ಬಿಡಿಸಲು ಬಯಸುತ್ತಾರೆ. ಯಾವ Combination ಸೂಕ್ತ?", "o": ["F7 + F9", "F3 + F8", "F9 + F10", "F10 + F11"], "a": 1, "e": "F3 – OSNAP → Midpoint ಅನ್ನು ನಿಖರವಾಗಿ ಹಿಡಿಯುತ್ತದೆ.\nF8 – Ortho → Horizontal/Vertical direction ಗೆ ಮಾತ್ರ Cursor ಅನ್ನು ನಿರ್ಬಂಧಿಸುತ್ತದೆ."}, {"t": "AutoCAD", "n": 5, "q": "Consider the following pairs.\n\nಕೆಳಗಿನ ಜೋಡಿಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. FILLET — Rounded corner / ದುಂಡಾದ ಮೂಲೆ\n2. CHAMFER — Sloping corner / ಇಳಿಜಾರಾದ ಮೂಲೆ\n3. OFFSET — Parallel copy / ಸಮಾನಾಂತರ ಪ್ರತಿ\n4. TRIM — Removes unwanted portion / ಅನಗತ್ಯ ಭಾಗವನ್ನು ತೆಗೆದುಹಾಕುವುದು\n5. EXTEND — Extends object to meet another object / ಮತ್ತೊಂದು ವಸ್ತುವನ್ನು ತಲುಪುವವರೆಗೆ\nವಿಸ್ತರಿಸುವುದು\n6. MIRROR — Symmetrical copy / ಸಮ್ಮಿತೀಯ ಪ್ರತಿ\n\nHow many pairs are correctly matched?\nಎಷ್ಟು ಜೋಡಿಗಳು ಸರಿಯಾಗಿ ಹೊಂದಿಕೆಯಾಗಿವೆ?", "o": ["Four / ನಾಲ್ಕು", "Five / ಐದು", "Six / ಆರು", "Three / ಮೂರು"], "a": 2, "e": "ಎಲ್ಲಾ 6 ಜೋಡಿಗಳು ಸರಿಯಾಗಿವೆ. ವಿಶೇಷವಾಗಿ FILLET = Rounded ಮತ್ತು CHAMFER = Sloping\nಎಂಬ ವ್ಯತ್ಯಾಸವನ್ನು ನೆನಪಿಡಬೇಕು."}, {"t": "AutoCAD", "n": 6, "q": "A cadastral drawing contains duplicate boundary lines, overlapping\nsegments and unnecessary objects. Which command is most appropriate for\ncleaning the geometry?\n\nಒಂದು Cadastral Drawing ನಲ್ಲಿ Duplicate Boundary Lines, Overlapping Segments ಮತ್ತು Unnecessary Objects\nಇವೆ. Geometry Cleanup ಮಾಡಲು ಯಾವ Command ಹೆಚ್ಚು ಸೂಕ್ತ?", "o": ["PEDIT", "OVERKILL", "OFFSET", "EXPLODE"], "a": 1, "e": "OVERKILL Duplicate Lines, Overlapping Segments ಮತ್ತು Unnecessary Objects ಅನ್ನು ತೆಗೆದುಹಾಕಲು\nಬಳಸಲಾಗುತ್ತದೆ.\nPEDIT ಮುಖ್ಯವಾಗಿ Polyline ಅನ್ನು Edit, Join ಮತ್ತು Close ಮಾಡಲು ಬಳಸಲಾಗುತ್ತದೆ."}, {"t": "AutoCAD", "n": 7, "q": "Consider the following statements regarding PEDIT.\n\nPEDIT ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. PEDIT can join separate lines into a polyline.\nPEDIT ಪ್ರತ್ಯೇಕ Lines ಗಳನ್ನು ಒಂದು Polyline ಆಗಿ Join ಮಾಡಬಹುದು.\n2. PEDIT provides a Close option.\nPEDIT ನಲ್ಲಿ Polyline ಅನ್ನು Close ಮಾಡುವ ಆಯ್ಕೆ ಇದೆ.\n3. PEDIT can be useful for preparing closed cadastral parcel boundaries.\nClosed Cadastral Parcel Boundary ತಯಾರಿಸಲು PEDIT ಉಪಯುಕ್ತವಾಗಿದೆ.\n4. PEDIT combines multiple 3D solids into a single solid.\nPEDIT ಹಲವಾರು 3D Solids ಗಳನ್ನು ಒಂದು Solid ಆಗಿ ಸೇರಿಸುತ್ತದೆ.\n\nWhich statements are correct?\nಯಾವ ಹೇಳಿಕೆಗಳು ಸರಿಯಾಗಿವೆ?", "o": ["1 and 2 only", "1, 2 and 3 only", "1 and 4 only", "All four"], "a": 1, "e": "PEDIT → Join + Close.\n3D Solids ಅನ್ನು Combine ಮಾಡಲು UNION ಬಳಸಲಾಗುತ್ತದೆ. ಆದ್ದರಿಂದ Statement 4 ತಪ್ಪಾಗಿದೆ."}, {"t": "AutoCAD", "n": 8, "q": "A parcel consists of four separate boundary segments. The surveyor wants to\ncreate one closed boundary and then apply HATCH. What is the most logical\nsequence?\n\nಒಂದು Parcel ನಾಲ್ಕು ಪ್ರತ್ಯೇಕ Boundary Segments ಗಳಿಂದ ಕೂಡಿದೆ. ಅವುಗಳನ್ನು ಒಂದೇ Closed Boundary\nಆಗಿ ಮಾಡಿ ನಂತರ HATCH ಅನ್ವಯಿಸಬೇಕು. ಸೂಕ್ತ ಕ್ರಮ ಯಾವುದು?", "o": ["HATCH → PEDIT → Join → Close", "PEDIT → Join → Close → HATCH", "PEDIT → HATCH → Join → Close", "OVERKILL → HATCH → Mirror → Close"], "a": 1, "e": "ಮೊದಲು PEDIT → Join → Close ಮೂಲಕ Boundary ಅನ್ನು Closed ಮಾಡಬೇಕು. ನಂತರ HATCH\nಅನ್ವಯಿಸಬಹುದು.\nWorkflow:\nJoin → Close → Hatch"}, {"t": "AutoCAD", "n": 9, "q": "Consider the following statements regarding HATCH.\n\nHATCH ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. HATCH generally requires a closed boundary.\nHATCH ಸಾಮಾನ್ಯವಾಗಿ Closed Boundary ಅಗತ್ಯವಿರುತ್ತದೆ.\n2. Smaller Hatch Scale generally produces a denser pattern.\nSmaller Hatch Scale ಸಾಮಾನ್ಯವಾಗಿ ಹೆಚ್ಚು Dense Pattern ನೀಡುತ್ತದೆ.\n3. Associative Hatch can respond to modifications of its boundary.\nAssociative Hatch Boundary ಬದಲಾವಣೆಗೆ ಅನುಗುಣವಾಗಿ Update ಆಗಬಹುದು.\n4. Larger Hatch Scale generally produces a denser pattern.\nLarger Hatch Scale ಸಾಮಾನ್ಯವಾಗಿ ಹೆಚ್ಚು Dense Pattern ನೀಡುತ್ತದೆ.\n\nWhich of the above are correct?\nಮೇಲಿನವುಗಳಲ್ಲಿ ಯಾವುವು ಸರಿಯಾಗಿವೆ?", "o": ["1 and 2 only", "1, 2 and 3 only", "1, 3 and 4 only", "All four"], "a": 1, "e": "Small Scale → Dense Hatch\nLarge Scale → Sparse Hatch\nಆದ್ದರಿಂದ Statement 4 ತಪ್ಪಾಗಿದೆ."}, {"t": "AutoCAD", "n": 10, "q": "A room boundary appears closed visually, but HATCH cannot detect the\nenclosed area. What is the most likely reason?\n\nಒಂದು Room Boundary Screen ಮೇಲೆ Closed ಆಗಿರುವಂತೆ ಕಾಣುತ್ತದೆ. ಆದರೆ HATCH Enclosed Area ಅನ್ನು\nಗುರುತಿಸುತ್ತಿಲ್ಲ. ಹೆಚ್ಚು ಸಾಧ್ಯತೆಯ ಕಾರಣ ಯಾವುದು?", "o": ["UCS is necessarily incorrect", "A small gap may exist in the boundary", "TEXT command is disabled", "The boundary must first be converted into a 3D solid"], "a": 1, "e": "Boundary ನಲ್ಲಿ ಸಣ್ಣ Gap ಇದ್ದರೂ AutoCAD ಸಂಪೂರ್ಣ Closed Boundary ಅನ್ನು ಗುರುತಿಸಲು\nವಿಫಲವಾಗಬಹುದು. ಆದ್ದರಿಂದ HATCH ಅನ್ವಯಿಸುವ ಮೊದಲು Boundary Closure ಪರಿಶೀಲಿಸಬೇಕು."}, {"t": "AutoCAD", "n": 11, "q": "Match the 3D commands with their functions.\n\n3D Commands ಮತ್ತು ಅವುಗಳ Functions ಅನ್ನು ಹೊಂದಿಸಿ.\n\nCommand | Function\n\nA. EXTRUDE | 1. Combine solids\n\nB. UNION | 2. Convert closed 2D profile into 3D solid\n\nC. SUBTRACT | 3. Keep common volume\n\nD. INTERSECT | 4. Remove one solid from another", "o": ["A-2, B-1, C-4, D-3", "A-1, B-2, C-4, D-3", "A-2, B-4, C-1, D-3", "A-3, B-1, C-4, D-2"], "a": 0, "e": "EXTRUDE → 2D Profile → 3D Solid\nUNION → Combine\nSUBTRACT → Remove\nINTERSECT → Common Volume"}, {"t": "AutoCAD", "n": 12, "q": "A closed circular profile is extruded vertically by 100 units. What is the\nresulting 3D object?\n\nಒಂದು Closed Circular Profile ಅನ್ನು 100 Units Vertical ಆಗಿ Extrude ಮಾಡಿದರೆ ಯಾವ 3D Object\nಸೃಷ್ಟಿಯಾಗುತ್ತದೆ?", "o": ["Sphere / ಗೋಳ", "Cylinder / ಸಿಲಿಂಡರ್", "Cone / ಶಂಕು", "Torus / ಟೋರಸ್"], "a": 1, "e": "A Circle + EXTRUDE produces a Cylinder. Circle ಅನ್ನು ಒಂದು Direction ನಲ್ಲಿ Extend ಮಾಡಿದಾಗ\nCylinder ರೂಪುಗೊಳ್ಳುತ್ತದೆ."}, {"t": "AutoCAD", "n": 13, "q": "A cylinder is used as a cutting solid to create a circular hole in a rectangular\nblock. Which command should be used?\n\nಒಂದು Rectangular Block ನಲ್ಲಿ Circular Hole ಮಾಡಲು Cylinder ಅನ್ನು Cutting Solid ಆಗಿ ಬಳಸಲಾಗುತ್ತಿದೆ.\nಯಾವ Command ಬಳಸಬೇಕು?", "o": ["UNION", "INTERSECT", "SUBTRACT", "MIRROR3D"], "a": 2, "e": "SUBTRACT ಒಂದು Solid ನ Volume ಅನ್ನು ಮತ್ತೊಂದು Solid ನಿಂದ ತೆಗೆದುಹಾಕುತ್ತದೆ. ಇಲ್ಲಿ Cylinder =\nCutting Solid ಮತ್ತು Block = Main Solid."}, {"t": "AutoCAD", "n": 14, "q": "Consider the following statements regarding Boolean Operations.\n\nBoolean Operations ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. UNION combines solids.\nUNION Solids ಗಳನ್ನು ಸೇರಿಸುತ್ತದೆ.\n2. SUBTRACT removes one solid from another.\nSUBTRACT ಒಂದು Solid ಅನ್ನು ಮತ್ತೊಂದರಿಂದ ತೆಗೆದುಹಾಕುತ್ತದೆ.\n3. INTERSECT keeps only the common overlapping portion.\nINTERSECT Common Overlapping Portion ಅನ್ನು ಮಾತ್ರ ಉಳಿಸುತ್ತದೆ.\n\n4. MIRROR3D keeps only the common volume of two solids.\nMIRROR3D ಎರಡು Solids ಗಳ Common Volume ಅನ್ನು ಮಾತ್ರ ಉಳಿಸುತ್ತದೆ.\n\nHow many statements are correct?\nಎಷ್ಟು ಹೇಳಿಕೆಗಳು ಸರಿಯಾಗಿವೆ?", "o": ["One / ಒಂದು", "Two / ಎರಡು", "Three / ಮೂರು", "Four / ನಾಲ್ಕು"], "a": 2, "e": "ಮೊದಲ ಮೂರು Statements ಸರಿಯಾಗಿವೆ. MIRROR3D Common Volume ಅನ್ನು ಉಳಿಸುವುದಿಲ್ಲ; ಅದು 3D\nObject ನ Mirrored Copy ರಚಿಸುತ್ತದೆ."}, {"t": "AutoCAD", "n": 15, "q": "A surveyor wants to draw on an inclined surface of a structure by changing\nthe orientation of the X, Y and Z axes. Which concept is most relevant?\n\nಒಬ್ಬ Surveyor ಒಂದು Inclined Surface ಮೇಲೆ X, Y ಮತ್ತು Z Axes ಗಳ Orientation ಬದಲಿಸಿ Drawing ಮಾಡಲು\nಬಯಸುತ್ತಾರೆ. ಯಾವ Concept ಹೆಚ್ಚು ಸಂಬಂಧಿಸಿದೆ?", "o": ["HATCH", "UCS", "OVERKILL", "STYLE"], "a": 1, "e": "UCS – User Coordinate System ಪ್ರಸ್ತುತ Working Coordinate Orientation ಅನ್ನು ಬದಲಾಯಿಸಲು\nಸಹಾಯ ಮಾಡುತ್ತದೆ. Inclined Surface, Vertical Face ಮತ್ತು Custom Work Plane ಗಳಲ್ಲಿ ಇದು ಉಪಯುಕ್ತ."}, {"t": "AutoCAD", "n": 16, "q": "Consider the following statements regarding annotation commands.\n\nAnnotation Commands ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. TEXT/DTEXT creates single-line text.\n2. MTEXT supports multiline text.\n3. STYLE controls text appearance.\n4. DAN measures radius.\n5. DRA displays radius.\n\nHow many statements are correct?\nಎಷ್ಟು ಹೇಳಿಕೆಗಳು ಸರಿಯಾಗಿವೆ?", "o": ["Two / ಎರಡು", "Three / ಮೂರು", "Four / ನಾಲ್ಕು", "Five / ಐದು"], "a": 2, "e": "Correct: 1, 2, 3 and 5.\nDAN → Angular Dimension\nDRA → Radius"}, {"t": "AutoCAD", "n": 17, "q": "A Survey Number is a short label, while a detailed construction note\ncontains several lines. Which combination is most appropriate?\n\nSurvey Number ಒಂದು Short Label ಆಗಿದ್ದು, Construction Note ಹಲವು ಸಾಲುಗಳನ್ನು ಹೊಂದಿದೆ. ಸೂಕ್ತವಾದ\nCombination ಯಾವುದು?", "o": ["MTEXT + TEXT", "TEXT + MTEXT", "STYLE + DLI", "DRA + TEXT"], "a": 1, "e": "TEXT/DTEXT → Short single-line labels\nMTEXT → Multiline notes, specifications and instructions\nಆದ್ದರಿಂದ Survey Number ಗೆ TEXT ಮತ್ತು Detailed Note ಗೆ MTEXT ಸೂಕ್ತ."}, {"t": "AutoCAD", "n": 18, "q": "Which one of the following is NOT correctly matched?\n\nಕೆಳಗಿನವುಗಳಲ್ಲಿ ಯಾವುದು ಸರಿಯಾಗಿ ಹೊಂದಿಕೆಯಾಗಿಲ್ಲ?", "o": ["DLI — Linear Dimension / Linear ಅಳತೆ", "DAL — Aligned Dimension / Aligned ಅಳತೆ", "DAN — Angular Dimension / Angular ಅಳತೆ", "DRA — Linear Dimension / Linear ಅಳತೆ"], "a": 3, "e": "DRA → Radius Dimension.\nLinear Dimension ಗೆ DLI ಬಳಸಲಾಗುತ್ತದೆ."}, {"t": "AutoCAD", "n": 19, "q": "A surveyor wants to create the opposite half of a symmetrical 2D building\nelevation while retaining the original half. Which is the correct approach?\n\nಒಬ್ಬ Surveyor Symmetrical 2D Building Elevation ನ ಇನ್ನೊಂದು Half ಅನ್ನು ರಚಿಸಿ Original Half ಅನ್ನು\nಉಳಿಸಬೇಕು. ಸರಿಯಾದ ವಿಧಾನ ಯಾವುದು?", "o": ["MIRROR → Yes", "MIRROR → No", "SCALE → Copy", "OFFSET → Trim"], "a": 1, "e": "MIRROR ನಂತರ Erase Source Objects? ಎಂಬ ಆಯ್ಕೆ ಬರುತ್ತದೆ.\nYes → Original deleted\nNo → Original retained\nಆದ್ದರಿಂದ ಎರಡೂ halves ಉಳಿಸಬೇಕಾದರೆ No ಆಯ್ಕೆ ಮಾಡಬೇಕು."}, {"t": "AutoCAD", "n": 20, "q": "Match the following DXF sections.\n\nDXF Section ಮತ್ತು Content ಅನ್ನು ಹೊಂದಿಸಿ.\n\nDXF Section | Content\n\nA. HEADER | 1. Actual drawing objects\n\nB. TABLES | 2. Global drawing variables/settings\n\nC. BLOCKS | 3. Reusable components\n\nD. ENTITIES | 4. Layers, linetypes and text styles", "o": ["A-2, B-4, C-3, D-1", "A-4, B-2, C-3, D-1", "A-2, B-3, C-4, D-1", "A-1, B-4, C-2, D-3"], "a": 0, "e": "HEADER → Settings\nTABLES → Definitions\nBLOCKS → Reusable Components\nENTITIES → Actual Drawing Objects"}, {"t": "AutoCAD", "n": 21, "q": "Consider the following statements about DXFIN and DXFOUT.\n\nDXFIN ಮತ್ತು DXFOUT ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. DXFIN is associated with importing DXF data into AutoCAD.\n2. DXFOUT is associated with exporting AutoCAD drawings as DXF.\n3. DXF supports exchange of drawing data between compatible CAD/GIS\napplications.\n4. DXFOUT removes duplicate cadastral boundaries.\n\nWhich of the above statements are correct?\nಮೇಲಿನ ಹೇಳಿಕೆಗಳಲ್ಲಿ ಯಾವುವು ಸರಿಯಾಗಿವೆ?", "o": ["1 and 2 only", "1, 2 and 3 only", "1, 3 and 4 only", "All four"], "a": 1, "e": "DXFIN → DXF IN → Import\nDXFOUT → DXF OUT → Export\nDuplicate geometry removal is associated with OVERKILL, not DXFOUT."}, {"t": "AutoCAD", "n": 22, "q": "Consider the following statements about cadastral data cleanup.\n\nCadastral Data Cleanup ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. Raw survey data may contain duplicate lines.\n2. Overlapping segments may occur in raw data.\n3. OVERKILL can remove duplicate/overlapping geometry.\n4. PEDIT can join separate line segments.\n5. PEDIT Close can help form a closed parcel boundary.\n\nHow many statements are correct?\nಎಷ್ಟು ಹೇಳಿಕೆಗಳು ಸರಿಯಾಗಿವೆ?", "o": ["Three / ಮೂರು", "Four / ನಾಲ್ಕು", "Five / ಐದು", "Two / ಎರಡು"], "a": 2, "e": "All five statements are correct.\nA typical cadastral cleanup workflow is:\nOVERKILL → PEDIT → Join → Close\nಇದು Raw Survey Geometry ಅನ್ನು Clean ಮತ್ತು Closed Parcel Boundary ಆಗಿ ಪರಿವರ್ತಿಸಲು ಸಹಾಯ\nಮಾಡುತ್ತದೆ."}, {"t": "AutoCAD", "n": 23, "q": "Which one of the following is correctly matched?\n\nಕೆಳಗಿನವುಗಳಲ್ಲಿ ಯಾವುದು ಸರಿಯಾಗಿ ಹೊಂದಿಕೆಯಾಗಿವೆ?", "o": ["B — Inserts a saved Block", "I — Creates a Block", "MA — Copies object properties", "X — Creates a reusable Block"], "a": 2, "e": "MA – Match Properties ಒಂದು Object ನ Properties ಅನ್ನು ಮತ್ತೊಂದು Object ಗೆ Copy ಮಾಡುತ್ತದೆ.\nB → Block creation\nI → Insert Block\nX → Explode"}, {"t": "AutoCAD", "n": 24, "q": "Consider the following statements regarding Visual Styles.\n\nVisual Styles ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. 2D Wireframe mainly displays object edges.\n2. Conceptual provides smooth shaded surfaces.\n3. Realistic can display materials, textures and lighting effects.\n4. Visual Styles control the appearance of 3D models.\n5. Realistic is primarily used to remove duplicate objects.\n\nWhich of the above are correct?\nಮೇಲಿನವುಗಳಲ್ಲಿ ಯಾವುವು ಸರಿಯಾಗಿವೆ?", "o": ["1, 2 and 3 only", "1, 2, 3 and 4 only", "2, 3, 4 and 5 only", "All five"], "a": 1, "e": "Statements 1–4 are correct. Realistic Visual Style is for visualization, not for removing\nduplicate objects. Duplicate cleanup is associated with OVERKILL."}, {"t": "AutoCAD", "n": 25, "q": "Consider the following applications.\n\nಕೆಳಗಿನ Applications ಅನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. Create a parallel road boundary → OFFSET\n2. Remove unwanted line portion → TRIM\n3. Create symmetrical copy → MIRROR\n4. Change object size → SCALE\n5. Copy object properties → MATCH PROPERTIES\n6. Convert closed 2D profile into 3D solid → EXTRUDE\n\nHow many applications are correctly matched?\nಎಷ್ಟು Applications ಸರಿಯಾಗಿ ಹೊಂದಿಕೆಯಾಗಿವೆ?", "o": ["Four / ನಾಲ್ಕು", "Five / ಐದು", "Six / ಆರು", "Three / ಮೂರು"], "a": 2, "e": "All six are correctly matched. These commands belong to different stages of 2D\nmodification, property management and 3D development."}, {"t": "AutoCAD", "n": 26, "q": "Arrange the following operations in the most logical order for preparing a\nclean cadastral parcel.\n\nಒಂದು Clean Cadastral Parcel ತಯಾರಿಸಲು ಕೆಳಗಿನ Operations ಅನ್ನು ಸೂಕ್ತ ಕ್ರಮದಲ್ಲಿ ಜೋಡಿಸಿ.\n\n1. Set Drawing Units / Drawing Units ಹೊಂದಿಸುವುದು\n2. Remove duplicate geometry / Duplicate Geometry ತೆಗೆದುಹಾಕುವುದು\n3. Join boundary segments / Boundary Segments Join ಮಾಡುವುದು\n4. Close parcel boundary / Parcel Boundary Close ಮಾಡುವುದು\n5. Add Survey Number / Survey Number ಸೇರಿಸುವುದು\n6. Apply HATCH / HATCH ಅನ್ವಯಿಸುವುದು", "o": ["1 → 2 → 3 → 4 → 5 → 6", "2 → 1 → 3 → 5 → 4 → 6", "1 → 3 → 2 → 4 → 6 → 5", "3 → 4 → 1 → 2 → 5 → 6"], "a": 0, "e": "Logical workflow:\nUNITS → OVERKILL → PEDIT/Join → Close → TEXT/MTEXT → HATCH\nಮೊದಲು Drawing Environment ಸಿದ್ಧಪಡಿಸಿ, ನಂತರ Geometry Cleanup ಮತ್ತು Boundary Closure ಮಾಡಿ,\nನಂತರ Annotation ಮತ್ತು Hatching ಮಾಡುವುದು ಸೂಕ್ತ."}, {"t": "AutoCAD", "n": 27, "q": "A surveyor receives raw cadastral data with duplicate lines and\ndisconnected parcel boundaries. Which pair of commands is most directly\nassociated with cleanup followed by boundary consolidation?\n\nಒಬ್ಬ Surveyor ಗೆ Duplicate Lines ಮತ್ತು Disconnected Parcel Boundaries ಇರುವ Raw Cadastral Data ಸಿಕ್ಕಿದೆ.\nCleanup ನಂತರ Boundary Consolidation ಮಾಡಲು ಯಾವ Commands ಹೆಚ್ಚು ಸೂಕ್ತ?", "o": ["OVERKILL + PEDIT", "MIRROR + SCALE", "HATCH + STYLE", "UNION + INTERSECT"], "a": 0, "e": "OVERKILL → Duplicate/overlapping geometry cleanup.\nPEDIT → Join and Close operations.\nಇವೆರಡೂ Cadastral Boundary Preparation ನಲ್ಲಿ ಪರಸ್ಪರ ಪೂರಕವಾಗಿವೆ."}, {"t": "AutoCAD", "n": 28, "q": "Consider the following statements about 3D modelling.\n\n3D Modelling ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. EXTRUDE can create a 3D solid from a suitable closed 2D profile.\n2. PRESSPULL can push or pull a face.\n3. UNION combines solids.\n4. SUBTRACT creates only the common volume of two solids.\n5. INTERSECT keeps the common overlapping volume.\n\nWhich of the above statements are correct?\nಮೇಲಿನ ಹೇಳಿಕೆಗಳಲ್ಲಿ ಯಾವುವು ಸರಿಯಾಗಿವೆ?", "o": ["1, 2 and 3 only", "1, 2, 3 and 5 only", "2, 3, 4 and 5 only", "All five"], "a": 1, "e": "Statement 4 is incorrect because SUBTRACT creates the remaining difference after\nremoving one solid from another.\nINTERSECT is the operation that retains the common volume."}, {"t": "AutoCAD", "n": 29, "q": "Analytical Question / ಸಮಗ್ರ ವಿಶ್ಲೇಷಣಾತ್ಮಕ ಪ್ರಶ್ನೆ\n\nA cadastral drawing contains duplicate boundary lines and small overlapping segments.\nAfter cleaning, the parcel lines must be joined and closed. The surveyor then needs to\nplace a Survey Number, apply a hatch and export the drawing to another compatible\nCAD/GIS application.\n\nಒಂದು Cadastral Drawing ನಲ್ಲಿ Duplicate Boundary Lines ಮತ್ತು Overlapping Segments ಇವೆ. Cleanup ನಂತರ\nParcel Lines ಅನ್ನು Join ಮತ್ತು Close ಮಾಡಬೇಕು. ನಂತರ Survey Number ಸೇರಿಸಿ, Hatch ಅನ್ವಯಿಸಿ, Drawing\nಅನ್ನು ಮತ್ತೊಂದು Compatible CAD/GIS Application ಗೆ Export ಮಾಡಬೇಕು.\n\nWhich workflow is most appropriate?\nಯಾವ Workflow ಹೆಚ್ಚು ಸೂಕ್ತವಾಗಿದೆ?", "o": ["OVERKILL → PEDIT/Join → Close → TEXT → HATCH → DXFOUT", "MIRROR → OFFSET → UNION → MTEXT → DXFIN → HATCH", "HATCH → OVERKILL → PEDIT → INTERSECT → DXFIN", "EXTRUDE → UNION → TEXT → PEDIT → DXFOUT"], "a": 0, "e": "ಈ Workflow ನಲ್ಲಿ ಪ್ರತಿಯೊಂದು Command ತನ್ನ ಸರಿಯಾದ ಹಂತದಲ್ಲಿ ಬಳಸಲಾಗಿದೆ:\nOVERKILL → Duplicate Cleanup\nPEDIT/Join/Close → Closed Parcel Boundary\nTEXT → Survey Number\nHATCH → Parcel Filling\nDXFOUT → Export\nಇದು Practical Cadastral CAD Workflow ಅನ್ನು ಪರೀಕ್ಷಿಸುವ ಪ್ರಶ್ನೆಯಾಗಿದೆ."}, {"t": "AutoCAD", "n": 30, "q": "Integrated Analytical Question / ಸಮಗ್ರ ವಿಶ್ಲೇಷಣಾತ್ಮಕ ಪ್ರಶ್ನೆ\n\nA designer has a closed 2D profile of a building component. The component is located\non an inclined face. The designer proposes the following operations:\n\nಒಬ್ಬ Designer ಬಳಿ Building Component ನ Closed 2D Profile ಇದೆ. ಆ Component ಒಂದು Inclined Face\nಮೇಲೆ ಇದೆ. Designer ಕೆಳಗಿನ Operations ಅನ್ನು ಸೂಚಿಸುತ್ತಾರೆ:\n\n1. Use UCS to establish a suitable working orientation.\nಸೂಕ್ತವಾದ Working Orientation ಸ್ಥಾಪಿಸಲು UCS ಬಳಸುವುದು.\n2. Use EXTRUDE to convert the closed profile into a 3D solid.\nClosed Profile ಅನ್ನು 3D Solid ಆಗಿ ಪರಿವರ್ತಿಸಲು EXTRUDE ಬಳಸುವುದು.\n3. Use PRESSPULL to create a recess by pushing a face inward.\nFace ಅನ್ನು ಒಳಗೆ Push ಮಾಡುವ ಮೂಲಕ Recess ರಚಿಸಲು PRESSPULL ಬಳಸುವುದು.\n\n4. Use UNION to combine compatible solids.\nCompatible Solids ಗಳನ್ನು Combine ಮಾಡಲು UNION ಬಳಸುವುದು.\n5. Use SUBTRACT to create an opening by removing a cutting solid.\nCutting Solid ಅನ್ನು ತೆಗೆದುಹಾಕುವ ಮೂಲಕ Opening ರಚಿಸಲು SUBTRACT ಬಳಸುವುದು.\n6. Use INTERSECT when only the common overlapping volume is required.\nCommon Overlapping Volume ಮಾತ್ರ ಅಗತ್ಯವಿದ್ದಾಗ INTERSECT ಬಳಸುವುದು.\n\nWhich of the following conclusions is correct?\nಕೆಳಗಿನ ಯಾವ ನಿರ್ಣಯ ಸರಿಯಾಗಿದೆ?", "o": ["Only 1, 2 and 3 are correct.", "1, 2, 3, 4 and 5 are correct, but 6 is incorrect.", "All six statements are correct.", "Only 4, 5 and 6 are correct."], "a": 2, "e": "All six operations are correctly described:\nUCS → X-Y-Z Working Orientation ಬದಲಾಯಿಸಲು\nEXTRUDE → Closed 2D Profile ಅನ್ನು 3D Solid ಆಗಿ ಪರಿವರ್ತಿಸಲು\nPRESSPULL → Face ಅನ್ನು Push/Pull ಮಾಡಲು\nUNION → Solids Combine ಮಾಡಲು\nSUBTRACT → ಒಂದು Solid ಅನ್ನು ಮತ್ತೊಂದರಿಂದ ತೆಗೆದು Opening/Cutout ಮಾಡಲು\nINTERSECT → Common Overlapping Volume ಮಾತ್ರ ಉಳಿಸಲು\nಇದು ಪ್ರತ್ಯೇಕ Commands ಗಳನ್ನು ಮಾತ್ರವಲ್ಲದೆ, ಒಟ್ಟಾರೆ 3D Modelling Workflow ಅನ್ನು\nಅರ್ಥಮಾಡಿಕೊಂಡಿದ್ದಾರೆಯೇ ಎಂಬುದನ್ನು ಪರೀಕ್ಷಿಸುತ್ತದೆ."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 1, "q": "Consider the following statements regarding a GIS environment.\nGIS Environment ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. GIS can capture, store, manipulate, analyse, manage and present geographic data.\nGIS ಭೌಗೋಳಿಕ ದತ್ತಾಂಶವನ್ನು ಸಂಗ್ರಹಿಸಿ, ಸಂಸ್ಕರಿಸಿ, ವಿಶ್ಲೇಷಿಸಿ, ನಿರ್ವಹಿಸಿ ಮತ್ತು ಪ್ರದರ್ಶಿಸಬಹುದು.\n2. A modern enterprise GIS may involve clients, web servers and spatial databases.\nಆಧುನಿಕ Enterprise GIS ನಲ್ಲಿ Clients, Web Servers ಮತ್ತು Spatial Databases ಇರಬಹುದು.\n3. Client–server communication in web-based GIS commonly uses HTTP.\nWeb-based GIS ನಲ್ಲಿ Client–Server ಸಂವಹನಕ್ಕೆ ಸಾಮಾನ್ಯವಾಗಿ HTTP ಬಳಸಲಾಗುತ್ತದೆ.\n4. A spatial database is primarily responsible for displaying map symbols on the user's desktop\ninterface.\nSpatial Database ನ ಮುಖ್ಯ ಕಾರ್ಯವು ಬಳಕೆದಾರರ Desktop interface ನಲ್ಲಿ map symbols\nಪ್ರದರ್ಶಿಸುವುದಾಗಿದೆ.\n\nWhich of the above statements are correct?\nಮೇಲಿನ ಹೇಳಿಕೆಗಳಲ್ಲಿ ಸರಿಯಾದವು ಯಾವುವು?", "o": ["1 and 2 only", "1, 2 and 3 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "a": 1, "e": "GIS architecture generally follows Client → Server → Spatial\nDatabase. The spatial database stores and manages spatial and related attribute\ninformation; display is primarily handled at the client side."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 2, "q": "A cadastral project contains land parcels, road centre-lines and building\nlocations, all of which have clearly identifiable boundaries or discrete positions.\nWhich data model is most appropriate for representing these features?\nಒಂದು Cadastral ಯೋಜನೆಯಲ್ಲಿ Land Parcels, Road Centre-lines ಮತ್ತು Building Locations ಇದ್ದು, ಇವುಗಳಿಗೆ\nಸ್ಪಷ್ಟವಾದ ಗಡಿಗಳು ಅಥವಾ ನಿರ್ದಿಷ್ಟ ಸ್ಥಾನಗಳಿವೆ. ಇವುಗಳನ್ನು ಪ್ರತಿನಿಧಿಸಲು ಯಾವ Data Model ಅತ್ಯಂತ\nಸೂಕ್ತ?", "o": ["Raster only", "Vector", "Raster with continuous cells only", "DEM-based model"], "a": 1, "e": "Vector data represents discrete geographic features using points, lines\nand polygons. Parcels → polygons, roads → lines, buildings → points/polygons."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 3, "q": "Consider the following statements about Vector and Raster data.\nVector ಮತ್ತು Raster Data ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. Vector features are represented using discrete coordinates.\nVector Features ಗಳನ್ನು discrete coordinates ಮೂಲಕ ಪ್ರತಿನಿಧಿಸಲಾಗುತ್ತದೆ.\n\n2. Raster data is composed of cells or pixels containing values.\nRaster Data cells/pixels ಗಳಿಂದ ಕೂಡಿದ್ದು, ಪ್ರತಿಯೊಂದು cell ಒಂದು value ಹೊಂದಿರುತ್ತದೆ.\n\n3. Rainfall and temperature are generally suitable for raster representation because they are\ncontinuous phenomena.\nಮಳೆ ಮತ್ತು ತಾಪಮಾನವು Continuous Phenomena ಆಗಿರುವುದರಿಂದ Raster representation ಗೆ ಸೂಕ್ತ.\n\n4. Raster data is always superior to vector data for representing roads and cadastral parcels.\nRoads ಮತ್ತು Cadastral Parcels ಗಳನ್ನು ಪ್ರತಿನಿಧಿಸಲು Raster ಯಾವಾಗಲೂ Vector ಗಿಂತ ಉತ್ತಮ.\n\nHow many statements are correct?\nಎಷ್ಟು ಹೇಳಿಕೆಗಳು ಸರಿಯಾಗಿವೆ?", "o": ["Only 1", "Only 2", "Only 3", "All 4"], "a": 2, "e": "Statements 1, 2 and 3 are correct. Statement 4 is incorrect because\ndiscrete features with clear boundaries are generally better represented using Vector."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 4, "q": "Which of the following is correctly matched?\nಕೆಳಗಿನವುಗಳಲ್ಲಿ ಸರಿಯಾಗಿ ಹೊಂದಿಕೆಯಾಗಿರುವುದು ಯಾವುದು?", "o": ["QGIS — Proprietary-only desktop GIS", "QGIS — Open-source desktop GIS", "OSGeo — Proprietary raster format", "QGIS LTR — Least stable experimental release"], "a": 1, "e": "QGIS is an open-source, cross-platform desktop GIS supported by the\nOSGeo ecosystem. LTR versions emphasize stability and are commonly preferred for\nenterprise environments."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 5, "q": "In QGIS, an analyst wants to browse local folders, GeoPackages, spatial\ndatabases and web-based spatial resources from a common interface. Which\ncomponent is most directly designed for this purpose?\nQGIS ನಲ್ಲಿ Analyst ಒಬ್ಬರು Local Folders, GeoPackages, Spatial Databases ಮತ್ತು Web-based Spatial\nResources ಗಳನ್ನು ಒಂದೇ Interface ಮೂಲಕ Browse ಮಾಡಲು ಬಯಸುತ್ತಾರೆ. ಇದಕ್ಕಾಗಿ ಯಾವ Component\nಹೆಚ್ಚು ಸೂಕ್ತ?", "o": ["Layers Panel", "Browser Panel", "Status Bar", "Map Canvas"], "a": 1, "e": "Browser Panel provides convenient access to local file systems,\nspatial databases, GeoPackages and web services/resources."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 6, "q": "Consider the following QGIS interface statements.\nQGIS Interface ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. Layers Panel controls layer order and visibility.\nLayers Panel Layer Order ಮತ್ತು Visibility ಅನ್ನು ನಿಯಂತ್ರಿಸುತ್ತದೆ.\n2. Map Canvas is the principal area for viewing spatial data.\nMap Canvas Spatial Data ವೀಕ್ಷಿಸುವ ಮುಖ್ಯ ಪ್ರದೇಶವಾಗಿದೆ.\n\n3. Status Bar can provide coordinates, scale and CRS information.\nStatus Bar Coordinates, Scale ಮತ್ತು CRS ಮಾಹಿತಿಯನ್ನು ನೀಡಬಹುದು.\n4. Browser Panel is primarily intended for composing the final printable map layout.\nBrowser Panel ನ ಮುಖ್ಯ ಉದ್ದೇಶ Final Printable Map Layout ರಚಿಸುವುದು.\n\nHow many statements are correct?\nಎಷ್ಟು ಹೇಳಿಕೆಗಳು ಸರಿಯಾಗಿವೆ?", "o": ["1 only", "2 only", "3 only", "4"], "a": 2, "e": "Statements 1–3 are correct. Print Layout, not Browser Panel, is used\nfor publication-ready map composition."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 7, "q": "An analyst has a GeoTIFF satellite image and an ESRI Shapefile containing\nparcel boundaries. Which combination correctly identifies their typical QGIS data\nmodels?\nಒಬ್ಬ Analyst ಬಳಿ GeoTIFF Satellite Image ಮತ್ತು Parcel Boundaries ಹೊಂದಿರುವ ESRI Shapefile ಇದೆ.\nಇವುಗಳ ಸರಿಯಾದ Data Model ಸಂಯೋಜನೆ ಯಾವುದು?", "o": ["GeoTIFF—Vector; Shapefile—Raster", "GeoTIFF—Vector; Shapefile—Vector", "GeoTIFF—Raster; Shapefile—Vector", "GeoTIFF—Raster; Shapefile—Raster"], "a": 2, "e": "GeoTIFF imagery is normally raster data, while an ESRI Shapefile may\ncontain vector point, line or polygon features."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 8, "q": "An attribute table associated with a parcel layer contains 500 records and 12\nattribute fields. Assuming each record represents one geographic feature, which\ninterpretation is correct?\nಒಂದು Parcel Layer ನ Attribute Table ನಲ್ಲಿ 500 Records ಮತ್ತು 12 Attribute Fields ಇವೆ. ಪ್ರತಿಯೊಂದು\nRecord ಒಂದು Geographic Feature ಅನ್ನು ಪ್ರತಿನಿಧಿಸುತ್ತದೆ ಎಂದು ಪರಿಗಣಿಸಿದರೆ, ಸರಿಯಾದ ವಿವರಣೆ\nಯಾವುದು?", "o": ["12 features and 500 fields", "500 features and 12 fields", "500 features and 500 fields", "12 features and 12 fields"], "a": 1, "e": "In a typical GIS attribute table, rows represent individual features and\ncolumns represent attributes/fields."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 9, "q": "A cadastral layer contains Parcel ID, Owner Name, Land-use Type and Area.\nThe analyst wants to create a new derived attribute and also update an existing\nattribute using mathematical or spatial expressions. Which QGIS tool is most\nappropriate?\nಒಂದು Cadastral Layer ನಲ್ಲಿ Parcel ID, Owner Name, Land-use Type ಮತ್ತು Area ಇವೆ. Analyst ಹೊಸ\nDerived Attribute ರಚಿಸುವುದರ ಜೊತೆಗೆ Mathematical ಅಥವಾ Spatial Expressions ಬಳಸಿ Existing Attribute\nಅನ್ನು Update ಮಾಡಲು ಬಯಸುತ್ತಾರೆ. ಯಾವ QGIS Tool ಸೂಕ್ತ?", "o": ["Browser Panel", "Field Calculator", "Map Canvas", "Scale Bar"], "a": 1, "e": "Field Calculator can create new fields and update existing fields using\nexpressions. For example, $area can be used to calculate polygon area."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 10, "q": "An analyst needs to calculate the area of every polygon parcel and store the\ncalculated value as an attribute. Which approach is most appropriate in QGIS?\nಪ್ರತಿ Polygon Parcel ನ Area ಅನ್ನು ಲೆಕ್ಕಹಾಕಿ ಅದನ್ನು Attribute ಆಗಿ ಸಂಗ್ರಹಿಸಲು QGIS ನಲ್ಲಿ ಯಾವ ವಿಧಾನ\nಸೂಕ್ತ?", "o": ["Use $area through Field Calculator", "Use $length through Print Layout", "Use concat() through Browser Panel only", "Use ST_Buffer() through Layers Panel"], "a": 0, "e": "$area is a QGIS expression for polygon area calculation and can be\nused through Field Calculator to populate an attribute field."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 11, "q": "Consider the following statements about table joins in GIS.\nGIS ನಲ್ಲಿ Table Join ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. A join can combine information using a shared key field.\nShared Key Field ಬಳಸಿ Join ಮೂಲಕ ಮಾಹಿತಿಯನ್ನು ಸಂಯೋಜಿಸಬಹುದು.\n2. The common key should identify corresponding records between the tables.\nCommon Key ಎರಡೂ Tables ನ ಸಂಬಂಧಿತ Records ಗಳನ್ನು ಗುರುತಿಸಬೇಕು.\n3. Both tables must have exactly the same number of fields and identical structures.\nಎರಡೂ Tables ಒಂದೇ ಸಂಖ್ಯೆಯ Fields ಮತ್ತು ಸಂಪೂರ್ಣವಾಗಿ ಒಂದೇ Structure ಹೊಂದಿರಬೇಕು.\n4. An ID field can act as a shared key when its values correctly correspond.\nValues ಸರಿಯಾಗಿ Correspond ಆಗಿದ್ದರೆ ID Field Shared Key ಆಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸಬಹುದು.\n\nWhich statements are correct?\nಯಾವ ಹೇಳಿಕೆಗಳು ಸರಿಯಾಗಿವೆ?", "o": ["1 and 3 only", "1, 2 and 4 only", "2 and 3 only", "1, 2, 3 and 4"], "a": 1, "e": "A table join depends on a common key, not identical table structures.\nMatching identifiers allow attributes from another table to be associated with GIS\nfeatures."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 12, "q": "A municipality has a flood-zone polygon and a building layer. The analyst\nwants to identify buildings based on their spatial relationship with the flood-zone\npolygons, without filtering by attribute values. Which operation should be used?\nಒಂದು Municipality ಬಳಿ Flood-zone Polygon ಮತ್ತು Building Layer ಇವೆ. Attribute Values ಆಧಾರವಲ್ಲದೆ\nFlood-zone ಗಳೊಂದಿಗೆ ಇರುವ Spatial Relationship ಆಧಾರದ ಮೇಲೆ Buildings ಆಯ್ಕೆ ಮಾಡಲು ಯಾವ\nOperation ಬಳಸಬೇಕು?", "o": ["Select by Attribute", "Select by Location", "Field Calculator", "Categorized Symbology"], "a": 1, "e": "Select by Location selects features based on spatial/topological\nrelationships such as intersects, within, overlaps or adjacency. Select by Attribute works\non attribute values."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 13, "q": "Suppose the requirement is specifically to select buildings that lie\ncompletely inside a flood-zone polygon. Which GIS operation most directly\nrepresents this requirement?\nFlood-zone Polygon ಒಳಗೆ ಸಂಪೂರ್ಣವಾಗಿ ಇರುವ Buildings ಗಳನ್ನು ಮಾತ್ರ ಆಯ್ಕೆ ಮಾಡಬೇಕಾದರೆ, ಯಾವ\nGIS Operation ಈ ಅಗತ್ಯವನ್ನು ನೇರವಾಗಿ ಪ್ರತಿನಿಧಿಸುತ್ತದೆ?", "o": ["Select by Attribute", "Select by Location", "Table Join", "Graduated Symbology"], "a": 1, "e": "“Completely inside” is a spatial relationship. Therefore, the selection is\nbased on location/topology rather than attribute values."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 14, "q": "Consider the following statements regarding digitizing and editing.\nDigitizing ಮತ್ತು Editing ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. Digitizing converts maps or raw coordinate information into structured GIS vector features.\nDigitizing Maps ಅಥವಾ Raw Coordinates ಅನ್ನು Structured GIS Vector Features ಆಗಿ\nಪರಿವರ್ತಿಸುತ್ತದೆ.\n2. Editing may involve adding, deleting, moving, splitting or reshaping features.\nEditing ನಲ್ಲಿ Features ಅನ್ನು Add, Delete, Move, Split ಅಥವಾ Reshape ಮಾಡಬಹುದು.\n3. Snapping helps connect vertices or segments accurately to existing geometries.\nSnapping Vertices ಅಥವಾ Segments ಗಳನ್ನು Existing Geometries ಗೆ ನಿಖರವಾಗಿ ಸಂಪರ್ಕಿಸಲು\nಸಹಾಯ ಮಾಡುತ್ತದೆ.\n4. The principal purpose of snapping is to change the colour of adjacent features.\nSnapping ನ ಮುಖ್ಯ ಉದ್ದೇಶ ಪಕ್ಕದ Features ಗಳ ಬಣ್ಣವನ್ನು ಬದಲಿಸುವುದು.\n\nHow many statements are correct?\nಎಷ್ಟು ಹೇಳಿಕೆಗಳು ಸರಿಯಾಗಿವೆ?", "o": ["1", "2", "3", "4"], "a": 2, "e": "Snapping is a geometric editing aid. It improves spatial accuracy and\nhelps prevent unwanted gaps and overlaps."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 15, "q": "While digitizing adjacent cadastral parcels, an operator wants the common\nboundaries to meet precisely and avoid tiny gaps caused by inaccurate vertex\nplacement. Which tool/function is most relevant?\nಪಕ್ಕಪಕ್ಕದ Cadastral Parcels ಅನ್ನು Digitize ಮಾಡುವಾಗ Common Boundaries ನಿಖರವಾಗಿ ಸೇರಬೇಕು ಮತ್ತು\nತಪ್ಪಾದ Vertex Placement ನಿಂದ ಉಂಟಾಗುವ ಸಣ್ಣ Gaps ತಪ್ಪಿಸಬೇಕು. ಯಾವ Tool/Function ಹೆಚ್ಚು ಸೂಕ್ತ?", "o": ["Snapping", "Graduated Symbology", "Print Layout", "Table Join"], "a": 0, "e": "Snapping automatically aligns vertices or segments with existing\ngeometries and is fundamental for maintaining clean topology during digitizing."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 16, "q": "A land-use layer contains qualitative classes such as Residential, Industrial\nand Parks, while a population layer contains numerical population values. Which\nsymbology combination is most appropriate?\nLand-use Layer ನಲ್ಲಿ Residential, Industrial ಮತ್ತು Parks ಎಂಬ Qualitative Classes ಇದ್ದರೆ, Population Layer\nನಲ್ಲಿ Numerical Values ಇವೆ. ಯಾವ Symbology ಸಂಯೋಜನೆ ಸೂಕ್ತ?", "o": ["Categorized for land use; Graduated for population", "Graduated for land use; Categorized for population", "Equal Interval for land use; Single Symbol for population", "Quantile for land use; Single Symbol for population"], "a": 0, "e": "Categorized symbology is suited to qualitative categories, whereas\nGraduated symbology represents quantitative numerical variation."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 17, "q": "Consider the following classification statements.\nMap Classification ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. Equal Interval divides the attribute range into equal-sized intervals.\nEqual Interval Attribute Range ಅನ್ನು ಸಮಾನ ಗಾತ್ರದ Intervals ಆಗಿ ವಿಭಜಿಸುತ್ತದೆ.\n2. Quantile attempts to place an equal number of features in each class.\nQuantile ಪ್ರತಿ Class ನಲ್ಲಿ ಸಮಾನ ಸಂಖ್ಯೆಯ Features ಇರಲು ಪ್ರಯತ್ನಿಸುತ್ತದೆ.\n3. Jenks Natural Breaks seeks to minimize variation within classes and maximize variation between\nclasses.\nJenks Natural Breaks Class ಒಳಗಿನ Variation ಅನ್ನು ಕಡಿಮೆ ಮಾಡಿ, Classes ನಡುವಿನ Variation\nಅನ್ನು ಹೆಚ್ಚಿಸಲು ಪ್ರಯತ್ನಿಸುತ್ತದೆ.\n\n4. Quantile and Equal Interval must always produce identical class boundaries.\nQuantile ಮತ್ತು Equal Interval ಯಾವಾಗಲೂ ಒಂದೇ Class Boundaries ನೀಡುತ್ತವೆ.\n\nWhich statements are correct?\nಯಾವ ಹೇಳಿಕೆಗಳು ಸರಿಯಾಗಿವೆ?", "o": ["1 and 2 only", "1, 2 and 3 only", "2, 3 and 4 only", "All 4"], "a": 1, "e": "Equal Interval is based on equal numerical ranges; Quantile is based\non equal feature counts; Jenks identifies natural groupings. Quantile and Equal Interval\ncan produce very different boundaries."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 18, "q": "An analyst has completed a GIS project and needs a publication-ready map\ncontaining the map view, legend, scale bar and coordinate grid for PDF output.\nWhich QGIS component is most appropriate?\nಒಬ್ಬ Analyst GIS Project ಪೂರ್ಣಗೊಳಿಸಿದ್ದು, Map View, Legend, Scale Bar ಮತ್ತು Coordinate Grid\nಹೊಂದಿರುವ Publication-ready PDF Map ರಚಿಸಬೇಕಾಗಿದೆ. ಯಾವ QGIS Component ಸೂಕ್ತ?", "o": ["Browser Panel", "Print Layout", "Attribute Table", "Field Calculator"], "a": 1, "e": "Print Layout is designed for cartographic composition and\npublication-ready outputs such as printed maps and PDFs."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 19, "q": "Consider the following statements about On-the-Fly (OTF) projection.\nOn-the-Fly (OTF) Projection ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. OTF can dynamically reproject layers for display in the project CRS.\nOTF Layers ಅನ್ನು Project CRS ಗೆ Display ಸಮಯದಲ್ಲಿ Dynamically Reproject ಮಾಡಬಹುದು.\n2. It allows layers having different native CRS to be displayed together.\nವಿಭಿನ್ನ Native CRS ಹೊಂದಿರುವ Layers ಗಳನ್ನು ಒಂದೇ Map ನಲ್ಲಿ ಪ್ರದರ್ಶಿಸಲು ಇದು ಸಹಾಯ\nಮಾಡುತ್ತದೆ.\n3. OTF permanently changes the original source dataset's coordinate system.\nOTF Original Source Dataset ನ Coordinate System ಅನ್ನು ಶಾಶ್ವತವಾಗಿ ಬದಲಿಸುತ್ತದೆ.\n\n4. For precise spatial analysis, an appropriate common/projected CRS is generally preferable.\nನಿಖರ Spatial Analysis ಗಾಗಿ ಸೂಕ್ತವಾದ Common/Projected CRS ಸಾಮಾನ್ಯವಾಗಿ ಉತ್ತಮ.\n\nWhich statements are correct?\nಯಾವ ಹೇಳಿಕೆಗಳು ಸರಿಯಾಗಿವೆ?", "o": ["1 and 3 only", "1, 2 and 4 only", "2 and 3 only", "All 4"], "a": 1, "e": "OTF changes the representation for display; it normally does not\npermanently transform the source data. For accurate distance and area analysis, an\nappropriate projected CRS is often preferred."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 20, "q": "Which of the following correctly distinguishes a Geographic Coordinate\nSystem (GCS) from a Projected Coordinate System (PCS)?\nGeographic Coordinate System (GCS) ಮತ್ತು Projected Coordinate System (PCS) ಗಳ ನಡುವಿನ ಸರಿಯಾದ\nವ್ಯತ್ಯಾಸ ಯಾವುದು?", "o": ["GCS uses latitude/longitude, while PCS represents locations on a projected 2D coordinate grid", "GCS always uses metres, while PCS always uses degrees", "GCS is only for raster data, while PCS is only for vector data", "GCS eliminates all distortion, while PCS introduces all distortion"], "a": 0, "e": "GCS commonly expresses positions using latitude and longitude in\nangular units. PCS projects the curved Earth onto a planar coordinate system, often\nusing metres or feet."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 21, "q": "Consider the following statements regarding UTM.\nUTM ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. UTM divides the Earth into 60 longitudinal zones.\nUTM ಭೂಮಿಯನ್ನು 60 Longitudinal Zones ಗಳಾಗಿ ವಿಭಜಿಸುತ್ತದೆ.\n2. Each UTM zone spans 6° of longitude.\nಪ್ರತಿಯೊಂದು UTM Zone 6° Longitude ವ್ಯಾಪ್ತಿಯನ್ನು ಹೊಂದಿರುತ್ತದೆ.\n3. UTM is useful for accurate local and regional mapping.\nUTM ನಿಖರ Local ಮತ್ತು Regional Mapping ಗೆ ಉಪಯುಕ್ತ.\n\n4. Each UTM zone spans 60° of longitude.\nಪ್ರತಿಯೊಂದು UTM Zone 60° Longitude ವ್ಯಾಪ್ತಿಯನ್ನು ಹೊಂದಿದೆ.\n\nHow many statements are correct?\nಎಷ್ಟು ಹೇಳಿಕೆಗಳು ಸರಿಯಾಗಿವೆ?", "o": ["1", "2", "3", "4"], "a": 2, "e": "UTM has 60 zones, each 6° wide. The fourth statement reverses the\ncorrect value and is therefore false."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 22, "q": "Survey observations are supplied mainly as distances, bearings, angles and\ncoordinates, and the objective is precise parcel/engineering mapping. Which GIS\ncapability is particularly relevant?\nSurvey Observations ಮುಖ್ಯವಾಗಿ Distances, Bearings, Angles ಮತ್ತು Coordinates ರೂಪದಲ್ಲಿದ್ದು, ನಿಖರ\nParcel/Engineering Mapping ಮಾಡಬೇಕಾಗಿದೆ. ಯಾವ GIS Capability ವಿಶೇಷವಾಗಿ ಸೂಕ್ತ?", "o": ["COGO", "WMS", "Quantile Classification", "Print Layout"], "a": 0, "e": "COGO (Coordinate Geometry) tools are designed for precise\nsurvey-based geometric construction using angles, distances, bearings and\ncoordinates."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 23, "q": "Consider the following statements about cadastral topology.\nCadastral Topology ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. “Must Not Overlap” helps ensure that distinct parcels do not occupy the same area.\n“Must Not Overlap” ಪ್ರತ್ಯೇಕ Parcels ಒಂದೇ ಪ್ರದೇಶವನ್ನು ಆಕ್ರಮಿಸದಂತೆ ನೋಡಿಕೊಳ್ಳುತ್ತದೆ.\n2. “Must Not Have Gaps” helps prevent unwanted gaps between parcel polygons.\n“Must Not Have Gaps” Parcel Polygons ಗಳ ನಡುವೆ ಅನಗತ್ಯ Gaps ತಡೆಯುತ್ತದೆ.\n3. “Must Be Covered By” can enforce a complete spatial relationship with a parent/related feature.\n“Must Be Covered By” Parent/Related Feature ನೊಂದಿಗೆ ಸಂಪೂರ್ಣ Spatial Relationship ಅನ್ನು\nಖಚಿತಪಡಿಸಬಹುದು.\n\n4. Topology Checker is primarily used to increase satellite image resolution.\nTopology Checker ನ ಮುಖ್ಯ ಉದ್ದೇಶ Satellite Image Resolution ಹೆಚ್ಚಿಸುವುದು.\n\nWhich statements are correct?\nಯಾವ ಹೇಳಿಕೆಗಳು ಸರಿಯಾಗಿವೆ?", "o": ["1 and 2 only", "1, 2 and 3 only", "2, 3 and 4 only", "All 4"], "a": 1, "e": "Cadastral topology maintains spatial integrity among parcels. Topology\nChecker identifies violations such as overlaps, gaps and other spatial inconsistencies."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 24, "q": "A web GIS client needs a rendered geographic map image, typically in\nformats such as PNG or JPEG, primarily for visual display rather than direct\naccess to editable raw vector features. Which OGC service is most appropriate?\nWeb GIS Client ಗೆ ಮುಖ್ಯವಾಗಿ Visual Display ಗಾಗಿ PNG/JPEG ರೀತಿಯ Rendered Geographic Map Image\nಬೇಕಾಗಿದೆ; Editable Raw Vector Features ಅಗತ್ಯವಿಲ್ಲ. ಯಾವ OGC Service ಸೂಕ್ತ?", "o": ["WFS", "WCS", "WMS", "COGO"], "a": 2, "e": "WMS (Web Map Service) delivers rendered map images. It is\nfundamentally different from WFS, which provides vector features and attributes."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 25, "q": "A web application requires actual vector geometries and their attributes and\nalso needs transactional web-based editing. Which combination is most\nappropriate?\nಒಂದು Web Application ಗೆ Actual Vector Geometries ಮತ್ತು Attributes ಬೇಕಾಗಿದ್ದು, Web-based Transactional\nEditing ಕೂಡ ಅಗತ್ಯವಿದೆ. ಯಾವ ಸಂಯೋಜನೆ ಸೂಕ್ತ?", "o": ["WMS only", "WFS with WFS-T where transactional editing is required", "WCS only", "SLD only"], "a": 1, "e": "WFS provides vector feature access with geometry and attributes.\nWFS-T extends WFS for transactional operations such as web-based editing."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 26, "q": "A server must provide raw raster coverage values representing elevation or\ntemperature rather than merely a rendered map picture. Which OGC service is\nmost appropriate?\nಒಂದು Server ಗೆ Rendered Map Picture ಬದಲು Elevation ಅಥವಾ Temperature ಅನ್ನು ಪ್ರತಿನಿಧಿಸುವ Raw\nRaster Coverage Values ಒದಗಿಸಬೇಕಾಗಿದೆ. ಯಾವ OGC Service ಸೂಕ್ತ?", "o": ["WMS", "WFS", "WCS", "COGO"], "a": 2, "e": "WCS (Web Coverage Service) is intended for coverage/raster data\nsuch as elevation, temperature and other continuous grid datasets."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 27, "q": "Consider the following statements regarding GeoServer and MapServer.\nGeoServer ಮತ್ತು MapServer ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. GeoServer is a Java-based open-source geospatial server.\nGeoServer Java-based Open-source Geospatial Server ಆಗಿದೆ.\n2. MapServer is an open-source server used for web-based spatial data/map publishing.\nMapServer Web-based Spatial Data/Map Publishing ಗಾಗಿ ಬಳಸುವ Open-source Server ಆಗಿದೆ.\n3. MapServer is known for being lightweight and efficient and uses Mapfiles for configuration.\nMapServer Lightweight ಮತ್ತು Efficient ಆಗಿದ್ದು Configuration ಗಾಗಿ Mapfiles ಬಳಸುತ್ತದೆ.\n4. Both GeoServer and MapServer are primarily desktop GIS applications for editing spatial layers.\nGeoServer ಮತ್ತು MapServer ಎರಡೂ ಮುಖ್ಯವಾಗಿ Spatial Layers Edit ಮಾಡಲು ಬಳಸುವ Desktop\nGIS Applications ಆಗಿವೆ.\n\nWhich statements are correct?\nಯಾವ ಹೇಳಿಕೆಗಳು ಸರಿಯಾಗಿವೆ?", "o": ["1 and 2 only", "1, 2 and 3 only", "2, 3 and 4 only", "All 4"], "a": 1, "e": "GeoServer and MapServer are server-side technologies for publishing\ngeospatial information. They are not primarily desktop editing applications like QGIS."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 28, "q": "Which of the following correctly describes PostGIS?\nPostGIS ಅನ್ನು ಸರಿಯಾಗಿ ವಿವರಿಸುವುದು ಯಾವುದು?", "o": ["A standalone raster image format", "A spatial extension of PostgreSQL that enables storage, querying and analysis of geographic data", "A desktop-only cartographic printing application", "An OGC web map image protocol"], "a": 1, "e": "PostGIS extends PostgreSQL with spatial data types, functions,\nindexing and spatial operations, effectively turning PostgreSQL into a spatial database\nplatform."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 29, "q": "Consider the following statements regarding PostGIS spatial concepts.\nPostGIS Spatial Concepts ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. Geometry generally treats coordinates on a flat Cartesian plane.\nGeometry ಸಾಮಾನ್ಯವಾಗಿ Coordinates ಅನ್ನು Flat Cartesian Plane ಮೇಲೆ ಪರಿಗಣಿಸುತ್ತದೆ.\n2. Geography models coordinates on the curved Earth and supports geodesic calculations.\nGeography Curved Earth ಮೇಲೆ Coordinates ಅನ್ನು ಪರಿಗಣಿಸಿ Geodesic Calculations ಗೆ\nಅನುಕೂಲವಾಗುತ್ತದೆ.\n3. PostGIS commonly uses GiST-based spatial indexing associated with R-tree-style structures.\nPostGIS ನಲ್ಲಿ GiST-based Spatial Indexing ಅನ್ನು R-tree-style Structures ನೊಂದಿಗೆ ಬಳಸಲಾಗುತ್ತದೆ.\n4. MBR stands for Minimum Bounding Rectangle/Box.\nMBR ಎಂದರೆ Minimum Bounding Rectangle/Box.\n5. A normal B-Tree is specifically designed primarily for multidimensional spatial geometry searches.\nNormal B-Tree ಮುಖ್ಯವಾಗಿ Multidimensional Spatial Geometry Searches ಗಾಗಿ\nವಿನ್ಯಾಸಗೊಳಿಸಲಾಗಿದೆ.\n\nWhich statements are correct?\nಯಾವ ಹೇಳಿಕೆಗಳು ಸರಿಯಾಗಿವೆ?", "o": ["1, 2 and 3 only", "1, 2, 3 and 4 only", "2, 4 and 5 only", "All 5"], "a": 1, "e": "Geometry is suited to planar Cartesian calculations, while Geography\naccounts for Earth's curved surface. PostGIS spatial indexing commonly uses GiST\nmechanisms supporting R-tree-style spatial searching with bounding boxes. Normal\nB-Trees are not specialized multidimensional spatial indexes."}, {"t": "GIS Software, GeoServer & PostGIS", "n": 30, "q": "A GIS department is building a cadastral workflow in which parcel polygons are digitized, common\nboundaries are maintained using snapping, attributes are managed through an attribute table, parcel area is\ncalculated, land-use classes are symbolized, a suitable projected CRS is used for local measurement,\ntopology is checked and the final map is exported for publication. Which conclusion best describes this\nworkflow?\nಒಂದು GIS Department ನಲ್ಲಿ Parcel Polygons ಅನ್ನು Digitize ಮಾಡಿ, Common Boundaries ಅನ್ನು Snapping\nಮೂಲಕ ನಿರ್ವಹಿಸಿ, Attribute Table ಮೂಲಕ Attributes ನಿರ್ವಹಿಸಿ, Parcel Area ಲೆಕ್ಕಹಾಕಿ, Land-use Classes\nಗೆ Symbology ನೀಡಿ, Local Measurement ಗಾಗಿ ಸೂಕ್ತ Projected CRS ಬಳಸಿ, Topology Check ಮಾಡಿ,\nಕೊನೆಯಲ್ಲಿ Publication ಗಾಗಿ Map Export ಮಾಡಲಾಗುತ್ತದೆ. ಈ Workflow ಅನ್ನು ಅತ್ಯುತ್ತಮವಾಗಿ ವಿವರಿಸುವುದು\nಯಾವುದು?", "o": ["It relies mainly on raster image classification and WMS rendering", "It integrates vector editing, attribute management, spatial integrity, CRS management, symbology and cartographic output", "It can be completed entirely through a spatial database without any GIS editing or visualization tools", "It requires only COGO and does not require topology or attribute management"], "a": 1, "e": "A cadastral GIS workflow integrates multiple GIS capabilities: vector\ndigitizing, snapping, attribute management, Field Calculator, appropriate CRS, topology\nvalidation, symbology and Print Layout/cartographic output."}, {"t": "SDLC, Land Records IT & APIs", "n": 1, "q": "Consider the following statements.\nಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. SDLC provides a systematic framework for planning, developing, testing, deploying and maintaining\nsoftware.\nSDLC ಸಾಫ್ಟ್ವೇರ್ ಅನ್ನು ಯೋಜಿಸಲು, ಅಭಿವೃದ್ಧಿಪಡಿಸಲು, ಪರೀಕ್ಷಿಸಲು, ಅಳವಡಿಸಲು ಮತ್ತು\nನಿರ್ವಹಿಸಲು ಕ್ರಮಬದ್ಧ ಚೌಕಟ್ಟನ್ನು ಒದಗಿಸುತ್ತದೆ.\n2. A reliable land-record system should consider accuracy, security, legal compliance and usability.\nವಿಶ್ವಾಸಾರ್ಹ ಭೂ ದಾಖಲೆ ವ್ಯವಸ್ಥೆಯು ನಿಖರತೆ, ಭದ್ರತೆ, ಕಾನೂನುಬದ್ಧ ಅನುಸರಣೆ ಮತ್ತು ಬಳಕೆದಾರ\nಸ್ನೇಹಿತ್ವವನ್ನು ಪರಿಗಣಿಸಬೇಕು.\n3. Deployment marks the permanent end of the software life cycle.\nDeployment ಸಾಫ್ಟ್ವೇರ್ ಜೀವನಚಕ್ರದ ಶಾಶ್ವತ ಅಂತ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ.\n4. Maintenance may include adapting the system to new laws and rules.\nMaintenance ನಲ್ಲಿ ಹೊಸ ಕಾನೂನುಗಳು ಮತ್ತು ನಿಯಮಗಳಿಗೆ ಅನುಗುಣವಾಗಿ ವ್ಯವಸ್ಥೆಯನ್ನು\nಬದಲಾಯಿಸುವುದು ಸೇರಬಹುದು.\n\nWhich of the above statements are correct?\nಮೇಲಿನ ಹೇಳಿಕೆಗಳಲ್ಲಿ ಸರಿಯಾದವು ಯಾವುವು?", "o": ["1 and 2 only", "1, 2 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "a": 1, "e": "SDLC deployment ನಂತರವೂ Operations & Maintenance ಮೂಲಕ ಮುಂದುವರಿಯುತ್ತದೆ.\nLR-IT ವ್ಯವಸ್ಥೆಯಲ್ಲಿ accuracy, security, legal compliance, usability, scalability ಮತ್ತು maintainability\nಪ್ರಮುಖವಾಗಿವೆ."}, {"t": "SDLC, Land Records IT & APIs", "n": 2, "q": "Revenue officials, landowners and citizens are consulted to determine\nmutation procedures, ownership requirements, subdivision rules and\ndigital-document requirements. What is the most appropriate immediate outcome\nof this activity?\nMutation Procedures, Ownership Requirements, Subdivision Rules ಮತ್ತು Digital-document Requirements\nತಿಳಿಯಲು Revenue Officials, Landowners ಮತ್ತು Citizens ಜೊತೆ ಚರ್ಚಿಸಲಾಗುತ್ತದೆ. ಈ ಚಟುವಟಿಕೆಯ ಸೂಕ್ತ\nಫಲಿತಾಂಶ ಯಾವುದು?", "o": ["Production database", "Software Requirements Specification (SRS)", "Source code", "Deployment package"], "a": 1, "e": "ಬಳಕೆದಾರರು ಮತ್ತು Stakeholders ಗಳಿಂದ ಅಗತ್ಯಗಳನ್ನು ಸಂಗ್ರಹಿಸಿ ವಿಶ್ಲೇಷಿಸಿದ ನಂತರ\nಪ್ರಮುಖ ದಾಖಲೆಯಾಗಿ SRS ಸಿದ್ಧಪಡಿಸಲಾಗುತ್ತದೆ."}, {"t": "SDLC, Land Records IT & APIs", "n": 3, "q": "A requirement states that “only authorized revenue officers may approve a\nmutation.” During which activity would this requirement most appropriately be\nconverted into a technical access-control design?\n“Authorized Revenue Officers ಮಾತ್ರ Mutation ಅನ್ನು Approve ಮಾಡಬೇಕು” ಎಂಬ Requirement ಇದೆ. ಇದನ್ನು\nTechnical Access-control Design ಆಗಿ ಪರಿವರ್ತಿಸುವುದು ಯಾವ ಹಂತದಲ್ಲಿ ಹೆಚ್ಚು ಸೂಕ್ತ?", "o": ["Requirement Gathering", "System Design", "Testing", "Deployment"], "a": 1, "e": "Requirement Gathering ನಲ್ಲಿ “ಏನು ಬೇಕು?” ಎಂದು ನಿರ್ಧರಿಸಲಾಗುತ್ತದೆ. System Design\nನಲ್ಲಿ ಅದನ್ನು Architecture, Database Design, Security Design ಮತ್ತು Access Control ಮುಂತಾದ ತಾಂತ್ರಿಕ\nರೂಪಕ್ಕೆ ಪರಿವರ್ತಿಸಲಾಗುತ್ತದೆ."}, {"t": "SDLC, Land Records IT & APIs", "n": 4, "q": "Consider the following pairs.\nಕೆಳಗಿನ ಜೋಡಿಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. ERD — Relationships among entities/tables\nERD — Entities/Tables ನಡುವಿನ ಸಂಬಂಧಗಳು\n\n2. UML — Unified Modeling Language\nUML — Unified Modeling Language\n\n3. Field validation — Primarily a database backup strategy\nField Validation — ಮುಖ್ಯವಾಗಿ Database Backup Strategy\n\n4. Security and access control — System design concern\nSecurity and Access Control — System Design Concern\n\nWhich pairs are correctly matched?\nಯಾವ ಜೋಡಿಗಳು ಸರಿಯಾಗಿ ಹೊಂದಿಕೆಯಾಗಿವೆ?", "o": ["1 and 2 only", "1, 2 and 4 only", "2 and 3 only", "1, 2, 3 and 4"], "a": 1, "e": "ERD Database Entities/Tables ನಡುವಿನ Relationships ಅನ್ನು ತೋರಿಸುತ್ತದೆ. UML\nmodeling language ಆಗಿದೆ. Security and Access Control ಕೂಡ System Design ನ ಪ್ರಮುಖ ಭಾಗಗಳಾಗಿವೆ."}, {"t": "SDLC, Land Records IT & APIs", "n": 5, "q": "A developer has received an approved technical design and begins\nimplementing mutation rules, APIs and database connectivity using Java and\nSpring Boot. Which conclusion is most appropriate?\nDeveloper ಒಬ್ಬರು Approved Technical Design ಆಧರಿಸಿ Java ಮತ್ತು Spring Boot ಬಳಸಿ Mutation Rules, APIs\nಮತ್ತು Database Connectivity ಅನ್ನು Implement ಮಾಡಲು ಪ್ರಾರಂಭಿಸುತ್ತಾರೆ. ಸೂಕ್ತ ನಿರ್ಣಯ ಯಾವುದು?", "o": ["The system is still only in requirement discovery", "The system has entered implementation and development", "The system has entered production maintenance", "The system is undergoing UAT only"], "a": 1, "e": "Approved Design ಅನ್ನು Actual Program Code ಆಗಿ ಪರಿವರ್ತಿಸುವುದು Implementation &\nDevelopment ಹಂತದ ಮುಖ್ಯ ಕಾರ್ಯವಾಗಿದೆ."}, {"t": "SDLC, Land Records IT & APIs", "n": 6, "q": "A mutation component works correctly in isolation, but fails when it\nexchanges data with the ownership component. Which testing activity is most\ndirectly relevant?\nMutation Component ಪ್ರತ್ಯೇಕವಾಗಿ ಸರಿಯಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸುತ್ತದೆ. ಆದರೆ Ownership Component ಜೊತೆ\nData Exchange ಮಾಡುವಾಗ ವಿಫಲವಾಗುತ್ತದೆ. ಯಾವ Testing Activity ಹೆಚ್ಚು ನೇರವಾಗಿ ಸಂಬಂಧಿಸಿದೆ?", "o": ["Unit Testing", "Integration Testing", "System Testing", "UAT"], "a": 1, "e": "Unit Testing ಪ್ರತ್ಯೇಕ Component ಅನ್ನು ಪರೀಕ್ಷಿಸುತ್ತದೆ. ಎರಡು ಅಥವಾ ಹೆಚ್ಚು\nComponents ಪರಸ್ಪರ ಸರಿಯಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸುತ್ತವೆಯೇ ಎಂಬುದನ್ನು Integration Testing ಪರಿಶೀಲಿಸುತ್ತದೆ."}, {"t": "SDLC, Land Records IT & APIs", "n": 7, "q": "Consider the following statements regarding testing.\nTesting ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. Unit testing focuses on individual components.\nUnit Testing ಪ್ರತ್ಯೇಕ Components ಮೇಲೆ ಕೇಂದ್ರೀಕರಿಸುತ್ತದೆ.\n\n2. System testing evaluates the complete software system.\nSystem Testing ಸಂಪೂರ್ಣ Software System ಅನ್ನು ಮೌಲ್ಯಮಾಪನ ಮಾಡುತ್ತದೆ.\n3. UAT primarily determines whether the software satisfies actual user needs.\nUAT ಮುಖ್ಯವಾಗಿ Software ನೈಜ ಬಳಕೆದಾರರ ಅಗತ್ಯಗಳನ್ನು ಪೂರೈಸುತ್ತದೆಯೇ ಎಂದು\nಪರಿಶೀಲಿಸುತ್ತದೆ.\n4. Integration testing is performed only after software has permanently entered production.\nIntegration Testing Software Production ಗೆ Permanently ಸೇರಿದ ನಂತರ ಮಾತ್ರ ನಡೆಯುತ್ತದೆ.\n\nWhich statements are correct?", "o": ["1 and 2 only", "1, 2 and 3 only", "2, 3 and 4 only", "All 4"], "a": 1, "e": "Integration Testing Production ನಂತರ ಮಾತ್ರ ನಡೆಯುವುದಿಲ್ಲ. ಇದು Components\nನಡುವಿನ Integration ಅನ್ನು ಪರಿಶೀಲಿಸುವ Testing ಹಂತವಾಗಿದೆ."}, {"t": "SDLC, Land Records IT & APIs", "n": 8, "q": "A tested application is moved from a development environment to an\nintermediate environment where final checks are performed before actual users\nreceive it. What is the role of this intermediate environment?\nTest ಮಾಡಲಾದ Application ಅನ್ನು Development Environment ನಿಂದ Intermediate Environment ಗೆ\nಸ್ಥಳಾಂತರಿಸಿ, Actual Users ಗೆ ನೀಡುವ ಮೊದಲು Final Checks ಮಾಡಲಾಗುತ್ತದೆ. ಈ Intermediate Environment\nನ ಪಾತ್ರವೇನು?", "o": ["It is the production database", "It is the staging environment", "It is the source-code repository", "It is the backup environment only"], "a": 1, "e": "ಸಾಮಾನ್ಯ Deployment Flow: Development → Staging → Production.\nStaging ನಲ್ಲಿ Production Release ಗೆ ಮುನ್ನ ಅಂತಿಮ ಪರೀಕ್ಷೆಗಳನ್ನು ನಡೆಸಬಹುದು."}, {"t": "SDLC, Land Records IT & APIs", "n": 9, "q": "After deployment, the system requires security patches, database\noptimization, bug fixing, backup/recovery and modification due to a change in\nland law. Which statement is most accurate?\nDeployment ನಂತರ Security Patches, Database Optimization, Bug Fixing, Backup/Recovery ಮತ್ತು ಹೊಸ\nLand Law ಗೆ ಅನುಗುಣವಾದ ಬದಲಾವಣೆ ಅಗತ್ಯವಾಗಿದೆ. ಅತ್ಯಂತ ಸರಿಯಾದ ಹೇಳಿಕೆ ಯಾವುದು?", "o": ["These activities belong only to Requirement Gathering", "These activities demonstrate that SDLC continues through Operations & Maintenance", "These activities indicate that testing was never required", "These activities belong exclusively to System Design"], "a": 1, "e": "Deployment ನಂತರವೂ Software Maintenance ಮುಂದುವರಿಯುತ್ತದೆ. Bug Fixing,\nSecurity Updates, Performance Improvement, Database Optimization, Backup/Recovery ಮತ್ತು Legal\nChanges ಇದರಲ್ಲಿ ಸೇರಿವೆ."}, {"t": "SDLC, Land Records IT & APIs", "n": 10, "q": "A state has several old databases. One district stores owner names in a\n20-character field, another in a 50-character field, and a third uses a different\ncolumn arrangement. Directly loading all records into a new standardized\ndatabase is risky mainly because of:\nಒಂದು ರಾಜ್ಯದಲ್ಲಿ ಹಲವು ಹಳೆಯ Databases ಇವೆ. ಒಂದು ಜಿಲ್ಲೆಯಲ್ಲಿ Owner Name 20-character Field,\nಇನ್ನೊಂದರಲ್ಲಿ 50-character Field ಮತ್ತು ಮತ್ತೊಂದರಲ್ಲಿ ವಿಭಿನ್ನ Column Arrangement ಬಳಸಲಾಗಿದೆ.\nಇವುಗಳನ್ನು ನೇರವಾಗಿ ಹೊಸ Standardized Database ಗೆ Load ಮಾಡುವುದು ಮುಖ್ಯವಾಗಿ ಯಾವ ಕಾರಣದಿಂದ\nಅಪಾಯಕಾರಿ?", "o": ["It guarantees data normalization", "It may cause truncation, incorrect mapping and relationship problems", "It automatically validates all records", "It eliminates the need for transformation"], "a": 1, "e": "ವಿಭಿನ್ನ Legacy Structures ಅನ್ನು ನೇರವಾಗಿ Migrate ಮಾಡಿದರೆ Data Truncation, Missing\nInformation, Incorrect Field Mapping, Unmapped Foreign Keys ಮತ್ತು Broken Relationships ಉಂಟಾಗಬಹುದು."}, {"t": "SDLC, Land Records IT & APIs", "n": 11, "q": "Which sequence best represents a controlled migration process for\nheterogeneous legacy land records?\nವಿಭಿನ್ನ Legacy Land Records ಗಾಗಿ Controlled Migration Process ಅನ್ನು ಅತ್ಯುತ್ತಮವಾಗಿ ಸೂಚಿಸುವ ಕ್ರಮ\nಯಾವುದು?", "o": ["Legacy Data → Production → Transform → Validate → Staging", "Legacy Data → Staging → Extract → Transform → Validate → Load → Testing → Integrity Check → Production", "Legacy Data → Load → Production → Extract → Validation", "Extract → Production → Delete Legacy Data → Transform"], "a": 1, "e": "Staging ಮೂಲಕ Legacy Data ಅನ್ನು ಸುರಕ್ಷಿತವಾಗಿ ಸ್ವೀಕರಿಸಿ, ETL, Validation,\nIntegration Testing ಮತ್ತು Integrity Verification ನಂತರ Production ಗೆ Load ಮಾಡುವುದು ಉತ್ತಮ ವಿಧಾನ."}, {"t": "SDLC, Land Records IT & APIs", "n": 12, "q": "During migration, an old date format DD-MM-YYYY is converted into the\ntarget system's required format, and inconsistent owner names are standardized.\nWhich ETL stage performs these operations?\nMigration ಸಮಯದಲ್ಲಿ ಹಳೆಯ DD-MM-YYYY Date Format ಅನ್ನು Target System ನ Format ಗೆ ಪರಿವರ್ತಿಸಿ,\nInconsistent Owner Names ಅನ್ನು Standardize ಮಾಡಲಾಗುತ್ತದೆ. ಈ ಕಾರ್ಯಗಳು ETL ಯ ಯಾವ Stage ಗೆ\nಸೇರಿವೆ?", "o": ["Extract", "Transform", "Load", "Authentication"], "a": 1, "e": "Transform ಹಂತದಲ್ಲಿ Data Cleaning, Name Standardization, Date Conversion, Space\nRemoval ಮತ್ತು Field Value Standardization ಮಾಡಲಾಗುತ್ತದೆ."}, {"t": "SDLC, Land Records IT & APIs", "n": 13, "q": "A migration team compares source and target record counts, checks foreign\nkeys, verifies ownership relationships and searches for missing values and\ntruncated data. These checks primarily aim to establish:\nMigration Team Source ಮತ್ತು Target Record Counts ಹೋಲಿಸಿ, Foreign Keys ಪರಿಶೀಲಿಸಿ, Ownership\nRelationships Verify ಮಾಡಿ, Missing Values ಮತ್ತು Truncated Data ಹುಡುಕುತ್ತದೆ. ಈ Checks ನ ಮುಖ್ಯ\nಉದ್ದೇಶವೇನು?", "o": ["Visual styling consistency", "Migration completeness and correct integration", "Webpage responsiveness", "API rate limiting"], "a": 1, "e": "Automated Integration Testing ಮೂಲಕ Migrated Records Complete ಆಗಿವೆಯೇ, Field\nMapping ಸರಿಯಾಗಿದೆಯೇ ಮತ್ತು Relationships ಸರಿಯಾಗಿ ಉಳಿದಿವೆಯೇ ಎಂಬುದನ್ನು ಪರಿಶೀಲಿಸಲಾಗುತ್ತದೆ."}, {"t": "SDLC, Land Records IT & APIs", "n": 14, "q": "Consider the following statements about data integrity verification.\nData Integrity Verification ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. A hash can act as a fingerprint of data.\nHash ಅನ್ನು Data ನ Fingerprint ಆಗಿ ಬಳಸಬಹುದು.\n2. Hash values can be compared before and after migration.\nMigration ಮೊದಲು ಮತ್ತು ನಂತರ Hash Values ಅನ್ನು ಹೋಲಿಸಬಹುದು.\n3. Different hash values, under the same method and representation, indicate that the compared data\ndiffers.\nಅದೇ Method ಮತ್ತು Representation ನಲ್ಲಿ ವಿಭಿನ್ನ Hash Values ಬಂದರೆ Compared Data ವಿಭಿನ್ನವಾಗಿದೆ\nಎಂದು ಸೂಚಿಸುತ್ತದೆ.\n4. Matching hashes prove that every aspect of a complex database is correct under all circumstances.\nMatching Hashes Complex Database ನ ಪ್ರತಿಯೊಂದು ಅಂಶವೂ ಎಲ್ಲಾ ಸಂದರ್ಭಗಳಲ್ಲೂ ಸರಿಯಾಗಿದೆ\nಎಂದು ಸಾಬೀತುಪಡಿಸುತ್ತವೆ.\n\nWhich statements are correct?", "o": ["1 and 2 only", "1, 2 and 3 only", "2, 3 and 4 only", "All 4"], "a": 1, "e": "Hash Matching Data Unchanged ಆಗಿರುವುದಕ್ಕೆ Evidence ನೀಡುತ್ತದೆ, ಆದರೆ ಅದು\nDatabaseನ ಪ್ರತಿಯೊಂದು Semantic ಅಥವಾ Business Rule ಸರಿಯಾಗಿದೆ ಎಂಬ ಸಂಪೂರ್ಣ Proof ಅಲ್ಲ."}, {"t": "SDLC, Land Records IT & APIs", "n": 15, "q": "A citizen enters a Survey Number in a browser, the request is processed\naccording to business rules, and the required ownership record is retrieved from\na database. Which flow best represents the architecture?\nCitizen Browser ನಲ್ಲಿ Survey Number ನಮೂದಿಸುತ್ತಾರೆ; Request ಅನ್ನು Business Rules ಪ್ರಕಾರ Process\nಮಾಡಿ Ownership Record ಅನ್ನು Database ನಿಂದ ಪಡೆಯಲಾಗುತ್ತದೆ. ಸರಿಯಾದ Flow ಯಾವುದು?", "o": ["User → Data Storage → Presentation → Application", "User → Presentation → Application → Data Storage → Application → Presentation → User", "User → Application → Presentation → Data Storage → User", "User → Database → Internet → Presentation"], "a": 1, "e": "Presentation User Input ಸ್ವೀಕರಿಸುತ್ತದೆ; Application Business Logic ಮತ್ತು Request\nProcessing ಮಾಡುತ್ತದೆ; Data Storage Data ಅನ್ನು ಒದಗಿಸುತ್ತದೆ. Result ಮತ್ತೆ Application ಮತ್ತು Presentation\nಮೂಲಕ User ಗೆ ತಲುಪುತ್ತದೆ."}, {"t": "SDLC, Land Records IT & APIs", "n": 16, "q": "Which of the following is correctly associated with the three-tier\narchitecture?\nThree-tier Architecture ಜೊತೆ ಸರಿಯಾಗಿ ಹೊಂದಿಕೆಯಾಗಿರುವುದು ಯಾವುದು?", "o": ["Presentation Tier — business rules; Application Tier — webpage appearance; Data Tier — browser navigation", "Presentation Tier — user interface; Application Tier — business logic; Data Storage Tier — data management", "Presentation Tier — database indexing; Application Tier — HTML only; Data Tier — authentication only", "Presentation Tier — backup; Application Tier — file storage; Data Tier — CSS"], "a": 1, "e": "Three-tier Architecture ನಲ್ಲಿ Presentation → User Interface, Application\n→ Business Logic, Data Storage → Data Management ಎಂಬ ವಿಭಜನೆ ಇರುತ್ತದೆ."}, {"t": "SDLC, Land Records IT & APIs", "n": 17, "q": "A citizen's identity has been verified successfully, but the citizen is allowed\nonly to view a record and not modify it. Which two concepts explain this\nsituation?\nCitizen ನ Identity ಯಶಸ್ವಿಯಾಗಿ Verify ಆಗಿದೆ; ಆದರೆ Citizen ಗೆ Record View ಮಾಡಲು ಮಾತ್ರ ಅನುಮತಿ\nಇದೆ, Modify ಮಾಡಲು ಇಲ್ಲ. ಈ ಪರಿಸ್ಥಿತಿಯನ್ನು ಯಾವ ಎರಡು Concepts ವಿವರಿಸುತ್ತವೆ?", "o": ["Authorization first, then HTML", "Authentication followed by authorization", "Encryption followed by CSS", "Serialization followed by indexing"], "a": 1, "e": "Authentication = Who are you?; Authorization = What are you\nallowed to access/do? Identity Verification ನಂತರ Permissions ನಿರ್ಧರಿಸಲಾಗುತ್ತದೆ."}, {"t": "SDLC, Land Records IT & APIs", "n": 18, "q": "A mobile field application must record survey observations in a remote\nlocation with no network connectivity and upload them after connectivity returns.\nWhich design best fits this requirement?\nNetwork Connectivity ಇಲ್ಲದ Remote Location ನಲ್ಲಿ Mobile Field Application Survey Observations\nದಾಖಲಿಸಬೇಕು ಮತ್ತು Connectivity ಬಂದ ನಂತರ Upload ಮಾಡಬೇಕು. ಯಾವ Design ಸೂಕ್ತ?", "o": ["Online-only architecture", "Offline-First Architecture", "Presentation-only architecture", "Database-free architecture"], "a": 1, "e": "Offline-First Architecture ನಲ್ಲಿ Data ಮತ್ತು Operations ಮೊದಲು Device ನ Local Storage\nನಲ್ಲಿ ನಿರ್ವಹಿಸಲಾಗುತ್ತದೆ; Network ಬಂದಾಗ Central Server ಜೊತೆ Synchronize ಮಾಡಲಾಗುತ್ತದೆ."}, {"t": "SDLC, Land Records IT & APIs", "n": 19, "q": "Consider the following statements regarding field operations.\nField Operations ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. SQLite can provide lightweight local storage.\nSQLite Lightweight Local Storage ಒದಗಿಸಬಹುದು.\n2. GNSS can help determine the geographical position of the device.\nGNSS Device ನ Geographical Position ನಿರ್ಧರಿಸಲು ಸಹಾಯ ಮಾಡಬಹುದು.\n3. Geo-tagging associates a record, photograph or observation with a geographic location.\nGeo-tagging Record, Photograph ಅಥವಾ Observation ಅನ್ನು Geographical Location ಜೊತೆ\nಸಂಪರ್ಕಿಸುತ್ತದೆ.\n4. Offline-first architecture requires continuous Internet connectivity for every transaction.\nOffline-first Architecture ಪ್ರತಿಯೊಂದು Transaction ಗಾಗಿ Continuous Internet Connectivity\nಅಗತ್ಯಪಡಿಸುತ್ತದೆ.\n\nWhich statements are correct?", "o": ["1 and 2 only", "1, 2 and 3 only", "2, 3 and 4 only", "All 4"], "a": 1, "e": "SQLite Local Storage, GNSS Positioning ಮತ್ತು Geo-tagging Offline Field Work ಗೆ\nಸಹಾಯಕ. Offline-first ನ ಉದ್ದೇಶವೇ Network ಇಲ್ಲದ ಸಂದರ್ಭದಲ್ಲೂ ಕೆಲಸ ಮುಂದುವರಿಸುವುದು."}, {"t": "SDLC, Land Records IT & APIs", "n": 20, "q": "Two field devices modify the same land record while disconnected. After\nreconnecting, the system detects conflicting changes and determines how the\nupdates should be reconciled before updating the central database. This most\ndirectly demonstrates:\nಎರಡು Field Devices Network ಇಲ್ಲದ ಸಮಯದಲ್ಲಿ ಒಂದೇ Land Record ಅನ್ನು Modify ಮಾಡುತ್ತವೆ. Reconnect\nಆದ ನಂತರ System Conflicting Changes ಪತ್ತೆಹಚ್ಚಿ Central Database Update ಮಾಡುವ ಮೊದಲು ಅವುಗಳನ್ನು\nReconcile ಮಾಡುತ್ತದೆ. ಇದು ಯಾವುದನ್ನು ನೇರವಾಗಿ ತೋರಿಸುತ್ತದೆ?", "o": ["CSS rendering", "Synchronization with conflict handling", "HTML parsing", "Static printing"], "a": 1, "e": "Synchronization ಕೇವಲ Data Upload ಮಾಡುವುದಲ್ಲ; ಅಗತ್ಯವಿದ್ದಲ್ಲಿ Transaction Order,\nConflicting Updates ಮತ್ತು Validation ಅನ್ನು ಸಹ ನಿರ್ವಹಿಸಬಹುದು."}, {"t": "SDLC, Land Records IT & APIs", "n": 21, "q": "Which of the following contains only spatial information in a typical\nland-record context?\nಸಾಮಾನ್ಯ Land-record Context ನಲ್ಲಿ ಕೆಳಗಿನವುಗಳಲ್ಲಿ Spatial Information ಮಾತ್ರ ಹೊಂದಿರುವುದು ಯಾವುದು?", "o": ["Owner name, mutation number, rights information", "Transaction details, document number, owner name", "Parcel polygon, geographic coordinates, parcel boundary", "Owner name, transaction date, certificate number"], "a": 2, "e": "Spatial Data ಭೂಮಿಯ Location, Shape ಮತ್ತು Boundary ಅನ್ನು ಪ್ರತಿನಿಧಿಸುತ್ತದೆ. Parcel\nPolygon ಮತ್ತು Geographic Coordinates ಇದಕ್ಕೆ ನೇರ ಉದಾಹರಣೆಗಳು."}, {"t": "SDLC, Land Records IT & APIs", "n": 22, "q": "A land-record system stores owner names, rights information and\ntransaction details along with parcel polygons and geographic coordinates.\nWhich architecture is most appropriate for the underlying data management?\nLand-record System Owner Names, Rights Information ಮತ್ತು Transaction Details ಜೊತೆಗೆ Parcel Polygons\nಮತ್ತು Geographic Coordinates ಅನ್ನು ಸಂಗ್ರಹಿಸುತ್ತದೆ. ಕೆಳಗಿನ ಯಾವ Data Management Approach ಸೂಕ್ತ?", "o": ["Textual data management alone", "Spatial data management alone", "Both conventional database and spatial-data management", "Image storage alone"], "a": 2, "e": "Modern Land-record Systems ನಲ್ಲಿ Textual + Spatial Data ಎರಡೂ ಅಗತ್ಯ. PostgreSQL\n+ PostGIS ಮಾದರಿಯ ವ್ಯವಸ್ಥೆ ಎರಡನ್ನೂ ನಿರ್ವಹಿಸಬಹುದು."}, {"t": "SDLC, Land Records IT & APIs", "n": 23, "q": "A government web service must be accessible from the Internet, but its\napplication and database servers should not be directly exposed to public traffic.\nWhich arrangement provides the strongest conceptual separation?\nGovernment Web Service Internet ಮೂಲಕ Accessible ಆಗಿರಬೇಕು; ಆದರೆ Application ಮತ್ತು Database\n\nServers Public Traffic ಗೆ Directly Expose ಆಗಬಾರದು. ಯಾವ ವ್ಯವಸ್ಥೆ ಉತ್ತಮ Conceptual Separation\nಒದಗಿಸುತ್ತದೆ?", "o": ["Internet → Database → Application → DMZ", "Internet → DMZ → Secure Application Zone → Secure Database Zone", "Internet → Secure Database Zone → DMZ", "Internet → All servers in one public network"], "a": 1, "e": "DMZ Public-facing Services ಗಾಗಿ Buffer Zone ಆಗಿದೆ. Application Zone Business Logic\nಅನ್ನು ನಡೆಸುತ್ತದೆ ಮತ್ತು Database Zone ಅತ್ಯಂತ ಸೂಕ್ಷ್ಮ Core Data ಅನ್ನು ಹೆಚ್ಚು ಕಠಿಣ Access Control\nಅಡಿಯಲ್ಲಿ ಇಡುತ್ತದೆ."}, {"t": "SDLC, Land Records IT & APIs", "n": 24, "q": "Which statement most accurately explains the purpose of a DMZ in this\narchitecture?\nಈ Architecture ನಲ್ಲಿ DMZ ಯ ಉದ್ದೇಶವನ್ನು ಅತ್ಯಂತ ನಿಖರವಾಗಿ ವಿವರಿಸುವ ಹೇಳಿಕೆ ಯಾವುದು?", "o": ["It stores all confidential land records", "It acts as a controlled buffer for public-facing services", "It replaces the application server", "It performs database indexing"], "a": 1, "e": "DMZ ನಲ್ಲಿ Web Servers, Reverse Proxies ಮುಂತಾದ Internet-facing Services\nಇರಬಹುದು. ಇದು Public Internet ಮತ್ತು Internal Network ನಡುವೆ Controlled Buffer ಆಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸುತ್ತದೆ."}, {"t": "SDLC, Land Records IT & APIs", "n": 25, "q": "A spatial database contains millions of parcel geometries. A conventional\nordered index is insufficient for efficiently narrowing candidates based on spatial\nrelationships. Which structure is particularly relevant?\nಒಂದು Spatial Database ನಲ್ಲಿ ಲಕ್ಷಾಂತರ Parcel Geometries ಇವೆ. Spatial Relationships ಆಧಾರದ ಮೇಲೆ\nSearch Candidates ಅನ್ನು ವೇಗವಾಗಿ ಕಡಿಮೆ ಮಾಡಲು ಸಾಮಾನ್ಯ Ordered Index ಸಾಕಾಗುವುದಿಲ್ಲ. ಯಾವ\nStructure ಹೆಚ್ಚು ಸೂಕ್ತ?", "o": ["R-Tree", "HTML Table", "CSS Grid", "XML Tag"], "a": 0, "e": "R-Tree Spatial Objects ಅನ್ನು MBRs ಮೂಲಕ ಸಂಘಟಿಸಿ Spatial Search ನಲ್ಲಿ\nಪರಿಶೀಲಿಸಬೇಕಾದ Objects ಸಂಖ್ಯೆಯನ್ನು ಕಡಿಮೆ ಮಾಡಲು ಸಹಾಯ ಮಾಡುತ್ತದೆ."}, {"t": "SDLC, Land Records IT & APIs", "n": 26, "q": "Consider the following statements regarding spatial indexing.\nSpatial Indexing ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. R-Tree uses Minimum Bounding Rectangles to organize spatial objects.\nR-Tree Spatial Objects ಅನ್ನು ಸಂಘಟಿಸಲು Minimum Bounding Rectangles ಬಳಸುತ್ತದೆ.\n2. An MBR is a rectangular boundary capable of containing a spatial object or group of objects.\nMBR ಒಂದು Spatial Object ಅಥವಾ Objects Group ಅನ್ನು ಒಳಗೊಂಡಿರುವ Rectangular Boundary\nಆಗಿದೆ.\n3. GiST stands for Generalized Search Tree.\nGiST ಎಂದರೆ Generalized Search Tree.\n4. GiST can be used as an indexing framework in PostgreSQL and supports spatial indexing in\nPostGIS.\nGiST PostgreSQL ನಲ್ಲಿ Indexing Framework ಆಗಿ ಮತ್ತು PostGIS ನಲ್ಲಿ Spatial Indexing ಗೆ\nಬಳಸಬಹುದು.\n5. Spatial indexing is intended to increase the number of unnecessary objects examined by every\nquery.\nSpatial Indexing ಪ್ರತಿಯೊಂದು Query ಯಲ್ಲಿ ಅನಗತ್ಯವಾಗಿ ಪರಿಶೀಲಿಸಬೇಕಾದ Objects ಸಂಖ್ಯೆಯನ್ನು\nಹೆಚ್ಚಿಸಲು ಉದ್ದೇಶಿಸಲಾಗಿದೆ.\n\nWhich statements are correct?", "o": ["1, 2 and 3 only", "1, 2, 3 and 4 only", "2, 3, 4 and 5 only", "All 5"], "a": 1, "e": "R-Tree → MBR → Spatial Objects → Faster Search. GiST is a\ngeneralized indexing framework used by PostgreSQL and PostGIS for spatial indexing.\nStatement 5 is opposite to the purpose of indexing."}, {"t": "SDLC, Land Records IT & APIs", "n": 27, "q": "A mobile application, citizen portal, GIS system, payment system and\nauthentication service need controlled exchange of information. Which\ntechnology provides the defined interface for such communication?\nMobile Application, Citizen Portal, GIS System, Payment System ಮತ್ತು Authentication Service ನಡುವೆ\nನಿಯಂತ್ರಿತ ರೀತಿಯಲ್ಲಿ Information Exchange ಅಗತ್ಯವಿದೆ. ಇಂತಹ Communication ಗಾಗಿ Defined Interface\nಒದಗಿಸುವ Technology ಯಾವುದು?", "o": ["API", "CSS", "R-Tree", "HTML"], "a": 0, "e": "API (Application Programming Interface) ಎರಡು ಅಥವಾ ಹೆಚ್ಚು Software Systems ನಡುವೆ\nData ಅಥವಾ Services Exchange ಮಾಡಲು Defined Communication Interface ಒದಗಿಸುತ್ತದೆ."}, {"t": "SDLC, Land Records IT & APIs", "n": 28, "q": "Consider the following statements.\nಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ.\n\n1. REST is an architectural style commonly used for web APIs.\nREST Web APIs ಗಾಗಿ ಸಾಮಾನ್ಯವಾಗಿ ಬಳಸುವ Architectural Style ಆಗಿದೆ.\n2. REST communication is generally stateless.\nREST Communication ಸಾಮಾನ್ಯವಾಗಿ Stateless ಆಗಿರುತ್ತದೆ.\n3. SOAP is a structured messaging protocol and commonly uses XML.\nSOAP ಒಂದು Structured Messaging Protocol ಆಗಿದ್ದು ಸಾಮಾನ್ಯವಾಗಿ XML ಬಳಸುತ್ತದೆ.\n4. JSON is commonly used for lightweight data exchange in REST-based applications.\nREST-based Applications ನಲ್ಲಿ Lightweight Data Exchange ಗಾಗಿ JSON ಅನ್ನು ಸಾಮಾನ್ಯವಾಗಿ\nಬಳಸಲಾಗುತ್ತದೆ.\n5. REST and SOAP are both programming languages.\nREST ಮತ್ತು SOAP ಎರಡೂ Programming Languages ಆಗಿವೆ.\n\nWhich statements are correct?", "o": ["1, 2 and 3 only", "1, 2, 3 and 4 only", "2, 3, 4 and 5 only", "All 5"], "a": 1, "e": "REST ಒಂದು Architectural Style, SOAP ಒಂದು Messaging Protocol. JSON REST APIs\nನಲ್ಲಿ ಸಾಮಾನ್ಯ; XML SOAP ನಲ್ಲಿ ಪ್ರಮುಖ. ಇವು Programming Languages ಅಲ್ಲ."}, {"t": "SDLC, Land Records IT & APIs", "n": 29, "q": "A client sends a large number of requests to an API. The system needs to\nverify identity, determine permissions, route requests to the appropriate\nmicroservice, restrict excessive traffic and record API activity. Which component\nis best suited to perform these functions centrally?\nಒಂದು Client API ಗೆ ಹೆಚ್ಚಿನ ಸಂಖ್ಯೆಯ Requests ಕಳುಹಿಸುತ್ತದೆ. System Identity Verify ಮಾಡಿ, Permissions\nನಿರ್ಧರಿಸಿ, Request ಅನ್ನು ಸರಿಯಾದ Microservice ಗೆ Route ಮಾಡಿ, Excessive Traffic ಅನ್ನು Limit ಮಾಡಿ ಮತ್ತು\n\nAPI Activity ಅನ್ನು Record ಮಾಡಬೇಕಾಗಿದೆ. ಈ ಕಾರ್ಯಗಳನ್ನು Centralized ಆಗಿ ನಿರ್ವಹಿಸಲು ಯಾವ\nComponent ಸೂಕ್ತ?", "o": ["API Gateway", "HTML <body>", "SQLite table", "R-Tree"], "a": 0, "e": "API Gateway ಸಾಮಾನ್ಯ Entry Point ಆಗಿ Authentication, Authorization, Request\nRouting, Rate Limiting, Security Checks, Logging, Monitoring ಮತ್ತು Load Management ಮುಂತಾದ\nಕಾರ್ಯಗಳನ್ನು ನಿರ್ವಹಿಸಬಹುದು."}, {"t": "SDLC, Land Records IT & APIs", "n": 30, "q": "Consider the following statements about the technologies used in a modern\ngovernment land-record system.\nಆಧುನಿಕ Government Land-record System ನಲ್ಲಿ ಬಳಸುವ Technologies ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು\nಪರಿಗಣಿಸಿ.\n\n1. HTML primarily defines webpage structure.\nHTML ಮುಖ್ಯವಾಗಿ Webpage Structure ಅನ್ನು ನಿರ್ಧರಿಸುತ್ತದೆ.\n2. CSS primarily controls presentation and appearance.\nCSS ಮುಖ್ಯವಾಗಿ Presentation ಮತ್ತು Appearance ಅನ್ನು ನಿಯಂತ್ರಿಸುತ್ತದೆ.\n3. JavaScript can provide dynamic and interactive behaviour.\nJavaScript Dynamic ಮತ್ತು Interactive Behaviour ಒದಗಿಸಬಹುದು.\n4. HTTPS provides secure HTTP communication using TLS-based security mechanisms.\nHTTPS TLS-based Security Mechanisms ಬಳಸಿ Secure HTTP Communication ಒದಗಿಸುತ್ತದೆ.\n5. PostgreSQL is a relational database, while PostGIS adds spatial capabilities to PostgreSQL.\nPostgreSQL ಒಂದು Relational Database; PostGIS PostgreSQL ಗೆ Spatial Capabilities ಸೇರಿಸುತ್ತದೆ.\n6. SQLite can serve as lightweight local storage for offline field applications.\nSQLite Offline Field Applications ಗೆ Lightweight Local Storage ಆಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸಬಹುದು.\n7. Java can be used for backend business logic and enterprise applications.\nJava Backend Business Logic ಮತ್ತು Enterprise Applications ಗೆ ಬಳಸಬಹುದು.\n\nWhich of the above statements are correct?\nಮೇಲಿನ ಹೇಳಿಕೆಗಳಲ್ಲಿ ಸರಿಯಾದವು ಯಾವುವು?", "o": ["1, 2, 3 and 4 only", "1, 2, 3, 4 and 5 only", "2, 3, 4, 5, 6 and 7 only", "1, 2, 3, 4, 5, 6 and 7"], "a": 3, "e": "Modern LR-IT systems combine multiple layers and technologies:\nHTML/CSS/JavaScript for the interface, Java for backend logic, HTTPS/TLS for secure\ncommunication, PostgreSQL/PostGIS for relational and spatial data, and SQLite for\noffline field storage.\nMS OFFICE"}, {"t": "MS Office & Web Basics", "n": 1, "q": "Which of the following combinations correctly identifies the primary purpose of the three major\nMS Office applications given in the material? / ಕೆಳಗಿನ ಯಾವ ಸಂಯೋಜನೆಯು ನೀಡಿರುವ ಮೂರು\nಪ್ರಮುಖ MS Office ಅಪ್ಲಿಕೇಶನ್ಗಳ ಮುಖ್ಯ ಉದ್ದೇಶವನ್ನು ಸರಿಯಾಗಿ ಗುರುತಿಸುತ್ತದೆ?", "o": ["Word–Spreadsheet, Excel–Presentation, PowerPoint–Word Processing", "Word–Word Processing, Excel–Spreadsheet, PowerPoint–Presentation", "Word–Presentation, Excel–Word Processing, PowerPoint–Spreadsheet", "Word–Database, Excel–Presentation, PowerPoint–Word Processing"], "a": 1, "e": "MS Word is primarily a word processor, Excel is spreadshe
