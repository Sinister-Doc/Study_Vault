<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modern Survey — MCQ Kit Test</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f4ef;--card:#fff;--ink:#1c2230;--mut:#667085;--line:#dedbd1;--acc:#1f5fbf;--accbg:#e7effb;--ok:#14733f;--okbg:#e2f4e9;--bad:#b3261e;--badbg:#fbe8e6;--warn:#8a5a00;--warnbg:#fff1cc}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161b;--card:#1c2027;--ink:#e8eaee;--mut:#9aa3b2;--line:#323843;--acc:#6ea3f5;--accbg:#1d2a40;--ok:#58c98a;--okbg:#17301f;--bad:#f2837b;--badbg:#3a1d1b;--warn:#f0c15a;--warnbg:#3a2f12}}
:root[data-theme="dark"]{--bg:#13161b;--card:#1c2027;--ink:#e8eaee;--mut:#9aa3b2;--line:#323843;--acc:#6ea3f5;--accbg:#1d2a40;--ok:#58c98a;--okbg:#17301f;--bad:#f2837b;--badbg:#3a1d1b;--warn:#f0c15a;--warnbg:#3a2f12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:14px}
h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.1rem;margin:.2em 0 .6em}
.mut{color:var(--mut)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 14px}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chk{display:flex;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
#timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.15rem;padding:4px 12px;border-radius:9px;background:var(--accbg);color:var(--acc)}
#timer.low{background:var(--badbg);color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 230px;gap:12px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.tag{display:inline-block;font-size:.78rem;padding:2px 8px;border-radius:99px;background:var(--accbg);color:var(--acc);margin-right:6px}
.stem{white-space:pre-line;font-size:1.05rem;margin:.6em 0 1em;overflow-wrap:anywhere}
.opt{display:flex;gap:10px;width:100%;text-align:left;padding:10px 12px;margin:7px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow-wrap:anywhere}
.opt b{min-width:1.4em;color:var(--mut)}
.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.pal button{padding:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:.85rem}
.pal .ans{background:var(--accbg);border-color:var(--acc)}.pal .mk{outline:2px solid var(--warn)}.pal .cur{box-shadow:0 0 0 2px var(--ink)}
.pal .ok{background:var(--okbg);border-color:var(--ok)}.pal .bad{background:var(--badbg);border-color:var(--bad)}
.exp{margin-top:8px;padding:8px 12px;border-radius:9px;background:var(--warnbg);color:var(--ink);font-size:.95rem}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat div{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card)}.stat b{display:block;font-size:1.4rem}
.tblw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.92rem}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.weak{color:var(--bad);font-weight:600}.banner{background:var(--warnbg);border:1px solid var(--warn);border-radius:10px;padding:10px;margin:8px 0}
</style></head><body><div class="wrap" id="app"></div>
<script type="application/json" id="data">[{"t": "Module 1: Photogrammetry & Aerial Survey", "n": 1, "q": "Which of the following best explains why two overlapping photographs can provide information that a single\nphotograph generally cannot?", "o": ["They automatically eliminate all atmospheric effects.", "They provide observations from different camera positions, enabling stereoscopic depth perception and triangulation.", "They increase the radiometric resolution of the original sensor.", "They convert a passive sensor into an active sensor."], "a": 1, "e": "Different camera positions create parallax, which supports stereoscopic depth perception and triangulation for 3D measurement."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 2, "q": "Consider the following statements about the basic operation of photogrammetry.\n\n1. The object reflects electromagnetic energy.\n2. The camera records the reflected energy as imagery.\n3. Common points in overlapping photographs can be used for reconstruction.\n4. Direct physical contact with every measured object is essential.\n\nHow many of the above statements are correct?", "o": ["Only one", "Only two", "Only three", "All four"], "a": 2, "e": "Statements 1, 2 and 3 are correct. Photogrammetry specifically allows measurements without direct physical contact."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 3, "q": "Match the following correctly.\n\nList I | List II\n\n1. Photo | a. Measurement\n\n2. Gramma | b. Light\n\n3. Metron | c. Drawing/Record", "o": ["1-a, 2-b, 3-c", "1-b, 2-c, 3-a", "1-c, 2-a, 3-b", "1-b, 2-a, 3-c"], "a": 1, "e": "Photo = Light, Gramma = Drawing/Record, Metron = Measurement."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 4, "q": "Which one of the following combinations is completely correct according to the supplied historical facts?", "o": ["Aimé Laussedat—Father of Photogrammetry; Nadar—First Aerial Photograph", "Nadar—Father of Photogrammetry; Laussedat—First Aerial Photograph", "Landsat-1—First Indian RS Satellite; IRS-1A—First Earth Observation Satellite", "Niépce—First Aerial Photograph; Nadar—First Permanent Photograph"], "a": 0, "e": "Aimé Laussedat is identified as the Father of Photogrammetry, while Nadar is associated with the first aerial photograph. Aimé Laussedat → Father of Photogrammetry; Nadar → First Aerial Photograph."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 5, "q": "The conventional aerial-survey values given for forward and side overlap are 60% and 20–30%, respectively.\nWhich of the following interpretations is correct?", "o": ["60% refers to overlap between adjacent flight strips.", "20–30% refers to successive photographs along the flight direction.", "60% is forward/end lap, whereas 20–30% is side lap.", "Both values refer to the same type of overlap."], "a": 2, "e": "Forward/End Lap occurs along the flight direction; Side Lap occurs between adjacent flight strips."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 6, "q": "Consider the following pairs:\n\n1. Ground camera — Terrestrial Photogrammetry\n2. Aircraft/UAV — Aerial Photogrammetry\n3. Earth-observation satellite — Satellite Photogrammetry\n4. Individual nearby object — Close Range Photogrammetry\n\nHow many pairs are correctly matched?", "o": ["One", "Two", "Three", "Four"], "a": 3, "e": "All four platform/object-level associations are correct."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 7, "q": "A survey involves documenting a monument from several camera positions located a few metres away. The\nrequired output is a highly accurate 3D model. Which choice is most appropriate?", "o": ["Satellite Photogrammetry", "Close Range Photogrammetry", "Conventional Satellite Classification", "Multispectral Mapping"], "a": 1, "e": "Close-range photogrammetry is designed for individual objects at short camera-to-object distances and high-accuracy 3D modelling."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 8, "q": "Which of the following statements regarding the evolution of photogrammetry are correct? /\n\n1. Analog photogrammetry is associated with film photography.\n2. Analytical photogrammetry introduced computer-assisted calculations.\n3. Digital photogrammetry uses digital imagery and software.\n4. Digital photogrammetry necessarily requires film processing.", "o": ["1 and 2 only", "1, 2 and 3 only", "2, 3 and 4 only", "All four"], "a": 1, "e": "The first three are correct; digital photogrammetry does not require film processing."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 9, "q": "Arrange the following in the correct technological order.\n\n1. Digital Photogrammetry\n2. Analog Photogrammetry\n3. Analytical Photogrammetry", "o": ["1 → 2 → 3", "2 → 1 → 3", "2 → 3 → 1", "3 → 2 → 1"], "a": 2, "e": "The evolution is Analog → Analytical → Digital."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 10, "q": "A project demands large-area coverage, but the objective is not extremely high-precision engineering\nmeasurement of individual structures. Which platform-method combination is most defensible?", "o": ["Satellite Photogrammetry", "Close Range Photogrammetry", "Terrestrial Photogrammetry", "Tripod-based stereo survey only"], "a": 0, "e": "Satellite photogrammetry is suitable for very large-area mapping and resource studies, though it is less suitable for very high-precision engineering surveys."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 11, "q": "Which one of the following is incorrectly matched?", "o": ["Multispectral — 3–15 spectral bands", "Hyperspectral — 100–300+ narrow bands", "SAR — Active microwave sensing", "Optical — Active sensor requiring its own microwave transmission"], "a": 3, "e": "Optical satellite sensing is described as passive and dependent on sunlight; SAR is the active microwave system."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 12, "q": "A satellite is expected to collect imagery during both day and night and under cloudy conditions. Which of the\nfollowing statements are applicable?\n\n1. An active sensor is preferable.\n2. Microwave radiation is appropriate.\n3. SAR satisfies these characteristics.\n4. Sunlight must be continuously available.", "o": ["1 and 2 only", "1, 2 and 3 only", "2 and 4 only", "All four"], "a": 1, "e": "SAR is active microwave sensing and does not depend on sunlight; statement 4 is therefore incorrect."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 13, "q": "Which one of the following sequences represents increasing spectral discrimination rather than increasing\nspatial resolution?", "o": ["30 m → 10 m → 0.25 m", "8-bit → 10-bit → 12-bit", "Multispectral → Hyperspectral", "24 days → 16 days → 5 days"], "a": 2, "e": "Multispectral to hyperspectral represents increased spectral detail through more/narrower bands."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 14, "q": "Match the resolution with what it primarily describes.\n\nResolution | Description\n\n1. Spatial | a. Revisit interval\n\n2. Spectral | b. Brightness discrimination\n\n3. Temporal | c. Ground detail/pixel size\n\n4. Radiometric | d. Ability to distinguish wavelengths", "o": ["1-c, 2-d, 3-a, 4-b", "1-d, 2-c, 3-b, 4-a", "1-a, 2-b, 3-c, 4-d", "1-c, 2-a, 3-d, 4-b"], "a": 0, "e": "Spatial → ground detail; Spectral → wavelengths; Temporal → revisit; Radiometric → brightness levels."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 15, "q": "Four sensors have the following characteristics:\n\n● | Sensor P: 0.25 m\n● | Sensor Q: 0.31 m\n● | Sensor R: 10 m\n● | Sensor S: 30 m\n\nIf the requirement is to identify the smallest possible ground features, which sensor should be preferred?", "o": ["P", "Q", "R", "S"], "a": 0, "e": "Smaller pixel size indicates finer spatial resolution; therefore 0.25 m is finest among the four."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 16, "q": "A satellite provides 4,096 brightness levels. Which of the following is the correct interpretation?", "o": ["It has 8-bit radiometric resolution.", "It has 10-bit radiometric resolution.", "It has 12-bit radiometric resolution.", "It has 16-bit radiometric resolution."], "a": 2, "e": "2^12=4096. Hence 4,096 brightness levels correspond to 12-bit radiometric resolution."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 17, "q": "Which of the following statements about revisit time is correct?", "o": ["A shorter revisit period generally indicates better temporal resolution.", "A longer revisit period always indicates better temporal resolution.", "Revisit time measures pixel size.", "Revisit time measures the number of spectral bands."], "a": 0, "e": "Temporal resolution concerns how frequently the same location can be revisited."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 18, "q": "An image is geometrically displaced because of satellite motion, Earth rotation and terrain effects. Which\nprocessing step should be considered first for the described problem?", "o": ["Radiometric Correction", "Geometric Correction", "Image Classification", "Information Extraction"], "a": 1, "e": "Geometric correction addresses positional and geometric distortions."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 19, "q": "Which of the following statements correctly differentiates the four image-processing operations?", "o": ["Radiometric correction → brightness errors; Rectification → map-coordinate alignment; Mosaicking → image joining", "Radiometric correction → terrain removal; Rectification → classification; Mosaicking → spectral enhancement", "Orthorectification → brightness correction only; Mosaicking → GCP measurement", "Classification → geometric correction; Rectification → land-use grouping"], "a": 0, "e": "Radiometric correction addresses brightness-related errors, rectification aligns imagery to map coordinates, and mosaicking combines images. Radiometric → brightness; Rectification → map alignment; Mosaicking → image combination."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 20, "q": "Which statement most accurately describes orthorectification?", "o": ["It only increases the number of spectral bands.", "It combines unrelated images without geometric correction.", "It uses elevation information such as DEM to correct terrain-related distortion and produce a map-accurate image.", "It converts a multispectral image into a hyperspectral image."], "a": 2, "e": "Orthorectification corrects terrain-related geometric displacement using elevation information such as a DEM."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 21, "q": "Which of the following software–use pairs are correctly matched?\n\n1. GEE — Cloud-based image analysis\n2. ENVI — Spectral analysis\n3. SNAP — Sentinel image processing\n4. Pix4D — Drone mapping", "o": ["Only one", "Only two", "Only three", "All four"], "a": 3, "e": "All four software-use associations are consistent with the supplied material."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 22, "q": "A drone survey is planned for a small, technically complex engineering site where hovering at specific\nlocations is valuable. Which combination is most appropriate?", "o": ["Fixed-wing UAV + long straight flight only", "Rotary-wing UAV + hovering capability", "Satellite + side overlap", "Film camera + satellite orbit"], "a": 1, "e": "Rotary-wing/multirotor UAVs can hover and are suitable for small-area engineering surveys."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 23, "q": "Which of the following are characteristics of a fixed-wing drone according to the supplied material? /\n\n1. Aeroplane-like design\n2. Suitable for large-area coverage\n3. Longer typical flight duration than multirotors\n4. Can hover vertically at a fixed point", "o": ["1, 2 and 3 only", "1 and 4 only", "2, 3 and 4 only", "All four"], "a": 0, "e": "Fixed-wing UAVs are efficient for large coverage and longer flights but cannot hover."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 24, "q": "Which combination correctly represents the supplied drone survey planning parameters?", "o": ["Forward 60%, Side 20–30%, Height 10–20 m", "Forward 75–80%, Side 60–70%, Height typically 50–120 m", "Forward 20–30%, Side 75–80%, Height typically 500–1,000 m", "Forward 90–100%, Side 5–10%, Height unrestricted"], "a": 1, "e": "The supplied drone-planning values are 75–80% forward overlap, 60–70% side overlap and typically 50–120 m flying height."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 25, "q": "Which statements concerning Ground Control Points are correct?\n\n1. They have accurately known coordinates.\n2. DGPS or RTK GNSS may be used to survey them.\n3. They can improve horizontal and vertical accuracy.\n4. They remove the need for image overlap.", "o": ["1 and 2 only", "1, 2 and 3 only", "2 and 4 only", "All four"], "a": 1, "e": "GCPs provide positional control and improve accuracy, but they do not replace image overlap."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 26, "q": "A photogrammetric system converts many overlapping 2D photographs into a three-dimensional\nreconstruction by automatically identifying common image features. Which technology is being described?", "o": ["SfM", "Mosaicking", "Radiometric Correction", "Temporal Resampling"], "a": 0, "e": "Structure from Motion (SfM) uses common features in overlapping images to reconstruct 3D structure."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 27, "q": "A point cloud generated from a survey is best described as:", "o": ["A collection of 3D points representing surfaces or objects", "A table containing only satellite revisit times", "A set of spectral bands without spatial coordinates", "A single corrected aerial photograph"], "a": 0, "e": "A point cloud consists of numerous 3D points and can be generated using SfM or LiDAR."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 28, "q": "A city authority wants to model rooftops and tree canopies, while another analyst wants only the underlying\nground surface. Which pairing is correct?", "o": ["City → DEM; Ground → DSM", "City → DSM; Ground → DEM", "City → Orthomosaic only; Ground → SAR", "City → GCP; Ground → Point Cloud only"], "a": 1, "e": "DSM includes surface objects such as buildings and trees; DEM represents the bare-earth surface."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 29, "q": "Which of the following statements concerning an orthomosaic/ORI are correct?\n\n1. It can be created by combining multiple drone images.\n2. Geometric distortions are corrected during production.\n3. It is useful for cadastral and engineering applications.\n4. It is simply an uncorrected original photograph.", "o": ["1 and 2 only", "1, 2 and 3 only", "2, 3 and 4 only", "All four"], "a": 1, "e": "Orthomosaic/ORI is a corrected, seamless image suitable for measurement and mapping; it is not merely an uncorrected original photograph."}, {"t": "Module 1: Photogrammetry & Aerial Survey", "n": 30, "q": "Consider the following complete workflow:\n\n1. Plan flight and determine GSD/height\n2. Capture adequately overlapping images\n3. Establish/measure GCPs\n4. Apply SfM-based reconstruction\n5. Generate point cloud\n6. Derive DEM/DSM and orthomosaic products\n\nWhich of the following is the most appropriate conclusion?", "o": ["It describes a typical drone-based photogrammetric mapping workflow.", "It describes only satellite image classification.", "It is applicable only to analog film photogrammetry.", "GCPs and overlap are unnecessary once SfM is used."], "a": 0, "e": "The sequence integrates flight planning, image overlap, ground control, SfM, point-cloud generation and final mapping products into a modern drone photogrammetry workflow. MODULE 2 - REMOTE SENSING"}, {"t": "Module 2: Remote Sensing", "n": 1, "q": "Which combination most accurately represents the information source and the nature of Remote Sensing?", "o": ["Direct physical contact + mechanical measurement", "EMR recorded by sensors + information obtained without physical contact", "Ground survey only + visible-light photography", "GPS coordinates only + contact-based measurement"], "a": 1, "e": "Remote Sensing obtains information without physical contact by recording reflected, emitted or backscattered EMR using sensors."}, {"t": "Module 2: Remote Sensing", "n": 2, "q": "Consider the following statements.\n\n1. Remote Sensing can provide synoptic coverage.\n2. Repetitive observations are possible.\n3. Every Remote Sensing sensor must physically touch the target.\n4. RS, GIS and GPS together form the foundation of Geospatial Technology.\n\nHow many of the above statements are correct?", "o": ["Only one", "Only two", "Only three", "All four"], "a": 2, "e": "Statements 1, 2 and 4 are correct. Physical contact is contrary to the basic definition of Remote Sensing."}, {"t": "Module 2: Remote Sensing", "n": 3, "q": "Match the following.\n\nList I | List II\n\n1. Evelyn L. | a. First Earth Observation Satellite\nPruitt\n\n2. Nadar | b. Remote Sensing term\npopularized\n\n3. Landsat-1 | c. First aerial photograph\n\n4. P. R. Pisharoty | d. Father of Indian Remote Sensing", "o": ["1-b, 2-c, 3-a, 4-d", "1-c, 2-b, 3-d, 4-a", "1-a, 2-d, 3-b, 4-c", "1-d, 2-a, 3-c, 4-b"], "a": 0, "e": "Pruitt → Remote Sensing term; Nadar → first aerial photograph; Landsat-1 → first Earth Observation Satellite; P. R. Pisharoty → Father of Indian Remote Sensing. Satellite; P. R. Pisharoty → Father of Indian Remote Sensing."}, {"t": "Module 2: Remote Sensing", "n": 4, "q": "An object reflects strongly in one wavelength region but absorbs strongly in another. This difference is\nprimarily useful because it indicates:", "o": ["Its orbital period", "Its spectral signature", "Its revisit interval", "Its spatial resolution"], "a": 1, "e": "The characteristic pattern of absorption/reflection of an object across wavelengths is its spectral signature."}, {"t": "Module 2: Remote Sensing", "n": 5, "q": "Which sequence correctly represents the general Remote Sensing energy-information chain? / Remote", "o": ["Sensor → Target → Atmosphere → Energy Source → Interpretation", "Energy Source → Atmosphere → Target → Sensor → Processing → Interpretation", "Target → Sensor → Energy Source → Processing → Atmosphere", "Energy Source → Sensor → Interpretation → Target → Atmosphere"], "a": 1, "e": "Energy interacts with the atmosphere and target before being recorded by the sensor; the data are then processed and interpreted."}, {"t": "Module 2: Remote Sensing", "n": 6, "q": "Which of the following statements about different sensing mechanisms is correct?", "o": ["Optical sensors generate their own microwave energy.", "Radar records only reflected visible light.", "Thermal sensors primarily detect emitted heat.", "LiDAR is a passive sunlight-dependent sensor."], "a": 2, "e": "Thermal sensors detect emitted thermal energy rather than ordinary reflected visible light. Radar and LiDAR are active systems."}, {"t": "Module 2: Remote Sensing", "n": 7, "q": "If frequency increases while the speed of EMR remains constant, what happens to wavelength according to\nc=λν?", "o": ["It increases proportionally.", "It remains unchanged.", "It decreases.", "It first increases and then becomes zero."], "a": 2, "e": "Since c is constant, wavelength and frequency are inversely related: λ=c/ν."}, {"t": "Module 2: Remote Sensing", "n": 8, "q": "Which one of the following sets is arranged from shorter to longer wavelength based on the supplied ranges?", "o": ["Visible → NIR → SWIR → Thermal IR → Microwave", "Microwave → Thermal IR → SWIR → NIR → Visible", "NIR → Visible → Thermal IR → Microwave → SWIR", "Thermal IR → Visible → NIR → SWIR → Microwave"], "a": 0, "e": "The supplied ranges progress approximately as Visible (0.4–0.7 µm), NIR, SWIR, Thermal IR and then Microwave."}, {"t": "Module 2: Remote Sensing", "n": 9, "q": "A sensor operates in the 1.5 µm region. Which spectral region does this wavelength belong to?", "o": ["Visible", "NIR", "SWIR", "Thermal IR"], "a": 2, "e": "SWIR is given as approximately 1.3–3 µm."}, {"t": "Module 2: Remote Sensing", "n": 10, "q": "Which of the following wavelength–application pairs is incorrectly matched?", "o": ["NIR — Vegetation studies", "SWIR — Soil and moisture studies", "Thermal IR — Temperature mapping", "Microwave — Conventional visible-colour imaging only"], "a": 3, "e": "Microwave is associated with radar/SAR and can support all-weather, day-night imaging; it is not limited to visible-colour imaging."}, {"t": "Module 2: Remote Sensing", "n": 11, "q": "Which situation most clearly represents an atmospheric window?", "o": ["A wavelength region where atmospheric absorption is minimal and EMR can pass relatively effectively", "A wavelength region where all EMR is completely absorbed", "A region containing only visible red light", "A region defined by satellite altitude rather than wavelength"], "a": 0, "e": "An atmospheric window is a wavelength region where the atmosphere permits EMR to pass with relatively low absorption."}, {"t": "Module 2: Remote Sensing", "n": 12, "q": "Consider the following pairs:\n\n1. Visible — 0.4–0.7 µm\n2. NIR — 0.7–1.3 µm\n3. Thermal IR — 3–14 µm\n4. Microwave — 1 mm–1 m\n\nHow many pairs are correctly matched?", "o": ["One", "Two", "Three", "Four"], "a": 3, "e": "All four wavelength ranges correspond to the supplied electromagnetic-spectrum values."}, {"t": "Module 2: Remote Sensing", "n": 13, "q": "Healthy vegetation appears red in an FCC primarily because of:", "o": ["Strong absorption of NIR", "Strong reflection of NIR assigned to the red display channel", "Strong emission of microwave energy", "Complete absorption of visible radiation"], "a": 1, "e": "Healthy vegetation strongly reflects NIR; in a standard FCC arrangement, NIR is displayed as red."}, {"t": "Module 2: Remote Sensing", "n": 14, "q": "A water body appears very dark in an NIR image. Which explanation is most consistent with the supplied\nmaterial?", "o": ["Water strongly reflects NIR.", "Water absorbs NIR strongly.", "Water emits only visible radiation.", "Water converts NIR into microwave radiation."], "a": 1, "e": "Water absorbs NIR strongly, so comparatively little NIR is returned to the sensor."}, {"t": "Module 2: Remote Sensing", "n": 15, "q": "Which of the following statements about satellite functions are correct?\n\n1. EOS is primarily associated with Earth-surface/resource observation.\n2. Weather satellites monitor atmospheric/weather phenomena.\n3. Communication satellites provide services such as broadcasting and telecommunications.\n4. Navigation satellites provide positioning, navigation and timing services.", "o": ["1 and 2 only", "1, 2 and 3 only", "2, 3 and 4 only", "All four"], "a": 3, "e": "All four statements correctly describe the major functional categories given."}, {"t": "Module 2: Remote Sensing", "n": 16, "q": "Match the following satellite systems with their broad function.\n\nSatellite/System | Function\n\n1. NavIC | a. Earth Observation\n\n2. INSAT/GSAT | b. Navigation\n\n3. Cartosat/Resourcesat | c. Communication\n\n4. INSAT-3D | d. Weather", "o": ["1-b, 2-c, 3-a, 4-d", "1-c, 2-b, 3-d, 4-a", "1-a, 2-d, 3-c, 4-b", "1-d, 2-a, 3-b, 4-c"], "a": 0, "e": "NavIC → navigation; INSAT/GSAT → communication; Cartosat/Resourcesat → Earth observation; INSAT-3D → weather."}, {"t": "Module 2: Remote Sensing", "n": 17, "q": "Which of the following orbit–application combinations contains an error?", "o": ["LEO — High-resolution Earth imaging", "MEO — Navigation systems", "GEO — Communication and weather applications", "HEO — Typical equatorial geostationary communication orbit"], "a": 3, "e": "GEO is the geostationary equatorial orbit; HEO is elliptical and is useful particularly for high-latitude communication/surveillance."}, {"t": "Module 2: Remote Sensing", "n": 18, "q": "A satellite is at approximately 35,786 km altitude over the Equator and has an orbital period of about 24\nhours. Which orbit is indicated?", "o": ["LEO", "MEO", "GEO", "HEO"], "a": 2, "e": "The supplied characteristics of GEO are approximately 35,786 km altitude, 24-hour period and equatorial circular orbit."}, {"t": "Module 2: Remote Sensing", "n": 19, "q": "Which statement about natural and artificial satellites is correct?", "o": ["Natural satellites are human-made and require launch vehicles.", "Artificial satellites are naturally captured bodies with no human intervention.", "Earth's Moon is a natural satellite, whereas NavIC satellites are artificial.", "Mercury has several natural satellites."], "a": 2, "e": "The Moon is Earth's natural satellite; NavIC uses artificial satellites. Mercury and Venus have no natural satellites according to the supplied material."}, {"t": "Module 2: Remote Sensing", "n": 20, "q": "Which set contains only passive-sensor examples from the supplied material?", "o": ["Optical and Multispectral", "SAR and LiDAR", "Radar and LiDAR", "SAR and Optical Radar"], "a": 0, "e": "Optical and multispectral sensors are identified as passive, while SAR and LiDAR are active."}, {"t": "Module 2: Remote Sensing", "n": 21, "q": "Consider the following statements about LiDAR.\n\n1. It is an active remote-sensing technology.\n2. It uses laser pulses.\n\n3. It can generate highly accurate 3D point clouds.\n4. It depends entirely on sunlight as its energy source.\n\nHow many statements are correct?", "o": ["Only one", "Only two", "Only three", "All four"], "a": 2, "e": "Statements 1, 2 and 3 are correct. LiDAR generates its own laser energy, so statement 4 is false."}, {"t": "Module 2: Remote Sensing", "n": 22, "q": "Which of the following is not an appropriate output directly associated with LiDAR in the supplied material?", "o": ["3D Point Cloud", "DEM", "DSM", "Spectral classification training sample"], "a": 3, "e": "LiDAR is associated with point clouds, DEM and DSM; training samples belong to image classification workflows. LiDAR → Point Cloud, DEM, DSM; training samples → classification."}, {"t": "Module 2: Remote Sensing", "n": 23, "q": "A human analyst identifies roads, buildings and rivers from an image by visually examining tone, shape,\ntexture, shadow and association. Which statements apply?\n\n1. It is visual image interpretation.\n2. It is human-based.\n3. It necessarily uses automated computer classification.\n4. Ground truth can be used for field verification.", "o": ["1 and 2 only", "1, 2 and 4 only", "2 and 3 only", "All four"], "a": 1, "e": "Visual interpretation is human-based and does not use automatic computer classification; ground truth can verify interpretation."}, {"t": "Module 2: Remote Sensing", "n": 24, "q": "Which pair of interpretation elements is most directly associated with identifying relative height and\ngeographic context respectively?", "o": ["Shadow and Site", "Tone and Texture", "Colour and Pattern", "Size and Shape"], "a": 0, "e": "Shadow can indicate height, while Site refers to the geographic location of a feature."}, {"t": "Module 2: Remote Sensing", "n": 25, "q": "Which of the following statements correctly distinguishes visual interpretation from Digital Image Processing?", "o": ["Visual interpretation is computer-based, while DIP is entirely manual.", "Visual interpretation relies on human examination; DIP uses computer-based enhancement, correction, analysis and classification.", "Both are necessarily subjective and manual.", "Neither can perform image classification."], "a": 1, "e": "Visual interpretation is human-based, whereas DIP is computer-based and supports enhancement, correction, analysis and classification."}, {"t": "Module 2: Remote Sensing", "n": 26, "q": "Match the following terms with their most appropriate meanings.\n\nTerm | Meaning\n\n1. Pixel | a. Brightness value\n\n2. DN | b. Smallest unit of digital image\n\n3. Band | c. Specific wavelength information\n\n4. Raster | d. Image composed of pixels", "o": ["1-b, 2-a, 3-c, 4-d", "1-a, 2-b, 3-d, 4-c", "1-c, 2-d, 3-a, 4-b", "1-d, 2-c, 3-b, 4-a"], "a": 0, "e": "Pixel → smallest image unit; DN → brightness value; Band → wavelength information; Raster → pixel-based image."}, {"t": "Module 2: Remote Sensing", "n": 27, "q": "A classification procedure has no training samples and groups pixels into clusters using an algorithm such as\nK-Means. Which conclusion is correct?", "o": ["It is supervised classification using Maximum Likelihood.", "It is unsupervised classification.", "It is visual interpretation.", "It is orthorectification."], "a": 1, "e": "Unsupervised classification does not use predefined training samples; K-Means and ISODATA are common examples."}, {"t": "Module 2: Remote Sensing", "n": 28, "q": "Which of the following statements about supervised and unsupervised classification are correct? / Supervised\n\n1. Supervised classification uses training samples.\n2. Maximum Likelihood is associated with supervised classification.\n3. Unsupervised classification does not require training samples.\n4. K-Means and ISODATA are associated with unsupervised classification.", "o": ["Only 1 and 2", "Only 2 and 3", "1, 2 and 3 only", "1, 2, 3 and 4"], "a": 3, "e": "All four statements follow the supplied classification framework."}, {"t": "Module 2: Remote Sensing", "n": 29, "q": "An analyst wants to compare two dates of imagery to identify changes in land cover. Which DIP operation is\nmost directly relevant?", "o": ["Change Detection", "Mosaicking", "Rectification only", "Pixel enlargement"], "a": 0, "e": "Change Detection is specifically used to identify differences or changes between imagery acquired at different times."}, {"t": "Module 2: Remote Sensing", "n": 30, "q": "Consider the following statements about the complete workflow and technical relationships.\n\n1. A passive optical sensor depends on natural illumination such as sunlight.\n2. Healthy vegetation generally has strong NIR reflectance.\n3. Orthorectification uses DEM to correct terrain-related distortion.\n4. An 8-bit image provides 256 possible DN levels.\n5. LiDAR is a passive sensor because it uses light.\n\nHow many of the above statements are correct?", "o": ["Two", "Three", "Four", "Five"], "a": 2, "e": "Statements 1–4 are correct. Statement 5 is false because LiDAR is an active sensor that transmits laser pulses. MODULE 3 & 4 : GPS + GIS"}, {"t": "Module 3 & 4: GPS + GIS", "n": 1, "q": "A receiver determines its position from satellite signals by estimating distances from signal travel time. Which\nstatement follows most appropriately?", "o": ["GPS fundamentally depends on measuring angles between satellites", "GPS positioning is based on trilateration rather than photographic triangulation", "GPS requires three-dimensional photographs of the ground", "GPS positioning is equivalent to GIS overlay analysis"], "a": 1, "e": "GPS uses signal travel time to derive ranges and determine position through trilateration. It should not be confused with triangulation based primarily on angles or photogrammetric geometry."}, {"t": "Module 3 & 4: GPS + GIS", "n": 2, "q": "Consider the following statements.\n\n1. Three satellites are sufficient for the simplified latitude-longitude determination given in the module.\n2. A fourth satellite helps resolve altitude and receiver time.\n3. The fourth satellite is required because GPS satellites themselves have no atomic clocks.\n4. GPS receiver position is calculated from signal travel-time measurements.\n\nHow many statements are correct?", "o": ["Only one", "Only two", "Only three", "All four"], "a": 2, "e": "Statements 1, 2 and 4 are correct. Statement 3 is false; GPS satellites use highly precise atomic clocks."}, {"t": "Module 3 & 4: GPS + GIS", "n": 3, "q": "Which one of the following combinations contains exactly two incorrect associations?\n\n1. Space Segment — GPS receivers\n2. Control Segment — Satellite orbit and clock control\n3. User Segment — Survey instruments\n4. Space Segment — Approximately 20,200 km altitude", "o": ["1 and 2", "1 and 3", "1 only", "2 and 4"], "a": 2, "e": "Only statement 1 is incorrect. Receivers belong to the User Segment; orbit/clock control belongs to Control Segment, while 20,200 km is associated with Space Segment. Segment."}, {"t": "Module 3 & 4: GPS + GIS", "n": 4, "q": "Match List I with List II.\n\nList I | List II\n\n1. L1 | a. 1176.45 MHz\n\n2. L2 | b. 1575.42 MHz\n\n3. L5 | c. 1227.60 MHz\n\n4. MEO GPS orbit | d. Approximately 20,200 km", "o": ["1-b, 2-c, 3-a, 4-d", "1-c, 2-b, 3-d, 4-a", "1-a, 2-c, 3-b, 4-d", "1-d, 2-a, 3-c, 4-b"], "a": 0, "e": "L1 → 1575.42 MHz; L2 → 1227.60 MHz; L5 → 1176.45 MHz; GPS satellites operate in MEO at about 20,200 km."}, {"t": "Module 3 & 4: GPS + GIS", "n": 5, "q": "A survey receiver gives a positional error of about 1–3 cm under suitable conditions. Which inference is most\ndefensible from the supplied data?", "o": ["It is most consistent with Standard GPS", "It is most consistent with DGPS", "It is most consistent with RTK GPS", "It necessarily indicates poor satellite geometry"], "a": 2, "e": "The supplied approximate accuracy ranges are Standard GPS 5–10 m, DGPS 0.5–2 m and RTK GPS 1–3 cm."}, {"t": "Module 3 & 4: GPS + GIS", "n": 6, "q": "Suppose satellite geometry remains unchanged, but the receiver starts receiving strong reflected signals from\nnearby buildings. Which accuracy-limiting factor has most directly changed?", "o": ["Atmospheric delay", "Multipath error", "Orbital inclination", "Revisit interval"], "a": 1, "e": "Reflections from buildings and other surfaces can produce multipath, causing errors in the received signal measurements."}, {"t": "Module 3 & 4: GPS + GIS", "n": 7, "q": "Which sequence correctly orders the major GPS segments in terms of their functional relationship? / GPS", "o": ["User → Space → Control", "Control → User → Space", "Space → Control → User", "User → Control → Space"], "a": 2, "e": "Satellites form the Space Segment; their status/orbits/clocks are monitored and controlled by the Control Segment; receivers constitute the User Segment."}, {"t": "Module 3 & 4: GPS + GIS", "n": 8, "q": "Consider the following pairs regarding GPS limitations.\n\n1. Tunnel — signal obstruction\n2. Dense forest — reduced signal strength\n3. Multipath — reflected-signal error\n4. Spoofing — deliberate misleading of receiver\n5. Atmospheric delay — improvement in accuracy\n\nHow many pairs are correctly matched?", "o": ["Two", "Three", "Four", "Five"], "a": 2, "e": "The first four are correct. Atmospheric delay is an error source, not an accuracy improvement mechanism."}, {"t": "Module 3 & 4: GPS + GIS", "n": 9, "q": "Which statement about the discontinuation of Selective Availability (SA) is most consistent with the supplied\nmaterial?", "o": ["It caused GPS to become operational for the first time in 1978.", "It was discontinued in 2000, after which civilian users obtained improved accuracy.", "It converted GPS from MEO to GEO.", "It eliminated all GPS errors."], "a": 1, "e": "SA was discontinued in May 2000, improving civilian GPS accuracy. It did not eliminate atmospheric, multipath or other errors."}, {"t": "Module 3 & 4: GPS + GIS", "n": 10, "q": "A land parcel has a polygon geometry and an attribute record containing owner name, area and land type.\nWhich statement is most accurate?", "o": ["Polygon is attribute data and owner name is spatial data", "Both polygon and owner name are spatial data", "Polygon represents spatial data while owner name/area/type represent attribute data", "Neither can be linked without GPS"], "a": 2, "e": "Polygon defines location/shape; owner name, area and type are descriptive attributes linked through an identifier. Polygon → spatial; owner name/area/type → attribute information."}, {"t": "Module 3 & 4: GPS + GIS", "n": 11, "q": "A GIS analyst searches for all parcels whose area exceeds 5 hectares, irrespective of where they are located.\nThis is primarily:", "o": ["Spatial Query", "Attribute Query", "Buffer Analysis", "Network Analysis"], "a": 1, "e": "The condition is based on an attribute value—area—not geographic distance or location."}, {"t": "Module 3 & 4: GPS + GIS", "n": 12, "q": "Another analyst asks: “Which hospitals are within 5 km of the selected highway?” Which operation is most\ndirectly involved in answering the location-based part of this question?", "o": ["Spatial Query supported by distance/buffer analysis", "Attribute Query alone", "Metadata creation", "Digitization alone"], "a": 0, "e": "The 5-km condition depends on spatial location/distance and can be supported by buffering followed by a spatial query."}, {"t": "Module 3 & 4: GPS + GIS", "n": 13, "q": "Which statement about GIS and map projection is most precise?", "o": ["Projection converts 2D coordinates into the true 3D Earth without distortion.", "Projection converts the 3D Earth to a flat representation, inevitably introducing some distortion.", "Projection changes attribute data into spatial data.", "Projection is identical to datum definition."], "a": 1, "e": "A map projection mathematically represents the curved Earth on a flat surface; distortion in shape, area, distance or direction is unavoidable."}, {"t": "Module 3 & 4: GPS + GIS", "n": 14, "q": "Which of the following represents the correct conceptual hierarchy?", "o": ["Geoid → mathematical smooth model; Ellipsoid → actual irregular Earth", "Ellipsoid → actual Earth; Datum → satellite receiver", "Geoid → actual irregular Earth; Ellipsoid → mathematical model; Datum → links model to Earth", "Datum → projection; Projection → attribute table"], "a": 2, "e": "Geoid represents the irregular Earth, ellipsoid provides a mathematical approximation, and datum establishes the relationship between the reference ellipsoid and Earth."}, {"t": "Module 3 & 4: GPS + GIS", "n": 15, "q": "Consider the following statements.\n\n1. GCS commonly expresses position using latitude and longitude.\n2. GCS coordinates are normally expressed in degrees.\n3. PCS is commonly used with linear units such as metres.\n4. UTM is an example of a projected coordinate system.\n5. WGS 84 is a projection rather than a datum.\n\nHow many statements are correct?", "o": ["Two", "Three", "Four", "Five"], "a": 2, "e": "Statements 1–4 are correct. WGS 84 is a datum/reference system associated with GPS, not a map projection."}, {"t": "Module 3 & 4: GPS + GIS", "n": 16, "q": "Which one of the following would be the strongest evidence that two datasets have incompatible spatial\nreferencing, rather than merely different attribute values?", "o": ["Owner names differ", "One dataset uses latitude-longitude while another is in a projected metre-based CRS without appropriate transformation", "Parcel IDs have different lengths", "One layer contains more records"], "a": 1, "e": "Different CRS representations can cause spatial misalignment unless correctly transformed. Attribute differences do not by themselves indicate CRS incompatibility."}, {"t": "Module 3 & 4: GPS + GIS", "n": 17, "q": "Which combination contains only raster-type examples from the supplied material?", "o": ["Road, railway, parcel boundary", "Well, school, electric pole", "Satellite image, DEM, rainfall map", "Village boundary, lake, building"], "a": 2, "e": "Satellite imagery, DEM and rainfall maps are given as raster examples; roads, parcels and other discrete features are typically vector representations."}, {"t": "Module 3 & 4: GPS + GIS", "n": 18, "q": "A cadastral database represents each land parcel as a polygon, with shared boundaries expected to match\nexactly. Which two concepts are most directly important?", "o": ["Spectral resolution and radiometric resolution", "Vector model and topology", "GPS trilateration and MEO", "Raster model and temporal resolution"], "a": 1, "e": "Cadastral parcels are naturally represented as vector polygons, while topology helps maintain correct spatial relationships and prevent overlaps/gaps."}, {"t": "Module 3 & 4: GPS + GIS", "n": 19, "q": "A line representing a road ends unexpectedly without connecting to the intended road network. Which\ntopological problem is most closely indicated?", "o": ["Gap", "Dangle", "Containment", "Spectral mismatch"], "a": 1, "e": "A dangling line endpoint where connectivity is unexpectedly broken is referred to as a dangle."}, {"t": "Module 3 & 4: GPS + GIS", "n": 20, "q": "Which set correctly distinguishes the three relationships?", "o": ["Adjacency — connected roads; Connectivity — shared parcel boundary; Containment — outside feature", "Adjacency — shared boundary; Connectivity — connected features; Containment — one feature inside another", "Adjacency — pixel brightness; Connectivity — elevation; Containment — wavelength", "Adjacency — database key; Connectivity — metadata; Containment — projection"], "a": 1, "e": "Adjacency concerns neighbouring/shared boundaries, connectivity concerns linked features, and containment concerns one feature lying inside another. relationship."}, {"t": "Module 3 & 4: GPS + GIS", "n": 21, "q": "A planner wants to create a 100-m zone around a river and then identify parcels intersecting that zone.\nWhich sequence is most appropriate?", "o": ["Interpolation → Network Analysis", "Buffer → Spatial Query/selection", "Digitization → GPS trilateration", "Overlay → Metadata creation only"], "a": 1, "e": "Buffer creates the fixed-distance zone; spatial selection/query can then identify parcels falling within/intersecting it."}, {"t": "Module 3 & 4: GPS + GIS", "n": 22, "q": "Rainfall is known at several weather stations, but values are required at locations between the stations.\nWhich method is most directly suitable?", "o": ["Interpolation", "Network Analysis", "Digitization", "Containment analysis"], "a": 0, "e": "Interpolation estimates unknown values from nearby known sample points."}, {"t": "Module 3 & 4: GPS + GIS", "n": 23, "q": "Which scenario most clearly requires Network Analysis rather than simple Euclidean distance? / Simple", "o": ["Measuring straight-line distance between two wells", "Finding the shortest road route for an ambulance", "Calculating the area of a parcel polygon", "Identifying the owner of a selected parcel"], "a": 1, "e": "Network Analysis considers a connected network to determine shortest/optimal routes, such as ambulance routing."}, {"t": "Module 3 & 4: GPS + GIS", "n": 24, "q": "Which of the following statements regarding GIS components is incorrect?", "o": ["People include surveyors, GIS analysts and decision makers.", "Methods include SOPs for data collection and quality checking.", "Metadata is one of the five fundamental GIS components instead of Data.", "Hardware may include GNSS receivers, scanners and plotters."], "a": 2, "e": "The five fundamental components are Hardware, Software, Data, People and Methods. Metadata is a type of information describing data, not a replacement for the Data component."}, {"t": "Module 3 & 4: GPS + GIS", "n": 25, "q": "Match the software with the description given in the module.\n\nSoftware | Description\n\n1. QGIS | a. Cloud-based geospatial platform\n\n2. GEE | b. Free/open-source GIS\n\n3. ArcGIS | c. Developed by Esri\n\n4. GRASS GIS | d. Developed by U.S. Army CERL", "o": ["1-b, 2-a, 3-c, 4-d", "1-a, 2-b, 3-d, 4-c", "1-c, 2-d, 3-a, 4-b", "1-d, 2-c, 3-b, 4-a"], "a": 0, "e": "QGIS → free/open-source; GEE → cloud-based Google platform; ArcGIS → Esri; GRASS GIS → U.S. Army CERL."}, {"t": "Module 3 & 4: GPS + GIS", "n": 26, "q": "Which of the following statements about raster spatial resolution is correct without reversing the relationship?", "o": ["Larger pixel size generally means finer spatial detail.", "Smaller pixel size generally permits finer spatial detail.", "Pixel size has no relation to spatial detail.", "Smaller pixel size means lower spatial resolution."], "a": 1, "e": "Smaller pixel size generally means higher/finer spatial resolution and greater ability to represent smaller spatial details."}, {"t": "Module 3 & 4: GPS + GIS", "n": 27, "q": "A GIS analyst wants to calculate slope, aspect and viewshed from elevation information. Which input is most\ndirectly relevant?", "o": ["DEM", "Attribute table alone", "GPS receiver alone", "Road network only"], "a": 0, "e": "DEM provides elevation information from which slope, aspect and viewshed can be derived."}, {"t": "Module 3 & 4: GPS + GIS", "n": 28, "q": "Consider the following pairs.\n\n1. Buffer — Fixed-distance zone\n2. Overlay — Multiple thematic layers\n3. Interpolation — Unknown values from known points\n4. Network Analysis — Shortest/optimal route\n5. Digitization — Converting paper map into digital vector data\n\nHow many pairs are correctly matched?", "o": ["Two", "Three", "Four", "Five"], "a": 3, "e": "All five pairs correctly represent the functions specified in the module."}, {"t": "Module 3 & 4: GPS + GIS", "n": 29, "q": "Consider the following statements about GPS and GIS integration.\n\n1. GPS can provide coordinates that can be incorporated into GIS.\n2. GIS can analyse GPS-derived spatial information with other thematic layers.\n3. GPS itself performs all GIS overlay and network analyses.\n4. Modern surveying can integrate GPS/GNSS, Remote Sensing, LiDAR and drone data within GIS\nworkflows.\n\nHow many statements are correct?", "o": ["One", "Two", "Three", "Four"], "a": 2, "e": "Statements 1, 2 and 4 are correct. GPS supplies positioning information; GIS performs geographic data management and analysis."}, {"t": "Module 3 & 4: GPS + GIS", "n": 30, "q": "Consider the following statements carefully.\n\n1. A polygon parcel and its owner record can be linked through a unique identifier.\n\n2. A GCS normally uses latitude and longitude, whereas a PCS commonly uses linear units.\n3. Topology can help identify polygon overlaps, gaps and connectivity problems.\n4. Buffering creates a fixed-distance zone around a feature.\n5. Interpolation requires known sample points to estimate unknown values.\n6. GPS and GIS have identical primary functions because both are geospatial technologies.\n\nHow many of the above statements are correct?", "o": ["Three", "Four", "Five", "Six"], "a": 2, "e": "Statements 1–5 are correct. Statement 6 is the trap: GPS primarily determines position/navigation/time, whereas GIS manages and analyses geographic information. MODULE 5 - ADVANCED POSITIONING & SATELLITE COMMUNICATION TECHNOLOGY"}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 1, "q": "Which statement most accurately distinguishes trilateration from triangulation in the context of GNSS? / GNSS", "o": ["Trilateration determines position from angles, whereas triangulation uses distances.", "Trilateration determines position from distances, whereas triangulation primarily uses angles.", "Both determine position only from angles, but use different instruments.", "Both are identical because both form triangles between satellites and receiver."], "a": 1, "e": "GNSS uses trilateration based on measured distances/ranges, not conventional angle-based triangulation."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 2, "q": "Consider the following statements regarding the fourth satellite.\n\n1. Three satellites can provide a simplified 2D position.\n2. The fourth satellite helps resolve receiver clock error.\n3. The fourth satellite is needed for accurate 3D positioning.\n4. The fourth satellite eliminates atmospheric and multipath errors completely.\n\nHow many statements are correct?", "o": ["Only one", "Only two", "Only three", "All four"], "a": 2, "e": "Statements 1, 2 and 3 are correct. The fourth satellite does not completely eliminate atmospheric or multipath errors."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 3, "q": "A GPS receiver is functioning normally, but its calculated coordinates show a systematic shift because the\npredicted satellite orbit differs from the actual orbit. Which error is most directly involved? / GPS receiver", "o": ["Receiver clock error", "Multipath error", "Ephemeris/orbit error", "PDOP error"], "a": 2, "e": "The difference between predicted and actual satellite position is the satellite orbit/ephemeris error."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 4, "q": "Which one of the following correctly represents the GPS architecture?", "o": ["Space — satellites; Control — monitoring/orbit/clock management; User — receivers", "Space — receivers; Control — satellites; User — ground antennas only", "Space — CORS; Control — GNSS rovers; User — satellites", "Space — GIS software; Control — FDC; User — satellites"], "a": 0, "e": "GPS has three segments: Space, Control and User. The control segment monitors satellite health, clocks and orbit information."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 5, "q": "Which combination is correctly matched?", "o": ["GPS — 20,200 km — MEO — 55° inclination", "GPS — 35,786 km — GEO — 0° inclination", "GPS — 19,100 km — three orbital planes — 64.8°", "GPS — 23,222 km — three planes — 56°"], "a": 0, "e": "GPS satellites operate approximately at 20,200 km in MEO, with six orbital planes and about 55° inclination."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 6, "q": "A survey team establishes a fixed receiver on a point whose coordinates are already accurately known. During\nthe survey, it compares the computed position with the known position and sends corrections to moving receivers.\nThis setup is best described as:", "o": ["Rover", "Base Station", "NTRIP Client", "Standalone GNSS"], "a": 1, "e": "A Base Station is fixed on a known coordinate and generates correction information for rovers."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 7, "q": "Two receivers are operating close to one another at the same time. Why can differential correction work\neffectively?", "o": ["Both receivers necessarily have identical coordinates.", "Nearby receivers experience many common satellite and atmospheric errors.", "The rover does not use satellite signals.", "The base station measures only angles."], "a": 1, "e": "DGPS/Differential techniques exploit the fact that nearby receivers experience similar common errors at approximately the same time."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 8, "q": "Which observation would most strongly indicate that a survey is being performed using PP-DGPS rather than\nRT-DGPS?", "o": ["Corrections are received during the survey through radio.", "Corrected coordinates appear immediately in the controller.", "Base and rover raw observations are stored and processed after fieldwork.", "NTRIP connection is continuously maintained during observation."], "a": 2, "e": "Post-Processed DGPS stores observations first and applies corrections later using processing software."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 9, "q": "Which accuracy ordering is correct from generally poorer to finer positioning performance according to the\nsupplied module?", "o": ["RTK Fixed → DGPS → Standalone → Static", "Standalone → DGNSS/DGPS → RTK/NRTK → Static GNSS", "Static → Standalone → DGNSS → RTK", "DGPS → Standalone → Float → Static"], "a": 1, "e": "Approximate hierarchy: Standalone GNSS → DGNSS/DGPS → RTK/NRTK → Static GNSS, with static providing the highest survey accuracy in the supplied material."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 10, "q": "A rover displays RTK Float while a surveyor is standing on a legal property corner. Which action is most\nappropriate according to the supplied surveying guidance?", "o": ["Record the point immediately because Float is centimetre-level.", "Record only if PDOP is above 10.", "Wait for RTK Fixed before accepting the cadastral point.", "Switch to standalone GNSS because it is more stable."], "a": 2, "e": "RTK Float is approximately 20–50 cm in the supplied table and is not recommended for legal cadastral boundaries. RTK Fixed is preferred."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 11, "q": "Which of the following is the most appropriate distinction between RTK and NRTK?", "o": ["RTK uses multiple CORS stations; NRTK uses one temporary base only.", "RTK uses a reference base, while NRTK uses observations from multiple CORS stations through a network.", "RTK is post-processed; NRTK is always static.", "RTK uses code observations only; NRTK uses angles only."], "a": 1, "e": "Conventional RTK uses a single base reference, while NRTK uses multiple CORS observations and network-generated corrections. RTK → single reference base; NRTK → multiple CORS + network corrections."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 12, "q": "A Karnataka surveyor wants centimetre-level positioning over a large area without establishing a temporary\nbase station at every project site. Which combination is most appropriate?", "o": ["Standalone GNSS + GIS", "KSCN/CORS + NRTK + NTRIP", "Total Station + standalone GPS", "Static GNSS + paper map only"], "a": 1, "e": "KSCN provides a state-wide CORS framework; NRTK uses multiple CORS stations and NTRIP delivers corrections to the rover."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 13, "q": "Which statement about CORS is incorrect?", "o": ["It is permanently installed.", "It operates continuously.", "It requires the survey team to physically establish it at every project site.", "It can support multiple GNSS rovers."], "a": 2, "e": "CORS is a permanent reference station; its major advantage is that a temporary base need not be established at each field site."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 14, "q": "Consider the following sequence:\n\nCORS → ? → NTRIP Caster → Internet → NTRIP Client → Rover\n\nWhich component most appropriately fills the blank?", "o": ["NTRIP Server", "FDC only", "Total Station", "GIS Database"], "a": 0, "e": "The supplied NTRIP architecture is CORS → NTRIP Server → NTRIP Caster → Internet → Client → Rover. CORS observation data → NTRIP Server → Caster → Client → Rover."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 15, "q": "Which pair is correctly differentiated?", "o": ["NTRIP = correction message format; RTCM = Internet protocol", "NTRIP = Internet communication protocol; RTCM = correction message format", "NTRIP = satellite constellation; RTCM = coordinate datum", "NTRIP = GNSS receiver; RTCM = CORS station"], "a": 1, "e": "NTRIP is the transport/communication protocol, whereas RTCM is the standardized correction message format transmitted through it. NTRIP → Protocol; RTCM → Correction Message Format."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 16, "q": "A surveyor enters an IP address, port number, mount point, username and password into the controller.\nThese details most directly relate to:", "o": ["NTRIP access", "Satellite orbit determination", "Datum transformation", "Static baseline adjustment"], "a": 0, "e": "These are typical credentials and connection parameters for accessing an NTRIP correction service."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 17, "q": "Which statement about RTCM is the most technically appropriate within the supplied syllabus?", "o": ["RTCM determines satellite orbits.", "RTCM is a standardized format for GNSS correction messages.", "RTCM is a satellite constellation operated by the USA.", "RTCM replaces the GNSS antenna."], "a": 1, "e": "RTCM standardizes GNSS correction messages and promotes interoperability between equipment from different manufacturers."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 18, "q": "A GNSS rover is connected to a CORS service, but the correction stream suddenly stops. The rover changes\nfrom Fixed to Float. Which explanation is most appropriate?", "o": ["The receiver has gained perfect ambiguity resolution.", "Loss of correction data can cause the RTK solution to degrade from Fixed to Float or Single.", "PDOP has automatically become zero.", "The rover has changed from GNSS to GIS."], "a": 1, "e": "Continuous correction data is important for RTK. Loss of corrections can cause Fixed → Float → Single degradation."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 19, "q": "Which satellite geometry would generally produce the lowest PDOP?", "o": ["Satellites tightly clustered in one direction", "Satellites widely distributed across the sky", "All satellites near the horizon in one direction", "Four satellites hidden behind a building"], "a": 1, "e": "Widely distributed satellites provide stronger geometric strength and therefore generally lower DOP."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 20, "q": "Four observations have the following PDOP values: 1.6, 3.2, 5.4 and 8.1. Which observation has the best\ngeometry according to the supplied classification?", "o": ["1.6", "3.2", "5.4", "8.1"], "a": 0, "e": "Lower PDOP is better. A PDOP below 2 is classified as Excellent in the supplied table."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 21, "q": "A survey planner wants to minimize DOP before fieldwork. Which combination would most directly help? /\n\n1. Prefer widely distributed satellites.\n2. Use multiple constellations.\n3. Choose open-sky observation locations.\n4. Intentionally increase obstruction around the receiver.", "o": ["1 and 2 only", "1, 2 and 3 only", "2 and 4 only", "All four"], "a": 1, "e": "Wide distribution, multi-constellation availability and open sky improve geometry. Obstructions do the opposite."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 22, "q": "A receiver is configured with a 15° elevation mask. Which satellite is most likely to be rejected solely because\nof this setting?", "o": ["Satellite at 8° elevation", "Satellite at 16° elevation", "Satellite at 30° elevation", "Satellite at 75° elevation"], "a": 0, "e": "The elevation mask is the minimum accepted elevation. Signals below 15° are ignored."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 23, "q": "Raising the elevation mask from 10° to 15° creates which trade-off?", "o": ["More satellites are accepted and all atmospheric errors disappear.", "Fewer low-elevation satellites are accepted, potentially improving signal reliability but reducing satellite availability.", "Receiver changes from RTK to static automatically.", "PDOP becomes independent of satellite geometry."], "a": 1, "e": "Higher mask excludes low-elevation signals that are more vulnerable to atmospheric delay and multipath, but it also reduces the number of usable satellites."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 24, "q": "A rover is positioned beside a large metal structure. Direct satellite signals and reflected signals both reach\nthe antenna. Which pair of effects is most plausible?", "o": ["Multipath + reduced positioning accuracy", "Improved PDOP + perfect RTK Fix", "Datum change + increased satellite count", "NTRIP authentication + orbit correction"], "a": 0, "e": "Reflective metal surfaces are strong sources of multipath, which can reduce accuracy and lengthen RTK initialization."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 25, "q": "Which constellation-frequency pair is correctly matched?", "o": ["NavIC — L5 and S-band", "GPS — E1 and E5b", "Galileo — L1 and L2 only", "GLONASS — S-band 2492.028 MHz"], "a": 0, "e": "NavIC uses L5 (1176.45 MHz) and S-band (2492.028 MHz) in the supplied material. NavIC → L5 + S-band."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 26, "q": "Which sequence correctly represents the evolution from field observation to GIS output in a post-processed\nsurvey?", "o": ["GIS → Raw Data → Network Adjustment → Field Survey → Coordinate Transformation", "Raw Data Collection → Post-Processing → Network Adjustment → Coordinate Transformation → GIS", "Network Adjustment → Satellite Tracking → Raw Data → GIS → Post-Processing", "Coordinate Transformation → Field Survey → CORS → GIS → Raw Data"], "a": 1, "e": "The supplied workflow is GNSS Survey → Raw Data → Post-Processing → Network Adjustment → Coordinate Transformation → GIS Integration."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 27, "q": "Which statement correctly distinguishes RINEX from proprietary GNSS data formats?", "o": ["RINEX is manufacturer-independent and supports exchange between different equipment/software.", "RINEX can be used only by one receiver manufacturer.", "RINEX is a satellite constellation.", "RINEX is exclusively a cadastral map format."], "a": 0, "e": "RINEX (Receiver Independent Exchange Format) enables GNSS observation exchange independent of receiver manufacturer. RINEX → manufacturer-independent GNSS observation exchange format."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 28, "q": "A rover moves continuously along a corridor, records GNSS observations, and corrections are applied only\nafter returning from the field. Which method best fits this situation?", "o": ["RTK", "PPK", "Static GNSS", "NRTK only"], "a": 1, "e": "PPK (Post-Processed Kinematic) is designed for a moving rover whose corrections are applied after field collection. It is useful for corridors and drone mapping. Moving rover + correction after survey → PPK."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 29, "q": "A survey network contains several measured baselines with small inconsistencies. The objective is to\ndistribute measurement errors and obtain the most probable coordinates. Which method is most appropriate?", "o": ["Elevation Masking", "Least Squares Adjustment", "NTRIP Caster", "Multipath Filtering alone"], "a": 1, "e": "Least Squares Adjustment (LSA) minimizes the sum of squared residuals and provides the most probable adjusted values."}, {"t": "Module 5: Advanced Positioning & Satellite Comms", "n": 30, "q": "Consider the following statements carefully.\n\n1. CORS is a permanent reference station, whereas a temporary Base Station is established for a\nparticular survey.\n2. NRTK uses multiple CORS observations to generate network-based corrections.\n3. NTRIP is the correction message format, while RTCM is the Internet protocol.\n4. Low PDOP generally indicates stronger satellite geometry.\n5. RTK uses carrier-phase measurements for centimetre-level positioning.\n6. PPK requires a continuous Internet connection during field observation.\n7. PPP can achieve high-accuracy positioning without a nearby local base station, but convergence is\nrequired.\n\nHow many statements are correct?", "o": ["Four", "Five", "Six", "Seven"], "a": 1, "e": "Statements 1, 2, 4, 5 and 7 are correct. Statement 3 reverses NTRIP and RTCM; statement 6 is false because PPK is specifically useful where live Internet corrections are unavailable."}]</script>
<script>
const CFG={"key": "rp-ms-kit", "title": "Modern Survey — MCQ Kit Test", "sub": "Module-wise MCQs (RP Sir) · exam-style questions", "times": [30, 45, 60], "defTime": 45, "counts": [100, 50, 25], "shuffle": false};
const DATA=JSON.parse(document.getElementById('data').textContent).map((q,i)=>(q.id=i,q));
const TOPICS=[...new Set(DATA.map(q=>q.t))];
const app=document.getElementById('app');
let S=null,tick=null;
function h(t,a,...c){const e=document.createElement(t);for(const k in a||{}){const v=a[k];if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}for(const x of c.flat()){if(x==null||x===false)continue;e.append(x.nodeType?x:document.createTextNode(x))}return e}
const pad=n=>String(n).padStart(2,'0');
function fmt(s){s=Math.max(0,Math.round(s));const hh=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return hh?`${hh}:${pad(m)}:${pad(r)}`:`${m}:${pad(r)}`}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hist(){try{return JSON.parse(localStorage.getItem(CFG.key)||'[]')}catch(e){return[]}}
function saveHist(r){try{const a=hist();a.unshift(r);localStorage.setItem(CFG.key,JSON.stringify(a.slice(0,6)))}catch(e){}}
const L='ABCD';

function setup(){
  clearInterval(tick);S=null;
  let sel=new Set(TOPICS),cnt='all',per=CFG.defTime,sh=CFG.shuffle;
  const sum=h('div',{class:'mut'}),box=h('div');
  const avail=()=>DATA.filter(q=>sel.has(q.t));
  const nOf=()=>{const a=avail().length;return cnt==='all'?a:Math.min(cnt,a)};
  function draw(){
    const n=nOf();sum.textContent=n?`${n} questions · ${per}s each · total ${fmt(n*per)}`:'Select at least one topic';
    box.replaceChildren(
      h('h2',{},'Topics'),
      h('div',{class:'row'},TOPICS.map(t=>h('label',{class:'chk'},h('input',{type:'checkbox',...(sel.has(t)?{checked:''}:{}),onchange:e=>{e.target.checked?sel.add(t):sel.delete(t);draw()}}),`${t} (${DATA.filter(q=>q.t===t).length})`))),
      h('div',{class:'row',style:'margin-top:8px'},h('button',{class:'btn',onclick:()=>{sel=new Set(TOPICS);draw()}},'Select all'),h('button',{class:'btn',onclick:()=>{sel=new Set();draw()}},'Clear')),
      h('h2',{style:'margin-top:16px'},'Number of questions'),
      h('div',{class:'row'},['all',...CFG.counts].filter(c=>c==='all'||c<avail().length).map(c=>h('button',{class:'btn'+(cnt===c?' on':''),onclick:()=>{cnt=c;draw()}},c==='all'?'All':'Random '+c))),
      h('h2',{style:'margin-top:16px'},'Time per question'),
      h('div',{class:'row'},CFG.times.map(t=>h('button',{class:'btn'+(per===t?' on':''),onclick:()=>{per=t;draw()}},t+' s'))),
      h('label',{class:'chk',style:'margin-top:14px;width:fit-content'},h('input',{type:'checkbox',...(sh?{checked:''}:{}),onchange:e=>{sh=e.target.checked}}),'Shuffle option order'),
      h('div',{style:'margin-top:16px'},sum,h('button',{class:'btn pri',style:'margin-top:8px',onclick:()=>{if(nOf())start(shuf(avail()).slice(0,nOf()).sort((a,b)=>a.id-b.id),per,sh)}},'Start test'))
    );
  }
  draw();
  const H=hist();
  app.replaceChildren(h('h1',{},CFG.title),h('div',{class:'mut'},CFG.sub),
    h('div',{class:'card'},h('b',{},'Marking: '),'+1 correct · −0.25 wrong · 0 skipped. The test auto-submits when time runs out.'),
    h('div',{class:'card'},box),
    H.length?h('div',{class:'card'},h('h2',{},'Recent attempts'),h('div',{class:'tblw'},h('table',{},h('tr',{},['Date','Score','Accuracy'].map(x=>h('th',{},x))),H.map(r=>h('tr',{},h('td',{},r.d),h('td',{},`${r.s} / ${r.n}`),h('td',{},r.acc+'%')))))):null);
}

function start(list,per,sh){
  S={per,sh,i:0,done:false,confirm:false,qs:list.map(q=>{let o=q.o.map((t,k)=>({t,ok:k===q.a}));if(sh)o=shuf(o);return{id:q.id,t:q.t,n:q.n,q:q.q,e:q.e,o,pick:-1,mark:false}}),total:list.length*per};
  S.end=Date.now()+S.total*1000;
  clearInterval(tick);tick=setInterval(()=>{const r=(S.end-Date.now())/1000,el=document.getElementById('timer');if(el){el.textContent=fmt(r);el.className=r<=Math.max(60,S.total*.1)?'low':''}if(r<=0)submit()},500);
  view();
}
function go(i){S.i=Math.max(0,Math.min(S.qs.length-1,i));S.confirm=false;view()}
function pick(k){const q=S.qs[S.i];q.pick=q.pick===k?-1:k;view()}
function view(){
  const q=S.qs[S.i],n=S.qs.length,ans=S.qs.filter(x=>x.pick>=0).length;
  const pal=h('div',{class:'pal'},S.qs.map((x,i)=>h('button',{class:(x.pick>=0?'ans ':'')+(x.mark?'mk ':'')+(i===S.i?'cur':''),onclick:()=>go(i)},i+1)));
  app.replaceChildren(
    h('div',{class:'top'},h('div',{},h('b',{},`Q ${S.i+1} / ${n}`),h('span',{class:'mut'},`  · answered ${ans}`)),h('div',{class:'row'},h('span',{id:'timer'},fmt((S.end-Date.now())/1000)),h('button',{class:'btn pri',onclick:()=>{S.confirm=true;view()}},'Submit'))),
    S.confirm?h('div',{class:'banner'},`${n-ans} unanswered, ${S.qs.filter(x=>x.mark).length} marked for review. Submit now?  `,h('button',{class:'btn pri',onclick:submit},'Yes, submit'),' ',h('button',{class:'btn',onclick:()=>{S.confirm=false;view()}},'Keep going')):null,
    h('div',{class:'grid'},
      h('div',{class:'card'},h('span',{class:'tag'},q.t),q.mark?h('span',{class:'tag'},'⚑ marked'):null,
        h('div',{class:'stem'},q.q),
        q.o.map((o,k)=>h('button',{class:'opt'+(q.pick===k?' sel':''),onclick:()=>pick(k)},h('b',{},L[k]),h('span',{},o.t))),
        h('div',{class:'row',style:'margin-top:12px'},h('button',{class:'btn',onclick:()=>go(S.i-1)},'← Prev'),h('button',{class:'btn',onclick:()=>go(S.i+1)},'Next →'),
          h('button',{class:'btn'+(q.mark?' on':''),onclick:()=>{q.mark=!q.mark;view()}},'Mark (M)'),h('button',{class:'btn',onclick:()=>{q.pick=-1;view()}},'Clear')),
        h('div',{class:'mut',style:'margin-top:8px;font-size:.85rem'},'Keys: 1–4 or A–D answer · ←/→ move · M mark · Backspace clear')),
      h('div',{class:'card'},h('h2',{},'Palette'),pal,h('div',{class:'mut',style:'font-size:.8rem;margin-top:8px'},'Blue = answered · amber outline = marked'))));
}
document.addEventListener('keydown',e=>{
  if(!S||S.done||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();
  if('1234'.includes(k)&&k.length===1)pick(+k-1);else if('abcd'.includes(k)&&k.length===1)pick('abcd'.indexOf(k));
  else if(k==='arrowright')go(S.i+1);else if(k==='arrowleft')go(S.i-1);else if(k==='m'){S.qs[S.i].mark=!S.qs[S.i].mark;view()}else if(k==='backspace'||k==='delete'){S.qs[S.i].pick=-1;view()}
});

function submit(){
  if(!S||S.done)return;clearInterval(tick);S.done=true;S.used=Math.min(S.total,S.total-(S.end-Date.now())/1000);
  let c=0,w=0;S.qs.forEach(q=>{if(q.pick<0)return;q.o[q.pick].ok?c++:w++});
  S.c=c;S.w=w;S.sk=S.qs.length-c-w;S.score=c-w*.25;
  saveHist({d:new Date().toLocaleString(),s:S.score,n:S.qs.length,acc:S.qs.length?Math.round(c/S.qs.length*100):0});
  S.filter='all';results();
}
function results(){
  const n=S.qs.length,att=S.c+S.w;
  const rows=[...new Set(S.qs.map(q=>q.t))].map(t=>{const a=S.qs.filter(q=>q.t===t),c=a.filter(q=>q.pick>=0&&q.o[q.pick].ok).length,w=a.filter(q=>q.pick>=0&&!q.o[q.pick].ok).length;return{t,n:a.length,c,w,sk:a.length-c-w,s:c-w*.25,p:Math.round(c/a.length*100)}});
  const st=q=>q.pick<0?'sk':q.o[q.pick].ok?'ok':'bad';
  const shown=S.qs.map((q,i)=>({q,i})).filter(({q})=>S.filter==='all'||(S.filter==='wrong'&&st(q)==='bad')||(S.filter==='skip'&&st(q)==='sk')||(S.filter==='right'&&st(q)==='ok'));
  const redo=S.qs.filter(q=>st(q)!=='ok');
  app.replaceChildren(
    h('h1',{},'Result'),
