<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Modern Surveying | Problems & Formulas Test</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet"><style>
:root{
  --paper:#EEF2F4; --card:#FFFFFF; --ink:#12263A; --muted:#566878; --line:#CBD5DC;
  --accent:#0E7C86; --accent-ink:#FFFFFF; --accent-soft:#DDF0F2;
  --good:#1E7D3A; --good-soft:#E1F3E6; --bad:#B3261E; --bad-soft:#FBE6E4;
  --mark:#B7791F; --mark-soft:#FBF0D9;
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1A24; --card:#17262F; --ink:#E6EEF2; --muted:#9BB0BD; --line:#2B3E4A;
    --accent:#3DB5BF; --accent-ink:#05222A; --accent-soft:#12363C;
    --good:#55C27A; --good-soft:#143323; --bad:#FF8A80; --bad-soft:#3B1A18;
    --mark:#E8B84A; --mark-soft:#3A2F12;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1A24; --card:#17262F; --ink:#E6EEF2; --muted:#9BB0BD; --line:#2B3E4A;
  --accent:#3DB5BF; --accent-ink:#05222A; --accent-soft:#12363C;
  --good:#55C27A; --good-soft:#143323; --bad:#FF8A80; --bad-soft:#3B1A18;
  --mark:#E8B84A; --mark-soft:#3A2F12;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 56px}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:8px;padding:10px 18px;font-weight:600}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.topline{display:flex;justify-content:flex-end;margin-bottom:6px}
.topline button{border:none;background:none;color:var(--muted);font-size:14px;text-decoration:underline;padding:4px}
/* Home */
.hero{position:relative;overflow:hidden;border:1.5px solid var(--ink);border-radius:14px;background:var(--card);padding:34px 28px 30px}
.hero svg{position:absolute;right:-60px;top:-40px;width:520px;height:420px;pointer-events:none}
.hero svg *{fill:none;stroke:var(--line);stroke-width:1.4}
.hero svg .idx{stroke:var(--accent);stroke-width:2;opacity:.7}
.hero > *:not(svg){position:relative}
.hero h1{font-size:clamp(30px,6vw,52px);font-weight:800;max-width:17ch;letter-spacing:-.02em}
.hero p{max-width:65ch;color:var(--muted);margin:14px 0 0}
.kicker{display:inline-flex;align-items:center;gap:8px;margin-bottom:13px;color:var(--accent);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.rules{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.rule{border:1.5px solid var(--line);border-radius:8px;padding:8px 14px;background:var(--paper);font-size:14px}
.rule b{font-family:var(--mono);font-size:17px;display:block}
.rule.plus b{color:var(--good)} .rule.minus b{color:var(--bad)}
.panel{margin-top:22px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:22px}
.panel h2{font-size:22px;margin-bottom:4px}.panel .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.coverage{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:10px}
.cover{border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--paper);display:flex;gap:10px;align-items:flex-start}
.cover strong{font-family:var(--head);font-size:15px;line-height:1.2}.cover span{display:block;color:var(--muted);font-size:13px;margin-top:4px}.cover .count{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:10px}
.chip{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--paper);user-select:none}
.chip input{width:18px;height:18px;accent-color:var(--accent);flex:none}.chip span.n{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted)}.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.mini{display:flex;gap:14px;margin-bottom:12px}.mini button{border:none;background:none;color:var(--accent);font-weight:600;padding:2px 0;text-decoration:underline}
.opts{display:flex;flex-wrap:wrap;gap:20px}.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
select{font:inherit;padding:9px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.summary{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;margin-top:22px;padding-top:18px;border-top:1.5px dashed var(--line)}
.summary .big{font-family:var(--mono);font-weight:600;font-size:18px}.summary .grow{flex:1}.hist{width:100%;border-collapse:collapse;font-size:14px}.hist td,.hist th{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}.hist th{color:var(--muted);font-weight:500}
.source-note{margin-top:14px;padding:10px 12px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:14px}
/* Quiz */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:10px 0;border-bottom:1.5px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}.bar .title{font-family:var(--head);font-weight:700;font-size:18px}.bar .grow{flex:1}
.timer{font-family:var(--mono);font-weight:600;font-size:22px;border:1.5px solid var(--ink);border-radius:8px;padding:4px 12px;background:var(--card);min-width:112px;text-align:center}.timer.low{color:var(--bad);border-color:var(--bad);animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{background:var(--bad-soft)}}@media (prefers-reduced-motion:reduce){.timer.low{animation:none}}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;background:var(--accent);width:0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;margin-top:18px;align-items:start}@media (max-width:820px){.layout{grid-template-columns:1fr}}
.qcard{border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:22px}.qmeta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:12px;font-size:14px;color:var(--muted)}.qmeta .tag{border:1.5px solid var(--line);border-radius:999px;padding:2px 10px}.qmeta .no{font-family:var(--mono);color:var(--ink);font-weight:600}.qtext{font-size:20px;font-weight:500;line-height:1.4;margin:0 0 18px;max-width:70ch;white-space:pre-line;overflow-wrap:anywhere}
.options{display:grid;gap:10px}.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:12px 14px;white-space:pre-line;overflow-wrap:anywhere}.opt:hover{border-color:var(--accent)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600}.opt.sel{border-color:var(--accent);background:var(--accent-soft)}.opt.sel .l{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.opt.good{border-color:var(--good);background:var(--good-soft)}.opt.good .l{background:var(--good);border-color:var(--good);color:var(--card)}.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--card)}.opt[disabled]{cursor:default}
.nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.nav .grow{flex:1}.btn.mk.on{background:var(--mark-soft);border-color:var(--mark);color:var(--mark)}
.side{border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:16px;position:sticky;top:76px}.side h3{font-size:16px;margin-bottom:10px}.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;max-height:390px;overflow:auto;padding:2px}.pb{height:38px;border-radius:7px;border:1.5px solid var(--line);background:var(--paper);font-family:var(--mono);font-size:13px;font-weight:600;position:relative}.pb.ans{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.pb.mk::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--mark);border:1.5px solid var(--card)}.pb.cur{outline:3px solid var(--ink);outline-offset:1px}.legend{display:grid;gap:6px;margin-top:14px;font-size:13px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:8px}.legend i{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line);background:var(--paper);display:inline-block}.legend i.a{background:var(--accent);border-color:var(--accent)}.legend i.m{background:var(--mark);border-color:var(--mark);border-radius:50%}.counts{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px;font-family:var(--mono)}
.tip{margin:14px 0 0;color:var(--muted);font-size:13px}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,20,30,.6);display:grid;place-items:center;padding:20px;z-index:20}.modal .box{background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:24px;max-width:420px;width:100%}.modal h2{font-size:22px;margin-bottom:8px}.modal .row{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
/* Results */
.score{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;border:1.5px solid var(--ink);border-radius:14px;background:var(--card);padding:26px}@media (max-width:640px){.score{grid-template-columns:1fr}}
.ring{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;text-align:center;border:10px solid var(--accent);font-family:var(--head)}.ring b{font-size:38px;font-weight:800;display:block;line-height:1}.ring small{font-family:var(--body);color:var(--muted);font-size:13px}.ring.neg{border-color:var(--bad)}.verdict{font-family:var(--head);font-size:26px;font-weight:700;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.stat{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper)}.stat b{font-family:var(--mono);font-size:20px;display:block}.stat span{font-size:13px;color:var(--muted)}.stat.g b{color:var(--good)}.stat.r b{color:var(--bad)}
.secs{width:100%;border-collapse:collapse;font-size:14px}.secs th,.secs td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}.secs th{color:var(--muted);font-weight:500}.secs td.num{font-family:var(--mono)}.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:80px}.meter i{display:block;height:100%;background:var(--accent)}.meter i.weak{background:var(--bad)}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.filters button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500}.filters button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}.rv{border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:18px;margin-bottom:12px}.rv .qtext{font-size:17px;margin-bottom:12px}.rv .res{font-family:var(--mono);font-size:13px;font-weight:600;margin-left:auto}.rv .res.g{color:var(--good)}.rv .res.r{color:var(--bad)}.rv .res.s{color:var(--muted)}.exp{margin-top:12px;padding:10px 12px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:14px;white-space:pre-line}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.hide{display:none!important}
</style></head><body><div class="wrap" id="app"></div><script>
const DATA = [{"t":"Scale & Distance","n":1,"q":"A surveyor measured the distance between two points on a plan drawn to a scale of 1 cm = 40 m and obtained 468 m. Later, it was found that the scale used was 1 cm = 20 m. What is the true distance between the points? (GATE CE 2025)","o":["468 m","936 m","234 m","1872 m"],"a":1,"e":"Map length = 468 / 20 = 23.4 cm. True distance = 23.4 × 40 = 936 m."},{"t":"Scale & Distance","n":2,"q":"A map has a scale of 1:25,000. If the distance between two points on the map is 4 cm, what is the ground distance? (UPPSC)","o":["100 m","1 km","10 km","625 m"],"a":1,"e":"Ground = 4 × 25,000 = 100,000 cm = 1 km."},{"t":"Scale & Distance","n":3,"q":"A plan is prepared at a scale of 1:1000. If the plan is reduced so that a 100 mm line becomes 90 mm, what is the new scale? (GATE)","o":["1:900","1:1000","Approximately 1:1111","1:1250"],"a":2,"e":"New scale = 1000 × 100/90 ≈ 1:1111."},{"t":"Scale & Distance","n":4,"q":"On a plan, 1 cm represents 50 m on the ground. A line measures 7.2 cm on the plan. What is its ground length?","o":["36 m","144 m","360 m","3600 m"],"a":2,"e":"Ground = 7.2 × 50 = 360 m."},{"t":"Scale & Distance","n":5,"q":"A ground distance of 2.5 km is to be shown on a 1:50,000 map. What will be its map length?","o":["0.5 cm","5 cm","12.5 cm","50 cm"],"a":1,"e":"2.5 km = 250,000 cm; 250,000 / 50,000 = 5 cm."},{"t":"Coordinates","n":6,"q":"The coordinates of two points are A(10, 20) and B(13, 24). Find the distance AB. (GATE-type)","o":["3 units","4 units","5 units","7 units"],"a":2,"e":"D = √[(13−10)² + (24−20)²] = √(9+16) = √25 = 5 units."},{"t":"Coordinates","n":7,"q":"The differences in Easting and Northing between two survey stations are 30 m and 40 m. Find the distance between them. (BPSC)","o":["35 m","50 m","70 m","10 m"],"a":1,"e":"D = √(30² + 40²) = √2500 = 50 m."},{"t":"Coordinates","n":8,"q":"The coordinates of two points are (100 m, 200 m) and (400 m, 600 m). Find the distance between them. (UPPSC)","o":["300 m","400 m","500 m","700 m"],"a":2,"e":"ΔX = 300, ΔY = 400; D = √(300² + 400²) = 500 m."},{"t":"Coordinates","n":9,"q":"Find the distance between P(0, 0) and Q(5, 12).","o":["7 units","12 units","13 units","17 units"],"a":2,"e":"D = √(25 + 144) = √169 = 13 units."},{"t":"Coordinates","n":10,"q":"In a coordinate pair P(X, Y) used in surveying, which axis value is the Easting?","o":["Y","X","Z","H"],"a":1,"e":"Easting = X, Northing = Y."},{"t":"Height & Slope","n":11,"q":"A line has a horizontal distance of 100 m and a difference in elevation of 10 m. Find the percentage slope. (GATE)","o":["1%","10%","0.1%","100%"],"a":1,"e":"Slope % = (ΔH / D) × 100 = (10/100) × 100 = 10%."},{"t":"Height & Slope","n":12,"q":"A line has a horizontal distance of 40 m and a difference in elevation of 30 m. Find its slope distance. (BPSC)","o":["10 m","35 m","50 m","70 m"],"a":2,"e":"S = √(40² + 30²) = √2500 = 50 m."},{"t":"Height & Slope","n":13,"q":"A line has a horizontal distance of 100 m and makes an angle of 30° with the horizontal. Find the difference in elevation. (UPPSC)","o":["50 m","About 57.7 m","About 86.6 m","About 173.2 m"],"a":1,"e":"ΔH = D tan θ = 100 × tan 30° ≈ 57.7 m."},{"t":"Height & Slope","n":14,"q":"A slope line is 13 m long and its horizontal distance is 12 m. What is the difference in elevation?","o":["1 m","5 m","12 m","25 m"],"a":1,"e":"ΔH = √(S² − D²) = √(169 − 144) = 5 m."},{"t":"Height & Slope","n":15,"q":"A ground rises 20 m over a horizontal distance of 80 m. Find the percentage slope.","o":["4%","20%","25%","40%"],"a":2,"e":"Slope % = 20/80 × 100 = 25%."},{"t":"Height & Slope","n":16,"q":"Point 1 is at 215.4 m and point 2 is at 248.9 m above datum. What is ΔH = H2 − H1?","o":["33.5 m","−33.5 m","464.3 m","23.5 m"],"a":0,"e":"ΔH = 248.9 − 215.4 = 33.5 m."},{"t":"Photogrammetry Scale","n":17,"q":"A camera with focal length 20 cm takes vertical aerial photographs. Average terrain elevation is 1200 m above MSL. At what height above MSL must the aircraft fly for
