<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Computer Applications Revision Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2F4; --card:#FFFFFF; --ink:#12263A; --muted:#566878; --line:#CBD5DC;
  --accent:#0E7C86; --accent-ink:#FFFFFF; --accent-soft:#DDF0F2;
  --good:#1E7D3A; --good-soft:#E1F3E6; --bad:#B3261E; --bad-soft:#FBE6E4;
  --mark:#B7791F; --mark-soft:#FBF0D9;
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1A24; --card:#17262F; --ink:#E6EEF2; --muted:#9BB0BD; --line:#2B3E4A;
    --accent:#3DB5BF; --accent-ink:#05222A; --accent-soft:#12363C;
    --good:#55C27A; --good-soft:#143323; --bad:#FF8A80; --bad-soft:#3B1A18;
    --mark:#E8B84A; --mark-soft:#3A2F12;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1A24; --card:#17262F; --ink:#E6EEF2; --muted:#9BB0BD; --line:#2B3E4A;
  --accent:#3DB5BF; --accent-ink:#05222A; --accent-soft:#12363C;
  --good:#55C27A; --good-soft:#143323; --bad:#FF8A80; --bad-soft:#3B1A18;
  --mark:#E8B84A; --mark-soft:#3A2F12;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 56px}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:8px;padding:10px 18px;font-weight:600}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.topline{display:flex;justify-content:flex-end;margin-bottom:6px}
.topline button{border:none;background:none;color:var(--muted);font-size:14px;text-decoration:underline;padding:4px}

/* Home */
.hero{position:relative;overflow:hidden;border:1.5px solid var(--ink);border-radius:14px;background:var(--card);padding:34px 28px 30px}
.hero svg{position:absolute;right:-60px;top:-40px;width:520px;height:420px;pointer-events:none}
.hero svg *{fill:none;stroke:var(--line);stroke-width:1.4}
.hero svg .idx{stroke:var(--accent);stroke-width:2;opacity:.7}
.hero > *:not(svg){position:relative}
.hero h1{font-size:clamp(30px,6vw,52px);font-weight:800;max-width:15ch;letter-spacing:-.02em}
.hero p{max-width:56ch;color:var(--muted);margin:14px 0 0}
.rules{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.rule{border:1.5px solid var(--line);border-radius:8px;padding:8px 14px;background:var(--paper);font-size:14px}
.rule b{font-family:var(--mono);font-size:17px;display:block}
.rule.plus b{color:var(--good)} .rule.minus b{color:var(--bad)}
.panel{margin-top:22px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:22px}
.panel h2{font-size:22px;margin-bottom:4px}
.panel .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.chip{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--paper);user-select:none}
.chip input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.chip span.n{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted)}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.mini{display:flex;gap:14px;margin-bottom:12px}
.mini button{border:none;background:none;color:var(--accent);font-weight:600;padding:2px 0;text-decoration:underline}
.opts{display:flex;flex-wrap:wrap;gap:20px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
select{font:inherit;padding:9px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.summary{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;margin-top:22px;padding-top:18px;border-top:1.5px dashed var(--line)}
.summary .big{font-family:var(--mono);font-weight:600;font-size:18px}
.summary .grow{flex:1}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist td,.hist th{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.hist th{color:var(--muted);font-weight:500}

/* Quiz */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:10px 0;border-bottom:1.5px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar .title{font-family:var(--head);font-weight:700;font-size:18px}
.bar .grow{flex:1}
.timer{font-family:var(--mono);font-weight:600;font-size:22px;border:1.5px solid var(--ink);border-radius:8px;padding:4px 12px;background:var(--card);min-width:112px;text-align:center}
.timer.low{color:var(--bad);border-color:var(--bad);animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{background:var(--bad-soft)}}
@media (prefers-reduced-motion:reduce){.timer.low{animation:none}}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;margin-top:18px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.qcard{border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:22px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:12px;font-size:14px;color:var(--muted)}
.qmeta .tag{border:1.5px solid var(--line);border-radius:999px;padding:2px 10px}
.qmeta .no{font-family:var(--mono);color:var(--ink);font-weight:600}
.qtext{font-size:20px;font-weight:500;line-height:1.4;margin:0 0 18px;max-width:62ch}
.options{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:12px 14px}
.opt:hover{border-color:var(--accent)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.good .l{background:var(--good);border-color:var(--good);color:var(--card)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt[disabled]{cursor:default}
.nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.nav .grow{flex:1}
.btn.mk.on{background:var(--mark-soft);border-color:var(--mark);color:var(--mark)}
.side{border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:16px}
.side h3{font-size:16px;margin-bottom:10px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;max-height:340px;overflow:auto;padding:2px}
.pb{height:38px;border-radius:7px;border:1.5px solid var(--line);background:var(--paper);font-family:var(--mono);font-size:13px;font-weight:600;position:relative}
.pb.ans{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pb.mk::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--mark);border:1.5px solid var(--card)}
.pb.cur{outline:3px solid var(--ink);outline-offset:1px}
.legend{display:grid;gap:6px;margin-top:14px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line);background:var(--paper);display:inline-block}
.legend i.a{background:var(--accent);border-color:var(--accent)}
.legend i.m{background:var(--mark);border-color:var(--mark);border-radius:50%}
.counts{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px;font-family:var(--mono)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,20,30,.6);display:grid;place-items:center;padding:20px;z-index:20}
.modal .box{background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:24px;max-width:420px;width:100%}
.modal h2{font-size:22px;margin-bottom:8px}
.modal .row{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}

/* Results */
.score{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;border:1.5px solid var(--ink);border-radius:14px;background:var(--card);padding:26px}
@media (max-width:640px){.score{grid-template-columns:1fr}}
.ring{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;text-align:center;border:10px solid var(--accent);font-family:var(--head)}
.ring b{font-size:38px;font-weight:800;display:block;line-height:1}
.ring small{font-family:var(--body);color:var(--muted);font-size:13px}
.ring.neg{border-color:var(--bad)}
.verdict{font-family:var(--head);font-size:26px;font-weight:700;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper)}
.stat b{font-family:var(--mono);font-size:20px;display:block}
.stat span{font-size:13px;color:var(--muted)}
.stat.g b{color:var(--good)} .stat.r b{color:var(--bad)}
.secs{width:100%;border-collapse:collapse;font-size:14px}
.secs th,.secs td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.secs th{color:var(--muted);font-weight:500}
.secs td.num{font-family:var(--mono)}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.weak{background:var(--bad)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.filters button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500}
.filters button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.rv{border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:18px;margin-bottom:12px}
.rv .qtext{font-size:17px;margin-bottom:12px}
.rv .res{font-family:var(--mono);font-size:13px;font-weight:600;margin-left:auto}
.rv .res.g{color:var(--good)} .rv .res.r{color:var(--bad)} .rv .res.s{color:var(--muted)}
.exp{margin-top:12px;padding:10px 12px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ---------- Question bank (answer first; options are shuffled at runtime) ---------- */
const W="MS Word", X="MS Excel", P="MS PowerPoint", A="AutoCAD", D="2D Drafting & 3D", G="GIS & QGIS",
      O="OGC & PostGIS", L="SDLC & Land Records", H="APIs & Web", J="Java & Tech Stack";
const SECS=[W,X,P,A,D,G,O,L,H,J];

const RAW=[
/* ======================= MS WORD ======================= */
[W,"MS Office, the collection of office applications by Microsoft, was introduced in:","1988","1983","1990","1995","Office 1988; Word itself first released 1983."],
[W,"MS Word was first released in:","1983","1988","1975","1992","Word first released 1983."],
[W,"The original name of MS Word was:","Multi-Tool Word","Multi-Task Word","Micro Word","Office Writer","Original name: Multi-Tool Word."],
[W,"MS Word was developed by:","Charles Simonyi & Richard Brodie","Bill Gates & Paul Allen","Dan Bricklin & Bob Frankston","Steve Jobs & Steve Wozniak","Developers: Charles Simonyi & Richard Brodie."],
[W,"Word, Excel and PowerPoint are respectively used for:","Word processing, spreadsheet, presentation","Spreadsheet, presentation, word processing","Presentation, word processing, spreadsheet","Database, spreadsheet, presentation","Word = word processing, Excel = spreadsheet, PowerPoint = presentation."],
[W,"The modern default file extension of an MS Word document is:",".docx",".doc",".dotx",".wrd","Older format is .doc; modern is .docx."],
[W,"Which command in Start → Run launches MS Word?","winword","msword","word.exe","wordpad","Start → Run → winword → Enter."],
[W,"The default name of a new Word file is:","Document1.docx","Word1.docx","Book1.docx","Untitled1.doc","Book1 belongs to Excel; Presentation1 to PowerPoint."],
[W,"Which Word component shows the document / application name?","Title Bar","Status Bar","Ribbon","Ruler","Title Bar shows the name."],
[W,"The collection of commands in Word is called the:","Ribbon","Work Area","Scroll Bar","Zoom Slider","Ribbon = collection of commands; Tabs organise them."],
[W,"In Word, Tabs are used to:","Organise commands","Show page information","Zoom in/out","Move through the document","Tabs organise commands."],
[W,"The Status Bar in Word shows:","Page/document information","Margins","Insertion point","Commands","Status Bar = page/document info."],
[W,"The area where you type and edit text is the:","Work Area","Title Bar","Ribbon","Status Bar","Work Area = typing/editing."],
[W,"The insertion point in Word is called the:","Cursor","Scroll bar","Zoom slider","Ruler","Cursor = insertion point."],
[W,"Scroll Bars are used to:","Move through the document","Zoom in and out","Change views","Set margins","Scroll bars move through the document."],
[W,"The Zoom Slider is used to:","Zoom in/out","Change the font","Set indents","Insert tables","Zoom Slider = zoom in/out."],
[W,"The Screen Split feature lets you:","View different parts of a document simultaneously","Divide a page into columns","Split a table into two","Print two copies","Screen Split = view different parts at once."],
[W,"The horizontal ruler controls the:","Left/right margins","Top/bottom margins","Font size","Page colour","Horizontal → left/right margins."],
[W,"The vertical ruler controls the:","Top/bottom margins","Left/right margins","Zoom level","Text colour","Vertical → top/bottom margins."],
[W,"Which of these is NOT an indent type in Word?","Diagonal","First Line","Hanging","Negative","Indents: First Line, Hanging, Positive, Negative."],
[W,"The Mailings tab is mainly used for:","Mail Merge","Proofing","Page Setup","Macros","Mailings → Mail Merge."],
[W,"TOC, Footnotes, Citations and Index are found in the ___ tab.","References","Insert","Review","View","References tab."],
[W,"Themes, Page Setup and Background are in the ___ tab.","Page Layout","Home","Review","Mailings","Page Layout tab."],
[W,"Proofing, Comments, Tracking and Protect belong to the ___ tab.","Review","View","References","Insert","Review tab."],
[W,"Tables, Pictures, Links, Header/Footer and Symbols are in the ___ tab.","Insert","Home","Page Layout","Mailings","Insert tab."],
[W,"Font, Paragraph, Styles and Editing groups are found in the ___ tab.","Home","Insert","View","References","Home tab."],
[W,"Views, Zoom, Window and Macros are found in the ___ tab.","View","Review","Home","Mailings","View tab."],
[W,"Portrait orientation of a page is:","Vertical","Horizontal","Diagonal","Square","Portrait = vertical; Landscape = horizontal."],
[W,"Landscape orientation of a page is:","Horizontal","Vertical","Circular","Folded","Landscape = horizontal."],
[W,"Find & Replace is used to:","Search and substitute text","Check grammar only","Insert pictures","Change page colour","Find & Replace = search and substitute."],
[W,"The Thesaurus in Word provides:","Synonyms","Spelling errors","Hyperlinks","Page numbers","Thesaurus → synonyms."],
[W,"Spell Check in Word:","Finds spelling errors","Gives synonyms","Inserts bullets","Sets margins","Spell Check → finds spelling errors."],
[W,"Bullets create a(n) ___ list, while Numbering creates a(n) ___ list.","unordered; ordered","ordered; unordered","nested; flat","hidden; visible","Bullets = unordered; Numbering = ordered."],
[W,"OLE in MS Office stands for:","Object Linking and Embedding","Object Layout Editor","Online Linked Editing","Open Library Extension","OLE = Object Linking and Embedding."],
[W,"Which of the following does OLE support?","Charts, equations, pictures, audio/video","Only plain text","Only tables","Only macros","OLE supports charts, equations, pictures, audio/video."],
[W,"The default paragraph alignment in Word is:","Left","Centre","Right","Justify","Default alignment: Left."],
[W,"AutoCorrect in Word:","Automatically corrects common typing/spelling/grammar errors","Saves the file automatically","Encrypts the document","Prints automatically","AutoCorrect fixes common errors."],
[W,"Which is NOT a way to save a document in Word?","Ctrl + Q","File → Save","The Save button","Ctrl + S","Ctrl+S, File → Save or Save button."],
[W,"Ctrl + ← / → in Word moves the cursor:","One word left/right","One character left/right","One paragraph","To start/end of line","Ctrl + ←/→ = word."],
[W,"Ctrl + ↑ / ↓ in Word moves the cursor by:","One paragraph","One word","One line","One page","Ctrl + ↑/↓ = paragraph."],
[W,"Ctrl + Home / Ctrl + End moves to:","Document beginning / end","Line beginning / end","Page top / bottom","Paragraph start / end","Beginning / end of the document."],
[W,"Ctrl + A in Word:","Selects all","Aligns left","Opens Autocorrect","Adds a comment","Ctrl + A = Select All."],
[W,"Ctrl + Spacebar in Word:","Clears character formatting","Inserts a non-breaking space","Selects a word","Opens spelling","Ctrl + Spacebar clears character formatting."],
[W,"Ctrl + Y in Word is:","Redo","Undo","Copy","Cut","Ctrl+Z undo, Ctrl+Y redo."],
[W,"Ctrl + Del deletes:","The next word","The previous word","The whole line","The paragraph","Ctrl + Del = next word."],
[W,"Ctrl + Backspace deletes:","The previous word","The next word","The whole paragraph","The selected page","Ctrl + Backspace = previous word."],
[W,"Which shortcut aligns text to the centre?","Ctrl + E","Ctrl + C","Ctrl + L","Ctrl + J","L = Left, E = Centre, R = Right, J = Justify."],
[W,"Ctrl + J in Word:","Justifies the text","Left aligns","Right aligns","Centres","J = Justify."],
[W,"Ctrl + M in Word applies:","Indent","Hanging indent","Hyperlink","Mail Merge","Ctrl+M = Indent; Ctrl+T = Hanging Indent."],
[W,"Ctrl + T in Word applies:","Hanging Indent","Indent","Tab stop","Title style","Ctrl + T = hanging indent."],
[W,"Ctrl + K in Word inserts a:","Hyperlink","Comment","Table","Header","Ctrl + K = Hyperlink."],
[W,"Ctrl + D in Word opens the:","Font dialog","Date dialog","Delete dialog","Draw dialog","Ctrl + D = Font dialog."],
[W,"Ctrl + Shift + > increases the:","Font size","Line spacing","Indent","Zoom","Ctrl+Shift+> / < = increase / decrease font."],
[W,"Ctrl + Shift + L in Word applies:","Bullets","Left alignment","Line break","Lock","Ctrl+Shift+L = Bullets."],
[W,"Which shortcut gives double line spacing?","Ctrl + 2","Ctrl + 1","Ctrl + 5","Ctrl + 0","1 = single, 2 = double, 5 = 1.5 spacing."],
[W,"Ctrl + 5 in Word gives:","1.5 line spacing","Single spacing","Double spacing","6-pt paragraph spacing","Ctrl + 5 = 1.5 spacing."],
[W,"Ctrl + 0 in Word adds:","6-pt paragraph spacing","Double spacing","No spacing","A zero margin","Ctrl + 0 = 6-pt paragraph spacing."],
[W,"Ctrl + F in Word is used for:","Find","Format","File","Footnote","Ctrl + F = Find."],
[W,"Print Preview in Word is shown using:","Ctrl + F2","Ctrl + P","F12","Shift + F12","Ctrl+F2 preview; Ctrl+P print."],
[W,"Which key opens Help in Word?","F1","F4","F7","F12","F1 = Help."],
[W,"F4 in Word:","Repeats the last action","Opens Save As","Starts Spell Check","Opens Help","F4 = Repeat."],
[W,"F5 in Word opens:","Find / Replace / Go To","Spelling & Grammar","Save As","Thesaurus","F5 = Find/Replace/Go To."],
[W,"Which key starts Spelling & Grammar?","F7","F5","F12","F4","F7 = Spelling & Grammar."],
[W,"F12 in Word opens:","Save As","Print","Save","Help","F12 = Save As; Shift+F12 = Save."],
[W,"Shift + F12 in Word:","Saves the document","Opens Save As","Prints","Opens Thesaurus","Shift + F12 = Save."],
[W,"Shift + F3 in Word:","Changes case","Opens Thesaurus","Saves","Finds","Shift + F3 = Change Case."],
[W,"Shift + F7 in Word opens the:","Thesaurus","Spell checker","Font dialog","Print dialog","Shift + F7 = Thesaurus."],
[W,"Shift + Enter in Word inserts a:","Soft line break","Page break","Section break","Paragraph","Shift + Enter = soft line break."],
[W,"Ctrl + Shift + 8 in Word:","Shows/hides the ¶ paragraph marks","Inserts a bullet","Adds a line","Zooms to 80%","Ctrl+Shift+8 = Show/Hide ¶."],
[W,"Shift + Alt + D inserts the current:","Date","Time","Day","Document name","Shift+Alt+D = Date; Shift+Alt+T = Time."],
[W,"Ctrl + Alt + 1 applies:","Heading 1","Single spacing","Page 1 view","Bullets","Ctrl+Alt+1/2/3 = Heading 1/2/3."],
[W,"In Word, triple-clicking in a paragraph:","Selects the paragraph","Selects the word","Selects the line","Selects the document","Triple-click = paragraph; double-click = word."],
[W,"In Word, double-clicking a word:","Selects the word","Selects the paragraph","Opens Find","Inserts a tab stop","Double-click word = select word."],
[W,"Ctrl + Mouse Wheel in Word:","Zooms","Scrolls horizontally","Changes font size","Changes page","Ctrl + Mouse Wheel = Zoom."],
[W,"Double-clicking after text on a line in Word sets a:","Tab stop","Bullet","Heading","Margin","Double-click after text → tab stop; blank line area → alignment."],

/* ======================= MS EXCEL ======================= */

const BANK=RAW.map(r=>({s:r[0],q:r[1],a:r[2],w:[r[3],r[4],r[5]],e:r[6]||""}));

/* ---------- State ---------- */
const PLUS=1, MINUS=0.25;
const LS="ca_quiz_history_v1";
const app=document.getElementById("app");
let sel=new Set(SECS), cntSel="all", secPer=45;
let qs=[], ans=[], marked=[], cur=0, endAt=0, totalSec=0, startedAt=0, timerId=null, mode="home", filter="all";

/* ---------- Helpers ---------- */
function el(tag,attrs,...kids){
  const n=document.createElement(tag);
  if(attrs)for(const k in attrs){
    const v=attrs[k];
    if(v==null||v===false)continue;
    if(k==="class")n.className=v;
    else if(k.startsWith("on"))n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v===true?"":v);
  }
  kids.flat(Infinity).forEach(c=>{if(c==null||c===false)return;n.append(c.nodeType?c:document.createTextNode(String(c)))});
  return n;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(sec){sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return (h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(s).padStart(2,"0")}
function num(x){return (Math.round(x*100)/100).toFixed(2).replace(/\.00$/,"")}
function loadHist(){try{return JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){return[]}}
function saveHist(r){try{const h=loadHist();h.unshift(r);localStorage.setItem(LS,JSON.stringify(h.slice(0,6)))}catch(e){}}
function clearHist(){try{localStorage.removeItem(LS)}catch(e){}}
function counts(){const c={};SECS.forEach(s=>c[s]=0);BANK.forEach(b=>c[b.s]++);return c}
function poolFor(){return BANK.filter(b=>sel.has(b.s))}
function plannedCount(){const n=poolFor().length;return cntSel==="all"?n:Math.min(n,+cntSel)}

function themeToggle(){
  const root=document.documentElement;
  const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  root.dataset.theme=dark?"light":"dark";
  if(mode==="home")render();
}
function topline(){return el("div",{class:"topline"},el("button",{onclick:themeToggle,type:"button"},"Switch light / dark theme"))}

/* ---------- Home ---------- */
function renderHome(){
  const c=counts();
  const n=plannedCount(), tsec=n*secPer;
  const contours=`<svg viewBox="0 0 520 420" aria-hidden="true">
    <g transform="translate(300 190) rotate(-22)">
      <ellipse rx="40" ry="24"/><ellipse rx="80" ry="50"/><ellipse class="idx" rx="125" ry="80"/>
      <ellipse rx="170" ry="112"/><ellipse rx="215" ry="146"/><ellipse class="idx" rx="262" ry="182"/>
      <ellipse rx="310" ry="220"/>
    </g></svg>`;
  const hero=el("section",{class:"hero"},
    el("h1",null,"Computer Applications revision quiz"),
    el("p",null,"Every topic from the RP Sir Classes notes: Word, Excel, PowerPoint, AutoCAD, 2D drafting and 3D, QGIS, PostGIS, land-records IT, web technologies and Java. Timed, scored and explained."),
    el("div",{class:"rules"},
      el("div",{class:"rule plus"},el("b","+1"),"each correct answer"),
      el("div",{class:"rule minus"},el("b","−0.25"),"each wrong answer"),
      el("div",{class:"rule"},el("b","0"),"for questions you skip"),
      el("div",{class:"rule"},el("b",String(BANK.length)),"questions in the bank")
    ));
  hero.insertAdjacentHTML("afterbegin",contours);

  const chips=el("div",{class:"chips"},SECS.map(s=>{
    const cb=el("input",{type:"checkbox",checked:sel.has(s),onchange:e=>{e.target.checked?sel.add(s):sel.delete(s);render()}});
    return el("label",{class:"chip"+(sel.has(s)?" on":"")},cb,el("span",null,s),el("span",{class:"n"},c[s]));
  }));
  const pick=el("section",{class:"panel"},
    el("h2",null,"Choose what to test"),
    el("p",{class:"sub"},"All topics are selected by default for a full revision."),
    el("div",{class:"mini"},
      el("button",{type:"button",onclick:()=>{sel=new Set(SECS);render()}},"Select all"),
      el("button",{type:"button",onclick:()=>{sel=new Set();render()}},"Clear all")),
    chips,
    el("div",{class:"opts",style:"margin-top:20px"},
      el("div",{class:"field"},el("label",{for:"cnt"},"Number of questions"),
        el("select",{id:"cnt",onchange:e=>{cntSel=e.target.value;render()}},
          [["all","All selected"],["100","100 random"],["50","50 random"],["25","25 random"]].map(([v,t])=>el("option",{value:v,selected:cntSel===v},t)))),
      el("div",{class:"field"},el("label",{for:"spq"},"Time per question"),
        el("select",{id:"spq",onchange:e=>{secPer=+e.target.value;render()}},
          [[30,"30 seconds (hard)"],[45,"45 seconds (standard)"],[60,"60 seconds (relaxed)"]].map(([v,t])=>el("option",{value:v,selected:secPer===v},t))))
    ),
    el("div",{class:"summary"},
      el("div",null,el("div",{class:"big"},n+" questions"),"Maximum score "+n),
      el("div",null,el("div",{class:"big"},fmt(tsec)),"Time limit"),
      el("div",{class:"grow"}),
      el("button",{class:"btn primary",type:"button",disabled:n===0,onclick:()=>startTest(poolFor())},"Start test")
    ));

  const h=loadHist();
  const hist=h.length?el("section",{class:"panel"},
    el("h2",null,"Recent attempts"),
    el("p",{class:"sub"},"Saved in this browser only."),
    el("table",{class:"hist"},
      el("thead",null,el("tr",null,["When","Score","Correct","Wrong","Skipped","Time used"].map(t=>el("th",null,t)))),
      el("tbody",null,h.map(r=>el("tr",null,
        el("td",null,new Date(r.t).toLocaleString([], {dateStyle:"medium",timeStyle:"short"})),
        el("td",null,num(r.score)+" / "+r.total),el("td",null,r.c),el("td",null,r.w),el("td",null,r.s),el("td",null,fmt(r.used)))))),
    el("div",{style:"margin-top:12px"},el("button",{class:"btn",type:"button",onclick:()=>{clearHist();render()}},"Clear history"))):null;

  app.replaceChildren(topline(),hero,pick,hist);
}

/* ---------- Quiz ---------- */
function startTest(pool){
  let p=shuffle(pool.slice());
  if(cntSel!=="all"&&pool.length===poolFor().length&&pool.every(x=>sel.has(x.s)))p=p.slice(0,+cntSel);
  qs=p.map(b=>{const o=shuffle([b.a,...b.w]);return {...b,o,ci:o.indexOf(b.a)}});
  ans=qs.map(()=>-1);marked=qs.map(()=>false);cur=0;filter="all";
  totalSec=qs.length*secPer;startedAt=Date.now();endAt=startedAt+totalSec*1000;
  mode="quiz";render();
  clearInterval(timerId);timerId=setInterval(tick,500);
  window.scrollTo(0,0);
}
function tick(){
  const left=(endAt-Date.now())/1000;
  const t=document.getElementById("timer");
  if(t){t.textContent=fmt(left);t.classList.toggle("low",left<=Math.max(60,totalSec*.1))}
  if(left<=0){clearInterval(timerId);finish(true)}
}
function answeredCount(){return ans.filter(a=>a>=0).length}

function renderQuiz(){
  const q=qs[cur];
  const bar=el("div",{class:"bar"},
    el("div",{class:"title"},"Question "+(cur+1)+" of "+qs.length),
    el("div",{class:"grow"}),
    el("div",{class:"timer",id:"timer",role:"timer","aria-label":"Time remaining"},fmt((endAt-Date.now())/1000)),
    el("button",{class:"btn danger",type:"button",onclick:askSubmit},"Submit test"));
  const prog=el("div",{class:"prog"},el("i",{style:"width:"+(answeredCount()/qs.length*100)+"%"}));

  const letters="ABCD";
  const options=el("div",{class:"options",role:"radiogroup","aria-label":"Answer options"},
    q.o.map((t,i)=>el("button",{type:"button",role:"radio","aria-checked":ans[cur]===i,class:"opt"+(ans[cur]===i?" sel":""),
      onclick:()=>{ans[cur]=ans[cur]===i?-1:i;render()}},
      el("span",{class:"l"},letters[i]),el("span",null,t))));

  const card=el("section",{class:"qcard"},
    el("div",{class:"qmeta"},el("span",{class:"no"},"Q"+(cur+1)),el("span",{class:"tag"},q.s),
      marked[cur]?el("span",{class:"tag",style:"color:var(--mark);border-color:var(--mark)"},"Marked for review"):null),
    el("p",{class:"qtext"},q.q),options,
    el("div",{class:"nav"},
      el("button",{class:"btn",type:"button",disabled:cur===0,onclick:()=>go(cur-1)},"Previous"),
      el("button",{class:"btn",type:"button",disabled:ans[cur]<0,onclick:()=>{ans[cur]=-1;render()}},"Clear answer"),
      el("button",{class:"btn mk"+(marked[cur]?" on":""),type:"button",onclick:()=>{marked[cur]=!marked[cur];render()}},marked[cur]?"Unmark":"Mark for review"),
      el("div",{class:"grow"}),
      el("button",{class:"btn primary",type:"button",disabled:cur===qs.length-1,onclick:()=>go(cur+1)},"Next")),
    el("p",{class:"sub",style:"margin:14px 0 0;font-size:13px;color:var(--muted)"},"Keys: 1–4 or A–D to answer, ← → to move, M to mark."));

  const pal=el("div",{class:"pal"},qs.map((_,i)=>el("button",{type:"button","aria-label":"Go to question "+(i+1),
    class:"pb"+(ans[i]>=0?" ans":"")+(marked[i]?" mk":"")+(i===cur?" cur":""),onclick:()=>go(i)},String(i+1))));
  const side=el("aside",{class:"side"},
    el("h3",null,"Question palette"),
    el("div",{class:"counts"},el("span",null,"Answered "+answeredCount()),el("span",null,"Left "+(qs.length-answeredCount()))),
    pal,
    el("div",{class:"legend"},
      el("span",null,el("i",{class:"a"}),"Answered"),
      el("span",null,el("i"),"Not answered"),
      el("span",null,el("i",{class:"m"}),"Marked for review")));

  app.replaceChildren(bar,prog,el("div",{class:"layout"},card,side));
  tick();
}
function go(i){cur=Math.max(0,Math.min(qs.length-1,i));render();window.scrollTo(0,0)}

function askSubmit(){
  const un=qs.length-answeredCount(), mk=marked.filter(Boolean).length;
  const left=Math.max(0,(endAt-Date.now())/1000);
  const m=el("div",{class:"modal",id:"modal",role:"dialog","aria-modal":"true","aria-labelledby":"mt"},
    el("div",{class:"box"},
      el("h2",{id:"mt"},"Submit your test?"),
      el("p",null,"You have answered "+answeredCount()+" of "+qs.length+" questions. "+
        (un?un+" unanswered will score 0. ":"")+(mk?mk+" still marked for review. ":"")+fmt(left)+" remaining."),
      el("div",{class:"row"},
        el("button",{class:"btn",type:"button",onclick:()=>m.remove()},"Keep going"),
        el("button",{class:"btn primary",type:"button",onclick:()=>{m.remove();finish(false)}},"Submit now"))));
  document.body.append(m);
  m.querySelector(".btn").focus();
}

/* ---------- Results ---------- */
function compute(){
  let c=0,w=0,s=0;const by={};
  qs.forEach((q,i)=>{
    by[q.s]=by[q.s]||{n:0,c:0,w:0,s:0};const b=by[q.s];b.n++;
    if(ans[i]<0){s++;b.s++}else if(ans[i]===q.ci){c++;b.c++}else{w++;b.w++}
  });
  return {c,w,s,by,score:c*PLUS-w*MINUS,total:qs.length*PLUS};
}
let result=null;
function finish(auto){
  clearInterval(timerId);
  const used=Math.min(totalSec,(Date.now()-startedAt)/1000);
  result=compute();result.used=used;result.auto=auto;
  saveHist({t:Date.now(),score:result.score,total:result.total,c:result.c,w:result.w,s:result.s,used});
  mode="result";filter="all";render();window.scrollTo(0,0);
}
function verdict(p){
  if(p>=90)return "Outstanding. Exam-ready.";
  if(p>=75)return "Strong result. Polish the weak topics.";
  if(p>=55)return "Decent base. Revise the red topics below.";
  if(p>=35)return "Needs work. Re-read the notes, then retry.";
  return "Start with the notes, then retake the test.";
}
function renderResult(){
  const r=result,pct=r.total?r.score/r.total*100:0,att=r.c+r.w;
  const acc=att?r.c/att*100:0;
  const head=el("section",{class:"score"},
    el("div",{class:"ring"+(r.score<0?" neg":"")},el("div",null,el("b",null,num(r.score)),el("small",null,"out of "+r.total))),
    el("div",null,
      el("div",{class:"verdict"},(r.auto?"Time is up. ":"")+verdict(pct)),
      el("div",{class:"stats"},
        el("div",{class:"stat g"},el("b",null,r.c),el("span",null,"Correct (+"+num(r.c*PLUS)+")")),
        el("div",{class:"stat r"},el("b",null,r.w),el("span",null,"Wrong (−"+num(r.w*MINUS)+")")),
        el("div",{class:"stat"},el("b",null,r.s),el("span",null,"Skipped")),
        el("div",{class:"stat"},el("b",null,num(acc)+"%"),el("span",null,"Accuracy on attempted")),
        el("div",{class:"stat"},el("b",null,num(pct)+"%"),el("span",null,"Net score")),
        el("div",{class:"stat"},el("b",null,fmt(r.used)),el("span",null,"Time used of "+fmt(totalSec))))));

  const rows=Object.keys(r.by).sort((a,b)=>SECS.indexOf(a)-SECS.indexOf(b)).map(k=>{
    const b=r.by[k],sc=b.c-b.w*MINUS,p=b.n?sc/b.n*100:0;
    return el("tr",null,el("td",null,k),el("td",{class:"num"},b.c+"/"+b.n),el("td",{class:"num"},b.w),el("td",{class:"num"},b.s),
      el("td",{class:"num"},num(sc)),
      el("td",null,el("div",{class:"meter"},el("i",{class:p<50?"weak":"",style:"width:"+Math.max(0,Math.min(100,p))+"%"}))));
  });
  const secs=el("section",{class:"panel"},el("h2",null,"Topic-wise performance"),
    el("p",{class:"sub"},"Bars under 50% net score are shown in red; those are your priority topics."),
    el("div",{style:"overflow-x:auto"},el("table",{class:"secs"},
      el("thead",null,el("tr",null,["Topic","Correct","Wrong","Skipped","Score","Net %"].map(t=>el("th",null,t)))),
      el("tbody",null,rows))));

  const miss=qs.map((q,i)=>i).filter(i=>ans[i]!==qs[i].ci);
  const actions=el("div",{class:"actions"},
    el("button",{class:"btn primary",type:"button",disabled:!miss.length,onclick:()=>{
      cntSel="all";startTest(miss.map(i=>BANK.find(b=>b.q===qs[i].q)))}},"Retry wrong and skipped ("+miss.length+")"),
    el("button",{class:"btn",type:"button",onclick:()=>{mode="home";render();window.scrollTo(0,0)}},"New test"));

  const F=[["all","All"],["wrong","Wrong"],["skipped","Skipped"],["correct","Correct"],["marked","Marked"]];
  const filters=el("div",{class:"filters",role:"group","aria-label":"Filter review"},F.map(([k,t])=>
    el("button",{type:"button",class:filter===k?"on":"","aria-pressed":filter===k,onclick:()=>{filter=k;render()}},t)));

  const list=qs.map((q,i)=>({q,i})).filter(({q,i})=>{
    const st=ans[i]<0?"skipped":ans[i]===q.ci?"correct":"wrong";
    return filter==="all"||filter===st||(filter==="marked"&&marked[i]);
  }).map(({q,i})=>{
    const st=ans[i]<0?"s":ans[i]===q.ci?"g":"r";
    return el("article",{class:"rv"},
      el("div",{class:"qmeta"},el("span",{class:"no"},"Q"+(i+1)),el("span",{class:"tag"},q.s),
        el("span",{class:"res "+st},st==="g"?"+1":st==="r"?"−0.25":"Skipped (0)")),
      el("p",{class:"qtext"},q.q),
      el("div",{class:"options"},q.o.map((t,k)=>{
        const good=k===q.ci,bad=k===ans[i]&&!good;
        return el("div",{class:"opt"+(good?" good":"")+(bad?" bad":""),style:"cursor:default"},
          el("span",{class:"l"},"ABCD"[k]),el("span",null,t+(good?"  (correct)":"")+(bad?"  (your answer)":"")));
      })),
      q.e?el("div",{class:"exp"},q.e):null);
  });
  const review=el("section",{style:"margin-top:26px"},el("h2",null,"Answer review"),filters,
    list.length?list:el("p",{class:"sub"},"Nothing in this filter."));
  app.replaceChildren(topline(),head,secs,actions,review);
}

/* ---------- Router + keyboard ---------- */
function render(){
  if(mode==="home")renderHome();else if(mode==="quiz")renderQuiz();else renderResult();
}
document.addEventListener("keydown",e=>{
  if(mode!=="quiz"||document.getElementById("modal"))return;
  if(e.target.tagName==="SELECT"||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if("1234".includes(k)&&k.length===1){ans[cur]=+k-1;render()}
  else if("abcd".includes(k)&&k.length===1){ans[cur]="abcd".indexOf(k);render()}
  else if(k==="arrowright"||k==="n")go(cur+1);
  else if(k==="arrowleft"||k==="p")go(cur-1);
  else if(k==="m"){marked[cur]=!marked[cur];render()}
});
window.addEventListener("beforeunload",e=>{if(mode==="quiz"){e.preventDefault();e.returnValue=""}});
render();
</script>
</body>
